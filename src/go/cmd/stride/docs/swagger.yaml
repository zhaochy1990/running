definitions:
  api.JobCatalogEntry:
    properties:
      description:
        type: string
      example_input:
        type: object
      input_schema:
        type: object
      type:
        example: watch_sync
        type: string
      user_initiable:
        type: boolean
    type: object
  api.PipelineCatalogEntry:
    properties:
