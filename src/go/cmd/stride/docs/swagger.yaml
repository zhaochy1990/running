info:
  contact: {}
  description: 'HTTP API fronting the STRIDE worker: create and track async jobs and
    pipeline runs, and manage user profile, onboarding, and watch-provider login.'
  title: STRIDE API
  version: "1.0"
paths:
  /api/{user}/activities:
    get:
      description: Returns a filtered, paginated activity page (newest first) plus
        run-distance/duration/count summaries for every Shanghai month on the page.
        A user caller may only list their own activities; an internal caller may list
        any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Page size 1–200 (default 50)
        in: query
        name: limit
        type: integer
      - description: Exact sport_name filter
        in: query
        name: sport
        type: string
      - description: run | strength
        in: query
        name: sport_category
        type: string
      - description: Minimum distance in km
        in: query
        name: min_distance_km
        type: number
      - description: Shanghai YYYY-MM-DD lower bound
        in: query
        name: date_from
        type: string
      - description: Shanghai YYYY-MM-DD upper bound
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.activitiesListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: List a user's activities
      tags:
      - activities
  /api/{user}/activities/{labelId}:
    get:
      description: Assembles the activity, objective training load, laps, strength
        segments, watch-reported zones, and (with ?include=timeseries) the downsampled
        timeseries. A user caller may only read their own activities; an internal
        caller may read any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Activity label id
        in: path
        name: labelId
        required: true
        type: string
      - description: Comma list; pass 'timeseries' to inline the series
        in: query
        name: include
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.activityDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Get one activity's detail
      tags:
      - activities
  /api/users/{uid}/pipelines:
    get:
      description: Lists the pipeline runs for a user (the subject whose data they
        operate on), most recent first. A user caller may only list their own runs
        (uid must equal their JWT sub); an internal caller may list any uid.
      parameters:
      - description: User id (the subject; JWT sub)
        in: path
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.userPipelinesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: List a user's pipeline runs
      tags:
      - pipelines
  /api/users/me/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.profileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user's profile, onboarding state and features
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Persists the five onboarding core fields, marks profile_ready,
        and best-effort mirrors the display name to the auth-service.
      parameters:
      - description: Profile core fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.profileInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.validationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Save the current user's basic profile
      tags:
      - users
  /api/users/me/watch:
    delete:
      description: Deletes the stored watch credential and marks watch_ready=false.
        Synced activity/health data is retained. Returns 400 when no watch is bound.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.disconnectWatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Disconnect the current user's watch
      tags:
      - users
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.watchInfoResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Get the connected watch's status
      tags:
      - users
  /api/users/me/watch/login:
    post:
      consumes:
      - application/json
      description: Authenticates the watch account, persists credentials, and marks
        watch_ready. Provider is selected in the body; region applies to Garmin. Triggers
        no sync.
      parameters:
      - description: Watch provider credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.watchLoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.watchLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Connect a watch provider (COROS/Garmin)
      tags:
      - users
  /jobs:
    get:
      description: Returns every job type the system supports (hardcoded in the catalog),
        each with its input JSON schema and an example input. Static system metadata;
        no auth required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.jobCatalogResponse'
      summary: List supported job types
      tags:
      - catalog
    post:
      consumes:
      - application/json
      description: Creates a job and publishes it to the worker. Internal callers
        may target any user and any cataloged job type; user callers may only create
        user-initiable types and the subject user is derived from their token. Supply
        an Idempotency-Key header to make retries safe.
      parameters:
      - description: Deduplicates creation; a repeat key returns the existing job
          (200)
        in: header
        name: Idempotency-Key
        type: string
      - description: Job to enqueue
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Existing job returned for a repeated Idempotency-Key
          schema:
            $ref: '#/definitions/api.enqueueJobResponse'
        "202":
          description: Enqueued
          schema:
            $ref: '#/definitions/api.enqueueJobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Enqueue an async job
      tags:
      - jobs
  /jobs/{job_id}:
    get:
      parameters:
      - description: Job id
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.jobStateResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Get a job's status
      tags:
      - jobs
  /pipelines:
    get:
      description: Returns every pipeline the system supports (hardcoded in the catalog),
        each with its ordered steps, input JSON schema and an example input. Static
        system metadata; no auth required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pipelineCatalogResponse'
      summary: List supported pipelines
      tags:
      - catalog
  /pipelines/{name}:
    post:
      consumes:
      - application/json
      description: Starts a named pipeline (a linear sequence of jobs). Internal callers
        may start any cataloged pipeline for any user; user callers may only start
        user-initiable pipelines for themselves. Supply an Idempotency-Key header
        to make retries safe.
      parameters:
      - description: Pipeline name
        in: path
        name: name
        required: true
        type: string
      - description: Deduplicates creation; a repeat key returns the existing run
          (200)
        in: header
