  /api/{user}/sync:
    post:
      consumes:
      - application/json
      description: 'Starts a pipeline only and returns immediately (202) with a run
        id; Web clients poll GET /api/pipelines/{run_id}. The pipeline syncs watch
        data and then computes derived metrics (training load, PMC, personal bests).
        Mode picks the pipeline: "incremental" (default) syncs only new activities
        and computes only those; "full" re-syncs history, recomputes the athlete baseline,
        and does a full compute. A successful full pipeline does not complete onboarding:
        the user must explicitly finalize its successful run through POST /api/users/me/onboarding/complete.
        This is the async Go replacement for the Python POST /api/{user}/sync. A user
        caller may only sync their own id (path {user} must equal their JWT sub);
        an internal caller may sync any user (path {user} must be a UUID).'
      parameters:
      - description: User id (JWT sub, or any user UUID for internal callers)
        in: path
        name: user
        required: true
        type: string
      - description: Deduplicates creation; a repeat key returns the existing run
          (200)
        in: header
        name: Idempotency-Key
        type: string
      - description: Optional sync options; omitted mode defaults to incremental
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.syncRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Existing run returned for a repeated Idempotency-Key
          schema:
            $ref: '#/definitions/api.startPipelineResponse'
        "202":
          description: Started
          schema:
            $ref: '#/definitions/api.startPipelineResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Trigger a watch-data sync (+ compute) for a user
      tags:
      - sync
