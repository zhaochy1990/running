      - injuries
    put:
      consumes:
      - application/json
      parameters:
      - description: Injury id
        in: path
        name: injuryId
        required: true
        type: string
      - description: Complete replacement
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.injuryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.injuryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Replace an injury record
      tags:
      - injuries
  /api/users/me/master-plan/current:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.currentSeasonPlanEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user's active season training plan
      tags:
      - master-plan
  /api/users/me/onboarding/complete:
    post:
      consumes:
      - application/json
      description: Marks onboarding complete after the user explicitly submits a completed
        run_id. The run must belong to the caller, use the onboarding pipeline, and
        have finished successfully; profile and watch readiness are also required.
        A 409 means the run is missing, belongs to another user, is not an onboarding
        run, or is not done. This endpoint never starts or retries pipeline work.
      parameters:
      - description: Completed onboarding pipeline run
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.onboardingCompleteInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.onboardingCompleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Finalize the current user's onboarding
      tags:
      - users
  /api/users/me/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.profileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user's profile, onboarding state and features
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Updates supplied core profile fields only. Omitted fields are preserved;
        explicit null and unsupported fields return 422. The profile must already
        exist.
      parameters:
      - description: Core profile fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.profilePatchInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.profilePatchResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.validationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Partially update the current user's basic profile
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Persists the five onboarding core fields, marks profile_ready,
        and best-effort mirrors the display name to the auth-service.
      parameters:
      - description: Profile core fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.profileInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.validationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Save the current user's basic profile
      tags:
      - users
  /api/users/me/training-goal:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.goalResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user's active race goal
      tags:
      - training-goal
    post:
      consumes:
      - application/json
      description: Creates a new active race goal and archives the previous active
        one. race_date must be a future date in Asia/Shanghai.
      parameters:
      - description: Race goal fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.goalInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.goalResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.validationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Set (create) the current user's race goal
      tags:
      - training-goal
    put:
      consumes:
      - application/json
      description: Edits the active race goal in place. goal_id must match the current
        active goal. race_date must be a future date in Asia/Shanghai.
      parameters:
      - description: Race goal fields (with goal_id)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.goalUpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.goalResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.validationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Update the current user's active race goal
      tags:
      - training-goal
  /api/users/me/watch:
    delete:
      description: Deletes the stored watch credential and clears watch-dependent
        onboarding state. Synced activity/health data is retained. Returns 400 when
        no watch is bound.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.disconnectWatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
