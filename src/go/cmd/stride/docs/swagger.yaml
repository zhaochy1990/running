            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Get the connected watch's status
      tags:
      - users
  /api/users/me/watch/login:
    post:
      consumes:
      - application/json
      description: Authenticates the watch account, persists credentials, and marks
        watch_ready. Provider is selected in the body; region applies to Garmin. Triggers
        no sync.
      parameters:
      - description: Watch provider credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.watchLoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.watchLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
