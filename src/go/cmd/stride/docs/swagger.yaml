          $ref: '#/definitions/api.goalInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.goalResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.validationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: Set (create) the current user's race goal
      tags:
      - training-goal
    put:
      consumes:
      - application/json
      description: Edits the active race goal in place. goal_id must match the current
        active goal. race_date must be a future date in Asia/Shanghai.
      parameters:
      - description: Race goal fields (with goal_id)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.goalUpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.goalResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
