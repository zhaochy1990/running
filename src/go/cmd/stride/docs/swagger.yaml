info:
  contact: {}
  description: 'HTTP API fronting the STRIDE worker: create and track async jobs and
    pipeline runs, and manage user profile, onboarding, and watch-provider login.'
  title: STRIDE API
  version: "1.0"
paths:
  /api/{user}/ability/backfill:
    post:
      description: Enqueues an ability compute job that recomputes + persists the
        ability_snapshot for the last `days` days (default 180, max 365), returning
        {job_id, days_requested}.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Days to backfill 7–365 (default 180)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Backfill ability snapshots
      tags:
      - ability
  /api/{user}/ability/current:
    get:
      description: Reads the pre-computed ability_snapshot rows for today; when none
        exist (or ?refresh=1) it live-computes from the source without persisting.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Force a live compute
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Today's ability snapshot
      tags:
      - ability
  /api/{user}/ability/history:
    get:
      description: Pivoted per-day ability history (date, l4_composite, l4_marathon_race_s,
        l4_hm_race_s, l3 scores) over the last `days` days, oldest first. Days missing
        from the snapshot table are absent (no synthesis).
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Window 1–365 (default 90)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Ability history
      tags:
      - ability
  /api/{user}/ability/weights:
    get:
      description: Returns the L4 composite weights so the frontend can render the
        weighting without duplicating constants.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Ability L4 weights
      tags:
      - ability
  /api/{user}/activities:
    get:
      description: Returns a filtered, paginated activity page (newest first) plus
        run-distance/duration/count summaries for every Shanghai month on the page.
        A user caller may only list their own activities; an internal caller may list
        any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Page size 1–200 (default 50)
        in: query
        name: limit
        type: integer
      - description: Exact sport_name filter
        in: query
        name: sport
        type: string
      - description: run | strength
        in: query
        name: sport_category
        type: string
      - description: Minimum distance in km
        in: query
        name: min_distance_km
        type: number
      - description: Shanghai YYYY-MM-DD lower bound
        in: query
        name: date_from
        type: string
      - description: Shanghai YYYY-MM-DD upper bound
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.activitiesListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: List a user's activities
      tags:
      - activities
  /api/{user}/activities/{label_id}/ability:
    get:
      description: Returns an activity's L1 quality, breakdown and contribution. 404
        when no row exists (the per-activity ability pipeline hasn't computed it).
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Activity label id
        in: path
        name: label_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Single-activity ability
      tags:
      - ability
  /api/{user}/activities/{labelId}:
    get:
      description: Assembles the activity, objective training load, laps, strength
        segments, watch-reported zones, and (with ?include=timeseries) the downsampled
        timeseries. A user caller may only read their own activities; an internal
        caller may read any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Activity label id
        in: path
        name: labelId
        required: true
        type: string
      - description: Comma list; pass 'timeseries' to inline the series
        in: query
        name: include
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.activityDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Get one activity's detail
      tags:
      - activities
  /api/{user}/body-composition:
    get:
      description: Returns scans newest-first, each with derived fields and per-segment
        breakdown. A user caller may only read their own data; an internal caller
        may read any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Only return scans from the most recent N days (1-3650)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.bodyCompositionListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - BearerAuth: []
      summary: List body-composition scans
      tags:
      - body-composition
    post:
      consumes:
      - application/json
      description: Creates or replaces a scan keyed by (user, scan_date). When segments
        are provided, all existing segments for the scan are replaced atomically.
        A user caller may only write their own data; an internal caller may write
        any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Scan data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.bodyCompositionScanInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.bodyCompositionScanDTO'
        "401":
