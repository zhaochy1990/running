  /jobs:
    get:
      description: Returns every job type the system supports (hardcoded in the catalog),
        each with its input JSON schema and an example input. Static system metadata;
        no auth required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.jobCatalogResponse'
      summary: List supported job types
      tags:
      - catalog
    post:
      consumes:
      - application/json
      description: Creates a job and publishes it to the worker. Internal callers
        may target any user and any cataloged job type; user callers may only create
        user-initiable types and the subject user is derived from their token. Supply
        an Idempotency-Key header to make retries safe.
      parameters:
      - description: Deduplicates creation; a repeat key returns the existing job
          (200)
        in: header
        name: Idempotency-Key
        type: string
      - description: Job to enqueue
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Existing job returned for a repeated Idempotency-Key
          schema:
            $ref: '#/definitions/api.enqueueJobResponse'
        "202":
          description: Enqueued
          schema:
            $ref: '#/definitions/api.enqueueJobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Enqueue an async job
      tags:
      - jobs
  /jobs/{job_id}:
    get:
      parameters:
      - description: Job id
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.jobStateResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Get a job's status
      tags:
      - jobs
  /pipelines:
    get:
      description: Returns every pipeline the system supports (hardcoded in the catalog),
        each with its ordered steps, input JSON schema and an example input. Static
        system metadata; no auth required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pipelineCatalogResponse'
      summary: List supported pipelines
      tags:
      - catalog
    post:
      consumes:
      - application/json
      description: Starts a named pipeline (a linear sequence of jobs). The pipeline
        name is supplied in the request body. Internal callers may start any cataloged
        pipeline for any user; user callers may only start user-initiable pipelines
        for themselves. Supply an Idempotency-Key header to make retries safe.
      parameters:
      - description: Deduplicates creation; a repeat key returns the existing run
          (200)
        in: header
        name: Idempotency-Key
        type: string
      - description: Pipeline name (required) and optional subject user/input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.startPipelineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Existing run returned for a repeated Idempotency-Key
          schema:
            $ref: '#/definitions/api.startPipelineResponse'
        "202":
          description: Started
          schema:
            $ref: '#/definitions/api.startPipelineResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Start a pipeline run
      tags:
      - pipelines
  /pipelines/{run_id}:
    get:
      description: Reads one asynchronous pipeline run. Web onboarding polls the /api
        alias with the run_id returned by POST /api/{user}/sync; a done run remains
        separate from explicit onboarding finalization.
      parameters:
      - description: Run id
        in: path
        name: run_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.runStateResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Get a pipeline run's status
      tags:
      - pipelines
securityDefinitions:
  BearerAuth:
    description: '"Bearer <JWT>" for end-user callers (RS256).'
    in: header
    name: Authorization
    type: apiKey
  InternalToken:
    description: Shared secret for server-to-server callers.
    in: header
    name: X-Internal-Token
    type: apiKey
swagger: "2.0"
