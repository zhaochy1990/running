info:
  contact: {}
  description: 'HTTP API fronting the STRIDE worker: create and track async jobs and
    pipeline runs, and manage user profile, onboarding, and watch-provider login.'
  title: STRIDE API
  version: "1.0"
paths:
  /api/{user}/activities:
    get:
      description: Returns a filtered, paginated activity page (newest first) plus
        run-distance/duration/count summaries for every Shanghai month on the page.
        A user caller may only list their own activities; an internal caller may list
        any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Page offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Page size 1–200 (default 50)
        in: query
        name: limit
        type: integer
      - description: Exact sport_name filter
        in: query
        name: sport
        type: string
      - description: run | strength
        in: query
        name: sport_category
        type: string
      - description: Minimum distance in km
        in: query
        name: min_distance_km
        type: number
      - description: Shanghai YYYY-MM-DD lower bound
        in: query
        name: date_from
        type: string
      - description: Shanghai YYYY-MM-DD upper bound
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.activitiesListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: List a user's activities
      tags:
      - activities
  /api/{user}/activities/{labelId}:
    get:
      description: Assembles the activity, objective training load, laps, strength
        segments, watch-reported zones, and (with ?include=timeseries) the downsampled
        timeseries. A user caller may only read their own activities; an internal
        caller may read any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Activity label id
        in: path
        name: labelId
        required: true
        type: string
      - description: Comma list; pass 'timeseries' to inline the series
        in: query
        name: include
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.activityDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Get one activity's detail
      tags:
      - activities
  /api/{user}/health:
    get:
      description: Returns the most recent `days` daily-health rows (newest first),
        the dashboard HRV normal-band snapshot with a per-day trend (oldest first)
        and its latest-reading date, and the calibrated rhr baseline. A user caller
        may only read their own data; an internal caller may read any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Window 1–365 (default 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.healthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Daily health rows, HRV snapshot, and rhr baseline
      tags:
      - metrics
  /api/{user}/hrv:
    get:
      description: Returns the most recent `days` daily-hrv rows (oldest first) plus
        a small summary block for the latest reading. A user caller may only read
        their own data; an internal caller may read any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Window 1–365 (default 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.hrvResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Per-day HRV detail + latest-reading summary
      tags:
      - metrics
  /api/{user}/plan/weeks:
    get:
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: List a user's active weekly plans
      tags:
      - weekly-plan
  /api/{user}/plan/weeks/{weekName}:
    get:
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Shanghai week name (YYYY-MM-DD_MM-DD)
        in: path
        name: weekName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.weeklyPlanDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Get a user's active weekly plan
      tags:
      - weekly-plan
  /api/{user}/pmc:
    get:
      description: Returns the vendor ATI/CTI/TSB series with ACWR-derived TSB zones
        and 7-day CTL ramp, plus the STRIDE training-load PMC series and latest-usable
        summary. A user caller may only read their own data; an internal caller may
        read any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Window 14–365 (default 90)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pmcResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Performance Management Chart (vendor + STRIDE)
      tags:
      - metrics
  /api/{user}/stride/training-load:
    get:
      description: Returns the most recent `days` daily training-load rows (oldest
        first) and the latest usable current state (never an unknown placeholder).
        A user caller may only read their own data; an internal caller may read any
        user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Window 7–365 (default 90)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.strideTrainingLoadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: STRIDE daily training load (PMC)
      tags:
      - metrics
  /api/{user}/stride/zones:
    get:
      description: Returns the latest calibration snapshot's threshold pace/HR and
        the derived pace and heart-rate zones (physiological order). Empty threshold
        + zones when the user has no snapshot. A user caller may only read their own
        data; an internal caller may read any user.
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.strideZonesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: STRIDE calibration threshold + training zones
      tags:
      - metrics
  /api/{user}/sync:
    post:
      consumes:
      - application/json
      description: 'Starts a pipeline only and returns immediately (202) with a run
        id; Web clients poll GET /api/pipelines/{run_id}. The pipeline syncs watch
        data and then computes derived metrics (training load, PMC, personal bests).
        Mode picks the pipeline: "incremental" (default) syncs only new activities
        and computes only those; "full" re-syncs history, recomputes the athlete baseline,
        and does a full compute. A successful full pipeline does not complete onboarding:
        the user must explicitly finalize its successful run through POST /api/users/me/onboarding/complete.
        This is the async Go replacement for the Python POST /api/{user}/sync. A user
        caller may only sync their own id (path {user} must equal their JWT sub);
        an internal caller may sync any user (path {user} must be a UUID).'
      parameters:
      - description: User id (JWT sub, or any user UUID for internal callers)
        in: path
        name: user
        required: true
        type: string
      - description: Deduplicates creation; a repeat key returns the existing run
          (200)
        in: header
        name: Idempotency-Key
        type: string
      - description: Optional sync options; omitted mode defaults to incremental
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.syncRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Existing run returned for a repeated Idempotency-Key
          schema:
            $ref: '#/definitions/api.startPipelineResponse'
        "202":
          description: Started
          schema:
            $ref: '#/definitions/api.startPipelineResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Trigger a watch-data sync (+ compute) for a user
      tags:
      - sync
  /api/{user}/weeks/{weekName}:
    get:
      parameters:
      - description: User id (JWT sub)
        in: path
        name: user
        required: true
        type: string
      - description: Shanghai week name (YYYY-MM-DD_MM-DD)
        in: path
        name: weekName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.weekDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Get a user's week detail
      tags:
      - weekly-plan
  /api/pipelines/{run_id}:
    get:
      description: Reads one asynchronous pipeline run. Web onboarding polls the /api
        alias with the run_id returned by POST /api/{user}/sync; a done run remains
        separate from explicit onboarding finalization.
      parameters:
      - description: Run id
        in: path
        name: run_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.runStateResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: Get a pipeline run's status
      tags:
      - pipelines
  /api/readyz/onboarding:
    get:
      description: Returns the static route contract required before the Web BFF enables
        its Go onboarding route flags. No authentication is required and no user data
        is returned.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.onboardingReadinessResponse'
      summary: Web onboarding cutover readiness
      tags:
      - catalog
  /api/readyz/plan-setup:
    get:
      description: Returns the static route contract required before the Web BFF enables
        its Go plan-setup route flags. No authentication is required and no user data
        is returned.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.planSetupReadinessResponse'
      summary: Training-plan setup cutover readiness
      tags:
      - catalog
  /api/users/{uid}/pipelines:
    get:
      description: Lists the pipeline runs for a user (the subject whose data they
        operate on), most recent first. A user caller may only list their own runs
        (uid must equal their JWT sub); an internal caller may list any uid.
      parameters:
      - description: User id (the subject; JWT sub)
        in: path
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.userPipelinesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
      security:
      - InternalToken: []
      - BearerAuth: []
      summary: List a user's pipeline runs
      tags:
      - pipelines
  /api/users/me:
    delete:
      responses:
        "204":
