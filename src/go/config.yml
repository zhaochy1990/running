# Non-secret defaults for the async-job worker. Secrets (mysql.dsn, amqp.url)
# are left empty here and MUST be supplied via environment:
#   STRIDE_WORKER_MYSQL_DSN, STRIDE_WORKER_AMQP_URL
# Any key can be overridden by STRIDE_WORKER_<PATH> (with -/. -> _), e.g.
#   queues.work        -> STRIDE_WORKER_QUEUES_WORK
#   retry.max-attempts -> STRIDE_WORKER_RETRY_MAX_ATTEMPTS
#   runtime.prefetch   -> STRIDE_WORKER_RUNTIME_PREFETCH
#   logger.level       -> STRIDE_WORKER_LOGGER_LEVEL

logger:
  format: json          # json | console
  service-name: stride-worker
  level: info           # debug | info | warning | error
  disable-caller: false
  development: false

mysql:
  dsn: ""               # via STRIDE_WORKER_MYSQL_DSN

amqp:
  url: ""               # via STRIDE_WORKER_AMQP_URL

queues:
  work: stride.jobs
  retry: stride.jobs.retry
  poison: stride.jobs.poison

retry:
  max-attempts: 5
  base-backoff: 5s
  max-backoff: 5m

runtime:
  prefetch: 1
  health-addr: ":8081"
  data-dir: data          # only for the file-based provider-binding fallback
  # Lease/claim recovery. A running job's lease is renewed at a third of
  # claim-lease; another worker may requeue it once the lease expires (worker
  # died mid-job), or fail it when its attempt budget is spent. drain-timeout
  # bounds how long SIGTERM waits for the in-flight job to unwind.
  claim-lease: 2m
  reclaim-interval: 30s
  drain-timeout: 30s

# Independent race detector (not Coach Agent). The DeepSeek key is secret and
# must be supplied via STRIDE_WORKER_RACE_DETECTION_API_KEY.
race-detection:
  api-kind: "chat-completions"
  endpoint: "https://api.deepseek.com"
  api-key: ""
  model: "deepseek-v4-flash"
  timeout: 30s
  max-concurrency: 8

# Tencent Cloud COS bucket holding route-thumbnail PNGs (public read). Secrets
# come from env:
#   STRIDE_WORKER_COS_SECRET_ID / STRIDE_WORKER_COS_SECRET_KEY
# Leave any field empty to disable thumbnails entirely: the job then skips
# itself instead of failing a sync, because thumbnails are cosmetic.
cos:
  secret-id: ""
  secret-key: ""
  bucket: ""
  region: ""
  base-url: ""          # public origin used to build thumb_url (CDN later)

# World Athletics GraphQL API (public AWS AppSync endpoint) for the
# competition_calendar_sync pipeline. The api-key is public — World Athletics
# embeds it in the site's JS bundle — so it ships here as a non-secret default
# and can be rotated via STRIDE_WORKER_WORLD_ATHLETICS_API_KEY.
world-athletics:
  endpoint: "https://graphql-prod-4895.edge.aws.worldathletics.org/graphql"
  api-key: "da2-q7toieeiobcjxbov4abq3abk5u"
  competition-group-id: 3775    # 3775 = World Athletics Label Road Races
  competition-subgroup-id: 0    # 0 = all subgroups (Platinum/Gold/Silver/Bronze/Elite/Label)
  seasons: []                   # empty -> the current Shanghai year
  timeout: 60s

# HTTP API server (`stride api`) — a separate container (ADR 0012), same unified
# binary as the worker. The worker ignores this section. Secrets stay empty here
# and come from env:
#   STRIDE_WORKER_API_INTERNAL_TOKEN
api:
  addr: ":8080"
  cors-origins:
    - "https://stride-running.cn"   # static SPA container browser origin (Caddy routes /api to the backends)
  internal-token: ""        # via STRIDE_WORKER_API_INTERNAL_TOKEN (secret)
  swagger-enabled: false    # true in dev/staging; keep false in prod
  auth:                     # RS256 end-user JWT (must match the auth-service)
    issuer: ""
    audience: ""
    admin-audience: ""      # optional separate admin-dashboard audience
    public-key-path: ""     # PEM file with the auth-service RSA public key
  auth-service-url: ""      # in-house auth-service origin for display-name mirror; empty disables (ADR 0013)
  coach-service-url: ""     # coach-service origin for account-erasure; must be set — an empty URL fails the erasure rather than skipping coach cleanup
  features:                 # echoed in GET /api/users/me/profile (mirror Python server config)
    # Coexistence flag only: Go completion never starts work; it requires a
    # verified successful run_id from generic full sync.
    sync-data-at-onboarding: true

