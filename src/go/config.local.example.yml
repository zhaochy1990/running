# Copy this file to config.local.yml and replace the local MySQL DSN.
# config.local.yml is ignored and must not be committed.
mysql:
  dsn: "replace-with-local-mysql-dsn"

race-detection:
  api-kind: "responses"
  endpoint: "http://127.0.0.1:23333/api/openai/v1"
  api-key: "local-race-golden"
  model: "gpt-5.6-luna"
  timeout: "90s"
  max-concurrency: 8

# Timeseries blob bucket (devops#784). Required at boot — an empty secret
# fails startup with an explicit error. Use the production TENCENT_COS_* pair
# READ-ONLY: never trigger a sync write path from local, never write fixtures.
#   export STRIDE_WORKER_TS_BLOB_SECRET_ID=... STRIDE_WORKER_TS_BLOB_SECRET_KEY=...
ts-blob:
  bucket: "stride-timeseries-1255867366"
  region: "ap-shanghai"

# WeChat Pay module (devops#904): leave unconfigured locally — the module is
# inert (fee-charged redemptions answer 503 payment_unavailable, zero-fee
# goods unaffected). To exercise it, set STRIDE_WORKER_WXPAY_APP_ID,
# STRIDE_WORKER_WXPAY_MCH_ID, STRIDE_WORKER_WXPAY_MERCHANT_SERIAL_NO,
# STRIDE_WORKER_WXPAY_PRIVATE_KEY_PEM, STRIDE_WORKER_WXPAY_PUBLIC_KEY_ID,
# STRIDE_WORKER_WXPAY_PUBLIC_KEY_PEM and STRIDE_WORKER_WXPAY_APIV3_KEY (see
# config.yml for the stride-secrets key names).
