<!DOCTYPE html>

<html lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>STRIDE - Runner Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;family=Newsreader:ital,wght@1,400;1,500&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          theme: {
            extend: {
              "colors": {
                "canvas": "#07080A",
                "surface": "#101111",
                "surface-raised": "#1B1C1E",
                "content-primary": "#F9F9F9",
                "content-secondary": "#CECECE",
                "content-muted": "#9C9C9D",
                "content-meta": "#6A6B6C",
                "accent-coral": "#FF6363",
                "accent-success": "#5FC992",
                "accent-blue": "#55B3FF",
                "border-subtle": "rgba(255,255,255,0.06)",
                "divider-subtle": "rgba(255,255,255,0.04)"
              },
              "fontFamily": {
                "sans": ["Inter", "sans-serif"],
                "mono": ["Geist Mono", "monospace"],
                "serif": ["Newsreader", "serif"]
              },
              "letterSpacing": {
                "precise": "0.2px",
                "precise-wide": "0.4px"
              }
            }
          }
        }
    </script>
<style>
        body {
            max-width: 390px;
            margin: 0 auto;
            background-color: #07080A;
            font-family: 'Inter', sans-serif;
            color: #F9F9F9;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-20 bg-canvas text-content-primary">
<!-- Top Bar -->
<header class="sticky top-0 z-50 border-b border-border-subtle h-[56px] px-5 flex items-center justify-between bg-surface">
<button class="w-12 h-12 flex items-center justify-start">
<span class="material-symbols-outlined text-content-primary">menu</span>
</button>
<div class="font-bold tracking-precise text-xl text-content-primary">STRIDE</div>
<button class="w-12 h-12 flex items-center justify-end">
<span class="material-symbols-outlined text-content-primary">sync</span>
</button>
</header>
<main class="px-5 py-6 space-y-8 tracking-precise">
<!-- Sync Status & Greeting -->
<section class="space-y-6">
<div class="flex justify-between items-baseline border-b border-border-subtle pb-4">
<span class="text-sm font-mono text-content-muted">7月14日 周二</span>
<div class="flex items-center gap-1.5 text-[12px] font-mono text-content-muted">
<span class="w-1.5 h-1.5 bg-accent-success rounded-full"></span>
                08:12 已同步
            </div>
</div>
<div class="flex justify-between items-center">
<h1 class="text-[28px] font-bold tracking-tight">早上好，朝毅</h1>
</div>
</section>
<!-- Decision Header & Evidence -->
<section class="space-y-6">
<div class="text-xl font-bold text-accent-success leading-tight">
            恢复正常，可以按计划完成节奏跑
        </div>
<div class="flex justify-between py-6 border-y border-border-subtle gap-2">
<div class="flex flex-col gap-1.5">
<span class="text-[12px] text-content-muted">HRV</span>
<span class="font-mono text-[15px] text-content-primary">52 ms <span class="text-accent-success text-[12px]">(较基线 +4%)</span></span>
</div>
<div class="w-px bg-divider-subtle"></div>
<div class="flex flex-col gap-1.5">
<span class="text-[12px] text-content-muted">静息心率</span>
<span class="font-mono text-[15px] text-content-primary">48 bpm <span class="text-accent-success text-[12px]">(正常)</span></span>
</div>
<div class="w-px bg-divider-subtle"></div>
<div class="flex flex-col gap-1.5">
<span class="text-[12px] text-content-muted">当前状态</span>
<span class="font-mono text-[15px] text-content-primary">-8% <span class="text-accent-coral text-[12px]">(维持区)</span></span>
</div>
</div>
</section>
<!-- Activity Section (Moved Up & Updated to Zero-State) -->
<section class="space-y-2"><div class="flex justify-between items-center border-b border-border-subtle pb-3">
<span class="text-[12px] font-semibold text-content-muted">今日活动</span>
<button class="h-12 px-2 -mr-2 flex items-center text-[12px] font-semibold text-accent-blue">全部活动</button>
</div>
<div class="flex items-center h-12">
<p class="text-[15px] font-medium text-content-muted">今天暂无活动</p>
</div></section>
<!-- Weekly Training Module (Moved Down) -->
<section class="space-y-4">
<div class="flex flex-col gap-4">
<div class="flex justify-between items-end">
<div class="space-y-1">
<div class="flex items-center gap-2"><h3 class="text-[12px] font-semibold text-content-muted">今日训练</h3><span class="bg-surface-raised text-content-secondary border border-border-subtle text-[10px] px-1.5 py-0.5 rounded font-bold uppercase tracking-precise-wide">关键课</span></div>
</div>
</div>
</div>
<div class="bg-surface p-5 rounded-2xl border border-border-subtle space-y-5 ring-1 ring-white/5 shadow-xl shadow-black/50">
<div class="space-y-1.5">
<h2 class="text-[22px] font-bold text-content-primary">节奏跑 · <span class="font-mono">8 km</span></h2>
<div class="text-[15px] text-content-secondary font-mono">18:30 · 约 48 min</div>
</div>
<div class="flex gap-4 py-4 border-y border-border-subtle">
<div class="flex-1">
<span class="text-[11px] text-content-meta block mb-1.5">配速</span>
<span class="font-mono font-medium text-[15px] text-content-primary">5:15–5:25 <span class="text-[12px] text-content-muted">/km</span></span>
</div>
<div class="w-px bg-divider-subtle"></div>
<div class="flex-1">
<span class="text-[11px] text-content-meta block mb-1.5">心率</span>
<span class="font-mono font-medium text-[15px] text-content-primary">Z3 · 150–162 <span class="text-[12px] text-content-muted">bpm</span></span>
</div>
</div>
<p class="font-serif italic text-[15px] text-content-secondary leading-relaxed">“安排在今晚：恢复正常，且距周日长跑超过 72 小时。”</p>
<div class="pt-3 space-y-3">
<button class="w-full bg-content-primary text-canvas h-12 rounded-full font-bold text-[15px] active:scale-[0.98] transition-all">查看训练详情</button>
<button class="w-full h-12 flex items-center justify-center text-[14px] font-medium text-content-muted active:text-content-primary transition-all">调整今天安排</button></div>
</div>
</section>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 max-w-[390px] mx-auto bg-surface border-t border-border-subtle h-[83px] pb-[19px] px-6 flex justify-between items-center z-50">
<button class="flex flex-col items-center gap-1 text-content-primary h-full justify-center w-16">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">directions_run</span>
<span class="text-[10px] font-bold">跑者</span>
</button>
<button class="flex flex-col items-center gap-1 text-content-muted h-full justify-center w-16">
<span class="material-symbols-outlined text-[24px]">fitness_center</span>
<span class="text-[10px] font-medium">训练</span>
</button>
<button class="flex flex-col items-center gap-1 text-content-muted h-full justify-center w-16">
<span class="material-symbols-outlined text-[24px]">leaderboard</span>
<span class="text-[10px] font-medium">数据</span>
</button>
<button class="flex flex-col items-center gap-1 text-content-muted h-full justify-center w-16">
<span class="material-symbols-outlined text-[24px]">psychology</span>
<span class="text-[10px] font-medium">教练</span>
</button>
</nav>
</body></html>
