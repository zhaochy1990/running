<!DOCTYPE html>

<body class="bg-white text-[#171717] font-body-lg antialiased">
<!-- Top App Bar -->
<header class="docked full-width top-0 sticky z-50 bg-white flex justify-between items-center px-margin-side h-touch-target w-full">
<button class="w-[48px] h-[48px] flex items-center justify-center text-on-surface hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface text-center flex-1">赛季训练计划</h1>
<div class="w-8"></div>
</header>
<!-- Summary Header -->
<section class="px-margin-side pt-8 pb-10 flex flex-col items-center border-b border-surface-variant">
<h2 class="font-headline-lg text-headline-lg text-on-surface text-center">2026 上海马拉松</h2>
<div class="text-[13px] text-[#171717]/60 mb-1"><span class="font-['Geist_Mono']">12</span>月<span class="font-['Geist_Mono']">6</span>日 · 目标 <span class="font-['Geist_Mono']">3:20:00</span></div><div class="mt-2 flex items-center gap-1.5"><span class="material-symbols-outlined text-[18px] text-[#1FAD5B]">timer</span><span class="text-[15px] font-medium"><span class="font-['Geist_Mono']">117</span> 天</span></div>
</section>
<!-- Vertical Route Map -->
<main class="px-margin-side pt-8 relative pb-[160px]">
<!-- The Continuous Spine -->
<div class="absolute left-[27px] top-10 bottom-4 w-[1px] bg-primary-container z-0"></div>
<!-- Node: Completed -->
<button class="w-full flex gap-4 relative z-10 mb-8 opacity-60 items-center h-[48px] text-left hover:opacity-40 transition-opacity"><div class="w-6 flex flex-col items-center"><div class="w-2.5 h-2.5 rounded-full bg-outline"></div></div><div class="flex-1"><p class="font-eyebrow text-eyebrow text-on-surface-variant uppercase tracking-widest">基础期 W01-W04</p></div></button>
<!-- Node: Current (Expanded) -->
<button class="w-full flex gap-4 relative z-10 mb-8 text-left hover:opacity-95 transition-opacity"><div class="w-6 flex flex-col items-center"><div class="w-4 h-4 rounded-full border-2 border-primary-container bg-surface flex items-center justify-center mt-1"><div class="w-1.5 h-1.5 rounded-full bg-primary-container"></div></div></div><div class="flex-1"><div class="bg-surface border border-outline rounded-lg p-4 shadow-sm" style="box-shadow: 0 0 0 1px rgba(0,0,0,0.08);"><div class="flex justify-between items-start mb-4"><div><h3 class="text-[11px] font-bold text-[#171717]/60 uppercase tracking-widest mb-0.5">进展期 BUILD <span class="font-['Geist_Mono']">W05-W10</span></h3><p class="text-[13px] font-medium">第 <span class="font-['Geist_Mono']">3 / 6</span> 周 · <span class="font-['Geist_Mono']">W07 / 23</span></p></div></div><div class="grid grid-cols-2 gap-4 mb-5"><div><p class="text-[10px] text-[#171717]/40 mb-1">阶段目标</p><p class="text-[14px] font-bold">建立阈值耐力</p></div><div><p class="text-[10px] text-[#171717]/40 mb-1">周跑量区间</p><p class="text-[15px] font-bold"><span class="font-['Geist_Mono']">46-52</span> <span class="text-[10px] font-normal opacity-60">km</span></p></div></div><div class="mb-5 border-t border-black/[0.04] pt-4"><p class="text-[10px] text-[#171717]/40 mb-2">本周关键课表</p><div class="flex gap-2"><span class="bg-[#F5F5F5] px-2.5 py-1 rounded text-[11px] font-medium">阈值间歇</span><span class="bg-[#F5F5F5] px-2.5 py-1 rounded text-[11px] font-medium">长距离</span></div></div><div class="bg-[#F9F9F9] p-3 rounded flex gap-2.5 items-start"><span class="material-symbols-outlined text-[16px] text-[#1FAD5B] mt-0.5 icon-fill">format_quote</span><p class="text-[13px] text-[#171717]/70 leading-relaxed">当前负荷稳步提升，身体适应良好。</p></div></div></div></button>
<!-- Node: Milestone Marker -->
<button class="w-full flex gap-4 relative z-10 mb-8 items-center bg-surface h-[48px] text-left hover:opacity-80 transition-opacity"><div class="w-6 flex flex-col items-center"><div class="w-2.5 h-2.5 rotate-45 bg-primary border-2 border-surface box-content"></div></div><div class="flex-1"><p class="font-body-sm text-body-sm text-primary font-bold"><span class="font-['Geist_Mono']">8</span>月<span class="font-['Geist_Mono']">31</span>日 · <span class="font-['Geist_Mono']">10K</span> 阈值测试</p></div></button>
<!-- Node: Future Compact 1 -->
<button class="w-full flex gap-4 relative z-10 mb-6 items-center h-[48px] text-left hover:opacity-80 transition-opacity"><div class="w-6 flex flex-col items-center"><div class="w-2 h-2 rounded-full border border-outline bg-surface"></div></div><div class="flex-1 border-b border-surface-variant h-full flex justify-between items-center"><p class="font-eyebrow text-eyebrow text-on-surface uppercase tracking-widest">专项期 <span class="font-['Geist_Mono']">W11-W18</span></p><span class="material-symbols-outlined text-outline-variant text-[18px]">chevron_right</span></div></button>
<!-- Node: Future Compact 2 -->
<button class="w-full flex gap-4 relative z-10 mb-6 items-center h-[48px] text-left hover:opacity-80 transition-opacity"><div class="w-6 flex flex-col items-center"><div class="w-2 h-2 rounded-full border border-outline bg-surface"></div></div><div class="flex-1 border-b border-surface-variant h-full flex justify-between items-center"><p class="font-eyebrow text-eyebrow text-on-surface uppercase tracking-widest">减量期 <span class="font-['Geist_Mono']">W19-W22</span></p><span class="material-symbols-outlined text-outline-variant text-[18px]">chevron_right</span></div></button>
<!-- Node: Future Compact 3 -->
<button class="w-full flex gap-4 relative z-10 mb-8 items-center h-[48px] text-left hover:opacity-80 transition-opacity"><div class="w-6 flex flex-col items-center"><div class="w-2 h-2 rounded-full border border-outline bg-surface"></div></div><div class="flex-1 border-b border-surface-variant h-full flex justify-between items-center"><p class="font-eyebrow text-eyebrow text-on-surface uppercase tracking-widest">比赛周 <span class="font-['Geist_Mono']">W23</span></p><span class="material-symbols-outlined text-outline-variant text-[18px]">chevron_right</span></div></button>
<!-- Node: End -->
<div class="flex gap-4 relative z-10">
<div class="w-6 flex flex-col items-center">
<div class="bg-surface p-1 rounded-full border border-outline z-10 shadow-sm mt-0.5">
<span class="material-symbols-outlined text-[14px] text-on-surface icon-fill">sports_score</span>
</div>
</div>
<div class="flex-1 pt-1.5">
<p class="font-metric-value text-headline-md text-on-surface"><span class="font-['Geist_Mono']">12</span>月<span class="font-['Geist_Mono']">6</span>日 · <span class="text-[#1FAD5B] font-['Geist_Mono']">3:20:00</span></p>
<p class="font-metric-unit text-metric-unit text-on-surface-variant mt-1">目标完赛时间</p>
</div>
</div>
</main>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 left-0 right-0 px-margin-side pt-4 pb-[calc(16px+env(safe-area-inset-bottom))] bg-white border-t border-black/[0.04] z-50 flex flex-col gap-1 items-center"><button class="w-full h-[50px] bg-[#1FAD5B] text-white font-bold text-[16px] rounded-lg flex items-center justify-center gap-2 hover:opacity-90 transition-opacity shadow-sm">查看本周课表 <span class="material-symbols-outlined text-[20px]">arrow_forward</span></button><div class="flex gap-8"><button class="h-[48px] px-4 text-[13px] text-[#171717]/60 hover:text-[#171717] transition-colors underline underline-offset-4 decoration-black/10">调整计划</button><button class="h-[48px] px-4 text-[13px] text-[#171717]/60 hover:text-[#171717] transition-colors underline underline-offset-4 decoration-black/10">版本记录</button></div></div>
</body></html>
