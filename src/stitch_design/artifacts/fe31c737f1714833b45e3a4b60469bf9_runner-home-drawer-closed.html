<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Runner Home - STRIDE</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#ffdad7",
                        "on-tertiary-container": "#003821",
                        "secondary-container": "#2f97e1",
                        "surface-container-highest": "#343535",
                        "on-error": "#690005",
                        "surface-variant": "#343535",
                        "on-tertiary-fixed": "#002112",
                        "surface-bright": "#393939",
                        "on-surface-variant": "#e1bfbc",
                        "tertiary-fixed": "#8df8bd",
                        "on-surface": "#e4e2e1",
                        "error": "#ffb4ab",
                        "secondary-fixed": "#cee5ff",
                        "surface-container": "#1f2020",
                        "surface": "#131413",
                        "inverse-surface": "#e4e2e1",
                        "surface-container-lowest": "#0d0e0e",
                        "inverse-primary": "#b12a30",
                        "on-secondary-container": "#002c49",
                        "on-tertiary-fixed-variant": "#005232",
                        "on-error-container": "#ffdad6",
                        "surface-dim": "#131413",
                        "tertiary-container": "#3eaa76",
                        "on-secondary": "#003353",
                        "surface-container-low": "#1b1c1c",
                        "primary": "#ffb3af",
                        "tertiary-fixed-dim": "#71dba2",
                        "on-primary": "#68000e",
                        "surface-container-high": "#292a2a",
                        "tertiary": "#71dba2",
                        "inverse-on-surface": "#303030",
                        "on-tertiary": "#003921",
                        "outline-variant": "#59413f",
                        "on-secondary-fixed-variant": "#004a76",
                        "outline": "#a88988",
                        "surface-tint": "#ffb3af",
                        "on-primary-fixed-variant": "#8f0d1c",
                        "on-primary-fixed": "#410006",
                        "on-primary-container": "#67000e",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#ffb3af",
                        "primary-container": "#ff6363",
                        "secondary-fixed-dim": "#97cbff",
                        "secondary": "#97cbff",
                        "on-secondary-fixed": "#001d33",
                        "on-background": "#e4e2e1",
                        "background": "#131413"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-sm": "8px",
                        "stack-gap-md": "16px",
                        "gutter-module": "12px",
                        "stack-gap-lg": "24px",
                        "touch-target-min": "48px",
                        "margin-edge": "20px"
                    },
                    "fontFamily": {
                        "display-lg": ["Geist Mono"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "data-lg": ["Geist Mono"],
                        "label-caps": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "data-sm": ["Geist Mono"]
                    },
                    "fontSize": {
                        "display-lg": ["44px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "data-lg": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "data-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]

                }
            }
        }
    </script>
<style>
        .elevation-ring {
            box-shadow: inset 0 0 0 1px rgb(7,8,10), 0 0 0 1px rgb(27,28,30);
        }
        .elevation-raised {
            box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.05), 0 1px 2px 0 rgba(0,0,0,0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] antialiased overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full h-[64px] bg-surface dark:bg-surface border-b border-surface-variant flex justify-between items-center px-margin-edge z-50">
<button aria-label="Menu" class="w-touch-target-min h-touch-target-min flex items-center justify-start text-on-surface hover:opacity-80 active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-md font-headline-md tracking-tighter text-on-surface dark:text-on-surface">STRIDE</h1>
<button aria-label="Sync Watch" class="w-touch-target-min h-touch-target-min flex items-center justify-end text-on-surface hover:opacity-80 active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined" data-icon="watch_button_press">watch_button_press</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 mt-[64px] mb-[56px] px-margin-edge py-stack-gap-lg flex flex-col gap-stack-gap-lg">
<!-- Header Section -->
<div class="flex flex-col gap-stack-gap-sm">
<div class="text-data-sm font-data-sm text-on-surface-variant uppercase tracking-wider">
                7月14日 周二 · 08:12 已同步
            </div>
<h2 class="text-display-lg font-display-lg text-on-surface tracking-tighter">早上好，朝毅</h2>
<p class="text-body-lg font-body-lg text-on-surface-variant">恢复正常，可以按计划完成节奏跑</p>
</div>
<!-- Evidence Strip -->
<div class="flex flex-col gap-stack-gap-sm">
<div class="flex items-center justify-between py-stack-gap-sm border-b border-surface-container-high min-h-[48px]">
<span class="text-body-md font-body-md text-on-surface-variant">HRV</span>
<span class="text-data-lg font-data-lg text-on-surface">52 ms <span class="text-tertiary text-data-sm">(较基线 +4%)</span></span>
</div>
<div class="flex items-center justify-between py-stack-gap-sm border-b border-surface-container-high min-h-[48px]">
<span class="text-body-md font-body-md text-on-surface-variant">静息心率</span>
<span class="text-data-lg font-data-lg text-on-surface">48 bpm <span class="text-on-surface-variant text-data-sm">(正常)</span></span>
</div>
<div class="flex items-center justify-between py-stack-gap-sm min-h-[48px]">
<span class="text-body-md font-body-md text-on-surface-variant">当前状态</span>
<span class="text-data-lg font-data-lg text-on-surface">-8% <span class="text-on-surface-variant text-data-sm">(维持区)</span></span>
</div>
</div>
<!-- Today's Activity (Zero State) -->
<div class="flex flex-col gap-stack-gap-sm">
<h3 class="text-headline-sm font-headline-sm text-on-surface">今日活动</h3>
<div class="flex items-center justify-between">
<span class="text-body-md font-body-md text-on-surface-variant">今天暂无活动</span>
<button class="h-touch-target-min px-4 flex items-center justify-center text-primary font-body-md hover:opacity-80 transition-opacity">全部活动</button>
</div>
</div>
<!-- Today's Training Card -->
<div class="flex flex-col gap-stack-gap-md">
<h3 class="text-headline-sm font-headline-sm text-on-surface">今日训练</h3>
<div class="bg-surface-container-low rounded-lg p-stack-gap-md elevation-ring flex flex-col gap-stack-gap-sm">
<div class="flex justify-between items-start">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="bg-tertiary/10 text-tertiary px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wide">关键课</span>
</div>
<h4 class="text-headline-md font-headline-md text-on-surface">节奏跑 · 8 km</h4>
<p class="text-body-md font-body-md text-on-surface-variant">安排在今晚：恢复正常，且距周日长跑超过 72 小时。</p>
</div>
</div>
<div class="grid grid-cols-2 gap-stack-gap-sm mt-2 border-t border-surface-container-high pt-stack-gap-sm">
<div class="flex flex-col">
<span class="text-data-sm font-data-sm text-on-surface-variant uppercase">计划时间</span>
<span class="text-data-lg font-data-lg text-on-surface">18:30 / 48 min</span>
</div>
<div class="flex flex-col">
<span class="text-data-sm font-data-sm text-on-surface-variant uppercase">配速目标</span>
<span class="text-data-lg font-data-lg text-primary">5:15–5:25 /km</span>
</div>
<div class="flex flex-col col-span-2">
<span class="text-data-sm font-data-sm text-on-surface-variant uppercase">心率区间</span>
<span class="text-data-lg font-data-lg text-on-surface">Z3 · 150–162 bpm</span>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-gap-sm mt-auto pb-stack-gap-md">
<button class="w-full h-[52px] bg-[#F9F9F9] text-[#18191A] rounded-full font-headline-sm font-semibold elevation-raised active:bg-gray-300 transition-colors flex items-center justify-center">
                查看训练详情
            </button>
<button class="w-full h-touch-target-min text-on-surface-variant font-body-md hover:text-on-surface transition-colors flex items-center justify-center">
                调整今天安排
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-edge pb-[env(safe-area-inset-bottom)] h-[56px] border-t border-surface-variant bg-surface-container-low dark:bg-surface-container-low md:hidden">
<a class="flex flex-col items-center justify-center text-primary dark:text-primary hover:bg-surface-container-high w-full h-full active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined mb-1" data-icon="directions_run" style="font-variation-settings: 'FILL' 1;">directions_run</span>
<span class="text-label-caps font-label-caps">跑者</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high w-full h-full active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined mb-1" data-icon="fitness_center">fitness_center</span>
<span class="text-label-caps font-label-caps">训练</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high w-full h-full active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined mb-1" data-icon="bar_chart">bar_chart</span>
<span class="text-label-caps font-label-caps">数据</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high w-full h-full active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined mb-1" data-icon="psychology">psychology</span>
<span class="text-label-caps font-label-caps">教练</span>
</a>
</nav>
</body></html>
