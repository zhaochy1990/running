<body class="overflow-x-hidden">
<!-- Shared Component: TopAppBar -->
<header class="fixed top-0 max-w-[390px] w-full z-50 bg-[#101111] border-b border-white/5 flex justify-between items-center px-margin-edge h-[64px]">
<button aria-label="Menu" class="w-touch-target-min h-touch-target-min flex items-center justify-start text-on-surface hover:opacity-80 transition-opacity">

<div class="text-headline-md font-headline-md tracking-tighter text-on-surface">STRIDE</div>

<span class="material-symbols-outlined" data-icon="watch_button_press">watch_button_press</span>
</button>
</header>

<section class="flex flex-col gap-1 mt-2">
<div class="flex items-center gap-2 text-on-surface-variant text-data-sm font-data-sm uppercase tracking-wider">
<span>7月14日 周二</span>
<span class="w-[3px] h-[3px] rounded-full bg-surface-variant"></span>
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">sync</span>
                    08:12 已同步
                </span>
</div>
<h1 class="text-display-lg font-display-lg text-on-surface mt-1 mb-1">早上好，朝毅</h1>
<!-- Decision Banner -->
<div class="bg-card-bg rounded-lg p-3 border border-white/5 shadow-ring-raised border-l-[3px] border-l-stride-coral">
<p class="text-body-lg font-body-lg text-on-surface">恢复正常，可以按计划完成节奏跑</p>
</div>
</section>
<!-- Evidence Strip (Flat Row) -->
<section class="bg-card-bg rounded-[12px] p-3 border border-white/5 shadow-ring-raised flex flex-row items-center justify-between">

<span class="text-on-surface-variant text-label-caps font-label-caps">HRV</span>
<div class="mt-1">
<div class="text-data-lg font-data-lg text-on-surface">52 <span class="text-data-sm text-on-surface-variant">ms</span></div>
<div class="text-success-green text-data-sm font-data-sm">+4%</div>
</div>
</div>
<div class="flex-1 flex flex-col justify-center border-r border-white/5 pl-4">
<span class="text-on-surface-variant text-label-caps font-label-caps">静息心率</span>
<div class="mt-1">
<div class="text-data-lg font-data-lg text-on-surface">48 <span class="text-data-sm text-on-surface-variant">bpm</span></div>
<div class="text-on-surface-variant text-data-sm font-data-sm">正常</div>
</div>
</div>
<div class="flex-1 flex flex-col justify-center pl-4">
<span class="text-on-surface-variant text-label-caps font-label-caps">当前状态</span>

<div class="text-data-lg font-data-lg text-on-surface">-8%</div>
<div class="text-on-surface-variant text-data-sm font-data-sm">维持区</div>
</div>
</div>
</section>

</div>
<div class="border-b border-white/5 pb-3">
<p class="text-on-surface-variant text-body-md font-body-md">今天暂无活动</p>
</div>

</div>
<span class="text-on-surface-variant text-body-md font-body-md flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">schedule</span> 18:30 · 48 min

</div>
</div>

<div>
<div class="text-on-surface-variant text-label-caps font-label-caps mb-1">配速区间</div>
<div class="text-data-lg font-data-lg text-on-surface">5:15–5:25 <span class="text-data-sm text-on-surface-variant">/km</span></div>
</div>
<div>

</div>

</div>
<div class="flex flex-col gap-2 mt-1">
<button class="w-full h-[52px] bg-[#e4e2e1] text-[#07080a] rounded-full text-body-lg font-body-lg font-semibold hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center">

<button class="w-full h-[48px] bg-transparent border border-white/10 text-on-surface-variant rounded-full text-body-md font-body-md hover:bg-white/5 active:scale-[0.98] transition-all flex items-center justify-center">
