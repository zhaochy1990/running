<!-- Simple Interactivity -->
<script>
        function resolveNextRoute(rawNext) {
            const defaultRoute = '/v2/home';
            if (!rawNext) return defaultRoute;
            if (rawNext === 'onboarding') return '/v2/onboarding/brand';
            
            let pathnamePart = rawNext.split(/[?#]/)[0];
            
            let decoded = pathnamePart;
            let prev = '';
            let iterations = 0;
            
            try {
                while (decoded !== prev && iterations < 10) {
                    prev = decoded;
                    decoded = decodeURIComponent(decoded);
                    iterations++;
                }
                if (decoded !== prev) return defaultRoute;
            } catch (e) {
                return defaultRoute;
            }
            
            if (/(^|\/)\.{1,2}(\/|$)/.test(decoded) ||
                /[\x00-\x1F]/.test(decoded) || 
                decoded.includes('\\') || 
                decoded.includes(':/') || 
                decoded.includes('//')) {
                return defaultRoute;
            }
            
            try {
                const url = new URL(rawNext, 'http://trusted');
                if (url.origin !== 'http://trusted') return defaultRoute;
                if (!url.pathname.startsWith('/v2/')) return defaultRoute;
                
                return url.pathname + url.search + url.hash;
            } catch (e) {
                return defaultRoute;
            }
        }

        // Check URL state for offline mode
        const urlParams = new URLSearchParams(window.location.search);
        const isOffline = urlParams.get('state') === 'offline';
        const isServiceError = urlParams.get('state') === 'service-error';
        const rawNextParam = urlParams.get('next');
        const nextRoute = resolveNextRoute(rawNextParam);
        
        const errorMessageDiv = document.getElementById('errorMessage');
        const errorTextSpan = document.getElementById('errorText');

        if (isOffline) {
            errorTextSpan.textContent = '网络连接异常，请稍后重试';
            errorMessageDiv.querySelector('.material-symbols-outlined').textContent = 'wifi_off';
            errorMessageDiv.classList.remove('hidden');
        }

        function showError(message, icon = 'error') {
            errorTextSpan.textContent = message;
            errorMessageDiv.querySelector('.material-symbols-outlined').textContent = icon;
            errorMessageDiv.classList.remove('hidden');
        }

        function hideError() {
            errorMessageDiv.classList.add('hidden');
        }

        // Tab Switching
        const btnEmail = document.getElementById('btnEmail');
        const btnMobile = document.getElementById('btnMobile');
        const formEmail = document.getElementById('formEmail');
        const formMobile = document.getElementById('formMobile');
        const markerEmail = document.getElementById('markerEmail');
        const markerMobile = document.getElementById('markerMobile');
        
        const activeClass = ['bg-[#101111]', 'text-white', 'shadow-raised', 'border', 'border-standard'];
        const inactiveClass = ['text-on-surface-variant', 'hover:text-on-surface', 'bg-transparent'];

        function setFormDescendantsDisabled(form, disabled) {
            const controls = form.querySelectorAll('.form-control');
            controls.forEach(ctrl => {
                if (disabled) {
                    ctrl.setAttribute('disabled', 'true');
                    ctrl.setAttribute('tabindex', '-1');
                    if (ctrl.tagName === 'A') {
                        ctrl.setAttribute('aria-disabled', 'true');
                        ctrl.classList.add('pointer-events-none', 'opacity-50');
                    }
                } else {
                    ctrl.removeAttribute('disabled');
                    ctrl.removeAttribute('tabindex');
                    if (ctrl.tagName === 'A') {
                        ctrl.removeAttribute('aria-disabled');
                        ctrl.classList.remove('pointer-events-none', 'opacity-50');
                    }
                }
            });
        }

        function switchTab(isEmail) {
            formEmail.classList.toggle('hidden', !isEmail);
            formMobile.classList.toggle('hidden', isEmail);
            
            if (isOffline) {
                showError('网络连接异常，请稍后重试', 'wifi_off');
            } else {
                hideError();
            }

            if (isEmail) {
                btnEmail.classList.remove(...inactiveClass);
                btnEmail.classList.add(...activeClass);
                btnEmail.setAttribute('aria-selected', 'true');
                markerEmail.classList.replace('bg-transparent', 'bg-raycast-coral');
                
                btnMobile.classList.remove(...activeClass);
                btnMobile.classList.add(...inactiveClass);
                btnMobile.setAttribute('aria-selected', 'false');
                markerMobile.classList.replace('bg-raycast-coral', 'bg-transparent');
                
                formEmail.classList.remove('opacity-0', '-translate-x-full', 'pointer-events-none', 'absolute', 'top-0', 'left-0');
                formEmail.classList.add('opacity-100', 'translate-x-0', 'relative');
                formEmail.removeAttribute('inert');
                formEmail.removeAttribute('aria-hidden');
                setFormDescendantsDisabled(formEmail, false);
                
                formMobile.classList.remove('opacity-100', 'translate-x-0', 'relative');
                formMobile.classList.add('opacity-0', 'translate-x-full', 'pointer-events-none', 'absolute', 'top-0', 'left-0');
                formMobile.setAttribute('inert', '');
                formMobile.setAttribute('aria-hidden', 'true');
                setFormDescendantsDisabled(formMobile, true);
            } else {
                btnMobile.classList.remove(...inactiveClass);
                btnMobile.classList.add(...activeClass);
                btnMobile.setAttribute('aria-selected', 'true');
                markerMobile.classList.replace('bg-transparent', 'bg-raycast-coral');
                
                btnEmail.classList.remove(...activeClass);
                btnEmail.classList.add(...inactiveClass);
                btnEmail.setAttribute('aria-selected', 'false');
                markerEmail.classList.replace('bg-raycast-coral', 'bg-transparent');
                
                formMobile.classList.remove('opacity-0', 'translate-x-full', 'pointer-events-none', 'absolute', 'top-0', 'left-0');
                formMobile.classList.add('opacity-100', 'translate-x-0', 'relative');
                formMobile.removeAttribute('inert');
                formMobile.removeAttribute('aria-hidden');
                setFormDescendantsDisabled(formMobile, false);
                if (smsTimeLeft > 0) {
                    btnSendCode.setAttribute('disabled', 'true');
                }
                
                formEmail.classList.remove('opacity-100', 'translate-x-0', 'relative');
                formEmail.classList.add('opacity-0', '-translate-x-full', 'pointer-events-none', 'absolute', 'top-0', 'left-0');
                formEmail.setAttribute('inert', '');
                formEmail.setAttribute('aria-hidden', 'true');
                setFormDescendantsDisabled(formEmail, true);
            }
        }

        btnEmail.addEventListener('click', () => switchTab(true));
        btnMobile.addEventListener('click', () => switchTab(false));

        // Password Toggle
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        const toggleIcon = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
            toggleBtn.setAttribute('aria-pressed', isPassword ? 'true' : 'false');
            toggleBtn.setAttribute('aria-label', isPassword ? '隐藏密码' : '显示密码');
        });
        
        // SMS Code Logic
        const btnSendCode = document.getElementById('btnSendCode');
        let countdownInt;
        let smsTimeLeft = 0;
        
        btnSendCode.addEventListener('click', () => {
            if (btnSendCode.hasAttribute('disabled')) return;
            
            const phoneVal = document.getElementById('phone').value;
            if (!validatePhone(phoneVal)) {
                showError('请输入有效手机号');
                return;
            }

            if (isServiceError || isOffline) {
                showError('网络连接异常，请稍后重试', 'wifi_off');
                return;
            }
            
            if (!isOffline) {
                hideError();
            }

            btnSendCode.setAttribute('disabled', 'true');
            btnSendCode.classList.add('opacity-50', 'cursor-not-allowed');
            smsTimeLeft = 52;
            
            const updateBtn = () => {
                const text = `${smsTimeLeft} 秒后重发`;
                btnSendCode.innerHTML = `<span class="font-data-tabular tabular-nums">${smsTimeLeft}</span> 秒后重发`;
                btnSendCode.setAttribute('aria-label', text);
            };
            
            updateBtn();
            
            countdownInt = setInterval(() => {
                smsTimeLeft--;
                if (smsTimeLeft <= 0) {
                    clearInterval(countdownInt);
                    const isMobileActive = btnMobile.getAttribute('aria-selected') === 'true';
                    if (!submitBtn.hasAttribute('aria-busy') && isMobileActive) {
                        btnSendCode.removeAttribute('disabled');
                        btnSendCode.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                    btnSendCode.textContent = '获取验证码';
                    btnSendCode.setAttribute('aria-label', '获取验证码');
                } else {
                    updateBtn();
                }
            }, 1000);
        });

        // Form Submission logic
        const submitBtn = document.getElementById('btnSubmit');
        const allFormControls = document.querySelectorAll('.form-control');

        function validateEmail(email) {
            const parts = email.split('@');
            if (parts.length !== 2) return false;
            if (parts[0].length === 0 || parts[1].length === 0) return false;
            return parts[1].includes('.');
        }

        function validatePhone(phone) {
            return /^1\d{10}$/.test(phone);
        }
        
        function validateSmsCode(code) {
            return /^\d{6}$/.test(code);
        }

        function handleLogin(e) {
            e.preventDefault();
            if (submitBtn.hasAttribute('disabled')) return;
            
            hideError();

            const isEmailMode = btnEmail.getAttribute('aria-selected') === 'true';
            
            if (isEmailMode) {
                const emailVal = document.getElementById('email').value;
                const passVal = document.getElementById('password').value;
                if (!validateEmail(emailVal) || !passVal) {
                    showError('邮箱或密码错误');
                    return;
                }
            } else {
                 const phoneVal = document.getElementById('phone').value;
                 const codeVal = document.getElementById('code').value;
                 if(!validatePhone(phoneVal) || !validateSmsCode(codeVal)){
                      showError('验证码错误或已过期');
                      return;
                 }
            }

            if (isOffline) {
                 showError('网络连接异常，请稍后重试', 'wifi_off');
                 return;
            }

            // Loading state
            const originalContent = submitBtn.innerHTML;
            submitBtn.setAttribute('aria-live', 'polite');
            submitBtn.setAttribute('aria-busy', 'true');
            submitBtn.innerHTML = `<span class="animate-spin h-5 w-5 border-2 border-surface-container-lowest border-t-transparent rounded-full"></span> <span>登录中…</span>`;
            
            allFormControls.forEach(ctrl => {
                ctrl.setAttribute('disabled', 'true');
                ctrl.setAttribute('tabindex', '-1');
                if (ctrl.tagName === 'A') {
                    ctrl.setAttribute('aria-disabled', 'true');
                    ctrl.classList.add('pointer-events-none', 'opacity-50');
                }
            });

            setTimeout(() => {
                if (isServiceError) {
                    submitBtn.innerHTML = originalContent;
                    submitBtn.removeAttribute('aria-busy');
                    
                    showError('服务暂时不可用，请稍后重试', 'error');
                    
                    // Restore controls only for active tab
                    btnEmail.removeAttribute('disabled');
                    btnEmail.removeAttribute('tabindex');
                    btnMobile.removeAttribute('disabled');
                    btnMobile.removeAttribute('tabindex');
                    submitBtn.removeAttribute('disabled');
                    submitBtn.removeAttribute('tabindex');
                    
                    const createAccountLink = document.getElementById('linkCreateAccount');
                    createAccountLink.removeAttribute('disabled');
                    createAccountLink.removeAttribute('tabindex');
                    createAccountLink.removeAttribute('aria-disabled');
                    createAccountLink.classList.remove('pointer-events-none', 'opacity-50');

                    const forgotPasswordLink = document.getElementById('linkForgotPassword');

                    if (isEmailMode) {
                        forgotPasswordLink.removeAttribute('disabled');
                        forgotPasswordLink.removeAttribute('tabindex');
                        forgotPasswordLink.removeAttribute('aria-disabled');
                        forgotPasswordLink.classList.remove('pointer-events-none', 'opacity-50');
                        setFormDescendantsDisabled(formEmail, false);
                    } else {
                        setFormDescendantsDisabled(formMobile, false);
                        if (smsTimeLeft > 0) {
                            btnSendCode.setAttribute('disabled', 'true');
                        }
                    }
                } else {
                    submitBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check</span> <span>登录成功</span>`;
                    submitBtn.removeAttribute('aria-busy');
                    submitBtn.setAttribute('data-next-route', nextRoute);
                    
                    setTimeout(() => {
                        if (window.location.protocol === 'file:') {
                            document.body.setAttribute('data-navigated-to', nextRoute);
                            window.location.hash = '#' + nextRoute;
                        } else {
                            window.location.assign(nextRoute);
                        }
                    }, 500);
                }
            }, 2000);
        }

        formEmail.addEventListener('submit', handleLogin);
        formMobile.addEventListener('submit', handleLogin);
        submitBtn.addEventListener('click', handleLogin);

        // Handle Enter key for submission
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const activeForm = btnEmail.getAttribute('aria-selected') === 'true' ? formEmail : formMobile;
                const submitEvent = new Event('submit', { cancelable: true, bubbles: true });
                activeForm.dispatchEvent(submitEvent);
            }
        });

    </script>
</body></html>
