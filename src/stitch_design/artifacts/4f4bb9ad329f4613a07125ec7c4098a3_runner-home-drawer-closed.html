<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>STRIDE - Runner Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#004a76",
                        "outline-variant": "#59413f",
                        "surface": "#121316",
                        "on-primary-fixed-variant": "#8f0d1c",
                        "surface-container": "#1f2022",
                        "on-tertiary-fixed-variant": "#005232",
                        "on-tertiary": "#003921",
                        "on-tertiary-fixed": "#002112",
                        "secondary-fixed": "#cee5ff",
                        "tertiary-fixed": "#8df8bd",
                        "tertiary-fixed-dim": "#71dba2",
                        "tertiary-container": "#3eaa76",
                        "primary-fixed-dim": "#ffb3af",
                        "outline": "#a88988",
                        "surface-variant": "#343537",
                        "primary": "#ffb3af",
                        "secondary-fixed-dim": "#97cbff",
                        "surface-bright": "#38393c",
                        "on-secondary-fixed": "#001d33",
                        "tertiary": "#71dba2",
                        "on-surface": "#e3e2e5",
                        "on-primary-container": "#67000e",
                        "surface-container-highest": "#343537",
                        "surface-container-high": "#292a2c",
                        "primary-fixed": "#ffdad7",
                        "primary-container": "#ff6363",
                        "secondary-container": "#2f97e1",
                        "on-secondary": "#003353",
                        "error": "#ffb4ab",
                        "inverse-primary": "#b12a30",
                        "surface-container-low": "#1b1c1e",
                        "secondary": "#97cbff",
                        "on-surface-variant": "#e1bfbc",
                        "on-secondary-container": "#002c49",
                        "inverse-surface": "#e3e2e5",
                        "on-primary-fixed": "#410006",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "background": "#121316",
                        "inverse-on-surface": "#2f3033",
                        "surface-tint": "#ffb3af",
                        "surface-container-lowest": "#0d0e10",
                        "on-background": "#e3e2e5",
                        "on-primary": "#68000e",
                        "surface-dim": "#121316",
                        "on-tertiary-container": "#003821",
                        "on-error": "#690005"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section": "32px",
                        "md": "12px",
                        "margin-mobile": "20px",
                        "xxl": "24px",
                        "xl": "20px",
                        "xs": "4px",
                        "sm": "8px",
                        "lg": "16px",
                        "touch-target": "48px",
                        "tab-bar-height": "56px"
                    },
                    "fontFamily": {
                        "label": ["Inter"],
                        "display": ["Inter"],
                        "body-compact": ["Inter"],
                        "data-tabular": ["Geist Mono"],
                        "card-title": ["Inter"],
                        "screen-title": ["Inter"],
                        "body": ["Inter"]
                    },
                    "fontSize": {
                        "label": ["12px", { "lineHeight": "16px", "letterSpacing": "0.4px", "fontWeight": "500" }],
                        "display": ["40px", { "lineHeight": "44px", "letterSpacing": "0.4px", "fontWeight": "600" }],
                        "body-compact": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "data-tabular": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "card-title": ["18px", { "lineHeight": "23px", "fontWeight": "600" }],
                        "screen-title": ["24px", { "lineHeight": "29px", "letterSpacing": "0.2px", "fontWeight": "600" }],
                        "body": ["16px", { "lineHeight": "26px", "letterSpacing": "0.2px", "fontWeight": "500" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex justify-center min-h-screen">
<div class="w-full max-w-[390px] relative bg-background flex flex-col pb-[calc(56px+env(safe-area-inset-bottom))]">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim docked full-width top-0 sticky z-50 pt-safe">
<div class="flex justify-between items-center px-margin-mobile h-touch-target w-full">
<button aria-label="Menu" class="h-12 w-12 flex items-center justify-start text-on-surface hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="text-2xl font-black tracking-tighter text-primary dark:text-inverse-primary text-center">STRIDE</h1>
<button aria-label="Sync Watch" class="h-12 w-12 flex items-center justify-end text-on-surface hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined">watch</span>
</button>
</div>
<div class="px-margin-mobile pb-sm flex items-center justify-center gap-1 text-on-surface-variant font-label text-label">
<span>7月14日 周二 · 08:12 已同步</span>
<span class="material-symbols-outlined text-[14px]">check_circle</span>
</div>
<!-- Subtly separate from content, border-b is banned from shell -->
<div class="h-[1px] w-full bg-surface-container-low"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile pt-md pb-section gap-lg">
<!-- Greeting & Context -->
<section class="flex flex-col gap-xs">
<h2 class="font-screen-title text-screen-title text-on-surface">早上好，朝毅</h2>
<p class="font-body-compact text-body-compact text-primary">恢复正常，可以按计划完成节奏跑</p>
</section>
<!-- Evidence Strip -->
<section class="bg-surface-container-low rounded-lg border border-white/5 p-md flex flex-row items-start justify-between">
<div class="flex flex-col gap-1 w-1/3 border-r border-white/5 pr-sm">
<span class="font-label text-label text-on-surface-variant">HRV</span>
<span class="font-data-tabular text-data-tabular text-on-surface">52 ms</span>
<span class="font-label text-label text-tertiary">较基线 +4%</span>
</div>
<div class="flex flex-col gap-1 w-1/3 border-r border-white/5 px-sm">
<span class="font-label text-label text-on-surface-variant">静息心率</span>
<span class="font-data-tabular text-data-tabular text-on-surface">48 bpm</span>
<span class="font-label text-label text-on-surface-variant">正常</span>
</div>
<div class="flex flex-col gap-1 w-1/3 pl-sm">
<span class="font-label text-label text-on-surface-variant">当前状态</span>
<span class="font-data-tabular text-data-tabular text-on-surface">-8%</span>
<span class="font-label text-label text-on-surface-variant">维持区</span>
</div>
</section>
<!-- Today's Activity -->
<section class="flex flex-col gap-md">
<div class="flex justify-between items-center h-touch-target">
<h3 class="font-card-title text-card-title text-on-surface">今日活动</h3>
<button class="font-label text-label text-on-surface-variant hover:text-on-surface transition-colors duration-150 h-full flex items-center px-xs">全部活动</button>
</div>
<div class="bg-surface-container-low rounded-lg border border-white/5 h-touch-target flex items-center justify-center">
<span class="font-body-compact text-body-compact text-on-surface-variant">今天暂无活动</span>
</div>
</section>
<!-- Today's Training -->
<section class="flex flex-col gap-md">
<div class="bg-surface-container-low rounded-xl border border-white/5 p-md flex flex-col gap-md shadow-[inset_0_1px_0_rgba(255,255,255,0.05),inset_0_-1px_0_rgba(0,0,0,0.5)]">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-xs">
<span class="bg-surface-variant text-on-surface font-label text-label px-2 py-1 rounded w-max">关键课</span>
<h3 class="font-screen-title text-screen-title text-on-surface mt-sm">节奏跑 · <span class="font-data-tabular">8 km</span></h3>
<p class="font-body-compact text-body-compact text-on-surface-variant">18:30 · 48 min</p>
</div>
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">directions_run</span>
</div>
<div class="grid grid-cols-2 gap-md bg-surface p-md rounded border border-white/5">
<div class="flex flex-col gap-xs">
<span class="font-label text-label text-on-surface-variant">配速</span>
<span class="font-data-tabular text-data-tabular text-on-surface">5:15-5:25 /km</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-label text-label text-on-surface-variant">心率 Z3</span>
<span class="font-data-tabular text-data-tabular text-on-surface">150-162 bpm</span>
</div>
</div>
<div class="flex gap-sm items-start border-t border-white/5 pt-md">
<span class="material-symbols-outlined text-primary text-sm mt-1">psychology</span>
<p class="font-body-compact text-body-compact text-on-surface-variant leading-relaxed">
                            安排在今晚：恢复正常，且距周日长跑超过 72 小时。
                        </p>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-sm mt-sm">
<button class="w-full bg-on-surface text-[#18191A] h-[52px] rounded-full font-card-title text-card-title flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-[#55B3FF] focus:ring-offset-2 focus:ring-offset-background">
                        查看训练详情
                    </button>
<button class="w-full bg-surface-container-high border border-white/5 text-on-surface h-touch-target rounded-full font-body-compact text-body-compact flex items-center justify-center hover:bg-surface-variant active:scale-[0.98] transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-[#55B3FF] focus:ring-offset-2 focus:ring-offset-background shadow-[inset_0_1px_0_rgba(255,255,255,0.05),inset_0_-1px_0_rgba(0,0,0,0.3)]">
                        调整今天安排
                    </button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full max-w-[390px] z-50 pb-safe bg-[#101111] border-t border-white/5">
<!-- Strict prohibition on border-t per specs -->
<div class="flex justify-around items-center h-[56px] w-full px-base">
<!-- Active Item -->
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-bold font-eyebrow text-eyebrow hover:bg-surface-container-high dark:hover:bg-surface-container scale-95 active:scale-90 transition-transform duration-150 w-16 h-full gap-1 rounded-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span>跑者</span>
</button>
<!-- Inactive Items -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant font-eyebrow text-eyebrow hover:bg-surface-container-high dark:hover:bg-surface-container scale-95 active:scale-90 transition-transform duration-150 w-16 h-full gap-1 rounded-lg">
<span class="material-symbols-outlined">fitness_center</span>
<span>训练</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant font-eyebrow text-eyebrow hover:bg-surface-container-high dark:hover:bg-surface-container scale-95 active:scale-90 transition-transform duration-150 w-16 h-full gap-1 rounded-lg">
<span class="material-symbols-outlined">analytics</span>
<span>数据</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant font-eyebrow text-eyebrow hover:bg-surface-container-high dark:hover:bg-surface-container scale-95 active:scale-90 transition-transform duration-150 w-16 h-full gap-1 rounded-lg">
<span class="material-symbols-outlined">smart_toy</span>
<span>教练</span>
</button>
</div>
</nav>
</div>
</body></html>
