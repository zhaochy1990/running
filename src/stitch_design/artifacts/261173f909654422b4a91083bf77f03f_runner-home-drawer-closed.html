<div class="flex items-center gap-sm">
<p class="font-label text-label text-on-surface-variant">7月14日 周二</p>
<div class="w-[1px] h-3 bg-outline-variant"></div>
<p class="font-label text-label text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">sync_saved_locally</span>

                </p>
</div>
<h2 class="font-display text-display text-on-surface">早上好，朝毅.</h2>
<!-- Decision -->
<div class="mt-sm">
<p class="font-body text-body text-on-surface border-l-2 border-primary pl-md py-xs">

                </p>
</div>
</section>

<div class="flex flex-col gap-xs">

<div class="flex items-baseline gap-xs">
<span class="font-data-tabular text-data-tabular text-on-surface">52</span>
<span class="font-label text-label text-on-surface-variant">ms</span>
</div>

<span class="font-label text-label text-on-surface-variant">bpm</span>
</div>

</div>
<div class="flex flex-col gap-xs border-l border-outline-variant/30 pl-md">
<span class="font-label text-label text-on-surface-variant">Status</span>
<div class="flex items-baseline gap-xs">
<span class="font-data-tabular text-data-tabular text-on-surface">-8%</span>
</div>

</div>

</div>
<div class="surface-bg subtle-border rounded-lg p-xl flex items-center justify-center min-h-[100px]">
<p class="font-body-compact text-body-compact text-on-surface-variant">今天暂无活动</p>
</div>
</section>

<div class="flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-primary"></div>

<div class="flex flex-col gap-xs">
<span class="font-label text-label text-on-surface-variant">心率区间</span>
<span class="font-data-tabular text-data-tabular text-on-surface">Z3 · 150–162 <span class="font-label text-label text-on-surface-variant">bpm</span></span>
