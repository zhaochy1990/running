<!DOCTYPE html>

<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
<style>
    html, body {
      width: 100%;
      max-width: 390px;
      height: 100dvh;
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background-color: #07080A; /* Opaque dark background */
    }
    
    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
        animation: spin-slow 2s linear infinite;
    }
  </style>

<body class="text-on-surface antialiased relative">
<!-- ========================================== -->
<!-- UNDERLYING PAGE (Mocked "Runner" Home)     -->
<!-- ========================================== -->
<div aria-hidden="true" class="w-full h-full flex flex-col relative" inert="">
<main class="flex-1 w-full relative pt-[env(safe-area-inset-top)] px-margin-mobile">
<!-- Mock Top App Bar -->
<header class="flex justify-between items-center h-14 w-full sticky top-0 bg-[#07080A] z-10 border-b border-white/5"><button class="w-12 h-12 flex items-center justify-start text-primary active:scale-95 transition-transform"><span class="material-symbols-outlined">menu</span></button><h1 class="font-screen-title text-screen-title font-bold text-primary tracking-tight">跑者</h1><button class="w-12 h-12 flex items-center justify-end text-on-surface-variant active:scale-95 transition-transform"><span class="material-symbols-outlined">history</span></button></header>
<!-- Mock Content -->
<div class="mt-6"><div class="bg-[#101111] rounded-xl border border-white/5 p-4 flex items-center justify-between"><div class="flex flex-col"><span class="text-label text-on-surface-variant opacity-60 uppercase tracking-wider">今日状态</span><span class="text-body font-semibold text-on-surface">良好 · 准备好出发</span></div><div class="w-10 h-10 rounded-full bg-tertiary/20 flex items-center justify-center text-tertiary"><span class="material-symbols-outlined">bolt</span></div></div></div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="absolute bottom-0 w-full z-10 bg-[#07080A] border-t border-white/5 flex justify-around items-center h-[calc(64px+env(safe-area-inset-bottom))] px-4 pb-[env(safe-area-inset-bottom)]">
<!-- 跑者 (Active) -->
<button class="flex flex-col items-center justify-center text-primary font-bold active:scale-90 transition-all duration-200 hover:text-primary/80 w-16 h-16 pointer-events-auto">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label text-label">跑者</span>
</button>
<!-- 训练 (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 active:scale-90 transition-all duration-200 hover:text-primary/80 w-16 h-16 pointer-events-auto">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">fitness_center</span>
<span class="font-label text-label">训练</span>
</button>
<!-- 数据 (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 active:scale-90 transition-all duration-200 hover:text-primary/80 w-16 h-16 pointer-events-auto">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">leaderboard</span>
<span class="font-label text-label">数据</span>
</button>
<!-- 教练 (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 active:scale-90 transition-all duration-200 hover:text-primary/80 w-16 h-16 pointer-events-auto">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">smart_toy</span>
<span class="font-label text-label">教练</span>
</button>
</nav>
</div>
<!-- ========================================== -->
<!-- SCRIM OVERLAY                              -->
<!-- ========================================== -->
<button aria-label="关闭菜单遮罩" class="absolute inset-0 bg-black/60 z-40 w-full h-full cursor-default border-none"></button>
<!-- ========================================== -->
<!-- SIDE NAVIGATION DRAWER                     -->
<!-- ========================================== -->
<aside aria-label="账户与应用菜单" aria-modal="true" class="absolute top-0 left-0 bottom-0 w-[88%] max-w-[344px] h-[100dvh] bg-[#101111] z-50 flex flex-col pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] border-r border-white/5" role="dialog">
<!-- Drawer Header -->
<div class="h-[72px] px-margin-mobile flex items-center justify-between shrink-0">
<div class="flex items-center space-x-3">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-card-title text-card-title font-bold shadow-inner">
                        赵
                    </div>
<div class="flex flex-col">
<span class="font-body-compact text-body-compact text-on-surface font-semibold">赵朝义</span>
<span class="font-label text-label text-on-surface-variant opacity-80">zhao***@gmail.com</span>
</div>
</div>
<button aria-label="关闭菜单" autofocus="" class="w-12 h-12 flex-none flex items-center justify-center rounded-lg hover:bg-white/5 active:scale-[0.98] transition-all text-primary-container">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
<!-- Connected Device Sub-header -->
<div class="px-4 shrink-0">
<button class="w-full min-h-[48px] flex items-center justify-between px-2 py-2 rounded-lg hover:bg-white/5 active:scale-[0.98] transition-all text-primary-container">

<div class="w-10 h-10 rounded-lg bg-[#38393c] flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined text-[20px]">watch</span>
</div>
<div class="flex flex-col text-left">
<span class="font-body-compact text-body-compact font-semibold">COROS PACE 3</span>
<span class="font-label text-label flex items-center text-tertiary">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary mr-1.5"></span>
                                已连接
                            </span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-data-tabular text-[11px] text-on-surface-variant opacity-60">刚刚同步</span>
</div>
</button>
</div>
<!-- Navigation List (Tightened Vertical Density) -->
<div class="overflow-y-auto flex flex-col py-0">

</button>

</button>
<div class="h-px bg-white/5 mx-4 my-1 shrink-0"></div>
<div class="px-margin-mobile pt-2 pb-1"><span class="text-[12px] leading-[16px] font-medium text-[#9C9C9D] uppercase tracking-wider">支持与应用</span></div><button class="w-full h-[48px] px-margin-mobile flex items-center justify-between hover:bg-white/5 active:bg-white/10 transition-colors text-left group shrink-0">

</button>
</div>

</button>
<div class="text-center mt-3">

</div>
