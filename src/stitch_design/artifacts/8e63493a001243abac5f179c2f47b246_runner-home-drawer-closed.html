<style>

        body {
            background-color: #07080A; /* Deepest canvas per spec */
            color: #e3e2e5; /* on-background */

            border: 1px solid rgba(255,255,255,0.06);
        }
        
        /* Interactive depth inset highlights (simulated with box-shadow if needed, but keeping it simple) */

            background-color: #1b1c1e;

            display: none;

</div>
<h1 class="font-screen-title text-screen-title text-on-surface mb-xs">早上好，朝毅</h1>

</section>
<!-- Evidence Strip -->
<section class="grid grid-cols-3 gap-sm">

<span class="font-data-tabular text-data-tabular text-on-surface">52 ms</span>

</div>

</div>
<p class="font-body-compact text-body-compact text-on-surface-variant">今天暂无活动</p>

</div>
