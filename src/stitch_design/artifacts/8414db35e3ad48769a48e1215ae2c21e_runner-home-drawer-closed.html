<!-- TopAppBar -->

<span class="material-symbols-outlined text-[24px]" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-md font-headline-md tracking-tighter text-on-surface">STRIDE</h1>

<span class="material-symbols-outlined text-[24px]" data-icon="sync">sync</span>
</button>
</div>
</header>

<div class="flex flex-col gap-1">
<div class="text-[12px] font-data-sm text-on-surface-variant uppercase tracking-wider flex items-center">
<span class="font-body-md">7月14日 周二</span><span class="mx-1">·</span>08:12 已同步
            </div>
<h2 class="text-display-lg font-display-lg text-on-surface tracking-tighter mt-1 leading-[1.1]">早上好，朝毅</h2>
<p class="text-[15px] font-body-lg text-on-surface-variant mt-1 leading-snug">恢复正常，可以按计划完成节奏跑</p>
</div>
<!-- Evidence Strip -->
<div class="flex items-center justify-between py-2 elevation-ring bg-white/5 rounded-lg px-2 mt-1 shrink-0">
<div class="flex flex-col items-center flex-1 min-w-0">
<span class="text-[10px] text-on-surface-variant uppercase tracking-wider mb-1 truncate">HRV</span>
<span class="text-[20px] font-data-lg text-on-surface whitespace-nowrap">52<span class="text-[11px] text-on-surface-variant ml-0.5">ms</span></span>
<span class="text-[10px] text-tertiary mt-0.5 whitespace-nowrap">较基线 +4%</span>
</div>
<div class="w-[1px] h-8 bg-white/10 shrink-0 mx-1"></div>
<div class="flex flex-col items-center flex-1 min-w-0">
<span class="text-[10px] text-on-surface-variant uppercase tracking-wider mb-1 truncate">静息心率</span>
<span class="text-[20px] font-data-lg text-on-surface whitespace-nowrap">48<span class="text-[11px] text-on-surface-variant ml-0.5">bpm</span></span>
<span class="text-[10px] text-on-surface-variant mt-0.5 whitespace-nowrap">正常</span>
</div>
<div class="w-[1px] h-8 bg-white/10 shrink-0 mx-1"></div>
<div class="flex flex-col items-center flex-1 min-w-0">
<span class="text-[10px] text-on-surface-variant uppercase tracking-wider mb-1 truncate">当前状态</span>
<span class="text-[20px] font-data-lg text-on-surface whitespace-nowrap">-8%</span>
<span class="text-[10px] text-on-surface-variant mt-0.5 whitespace-nowrap">维持区</span>
</div>
</div>
<!-- Today's Activity -->
<div class="flex flex-col gap-1 mt-1 shrink-0">
<div class="flex items-center justify-between">
<h3 class="text-headline-sm font-headline-sm text-on-surface">今日活动</h3>
<button class="h-[32px] px-2 flex items-center justify-center text-[#FF6363] text-[13px] font-medium hover:opacity-80 transition-opacity">全部活动</button>
</div>
<div class="text-[14px] font-body-md text-on-surface-variant">今天暂无活动</div>
</div>

<div class="flex flex-col gap-2 mt-1 shrink-0">
<h3 class="text-headline-sm font-headline-sm text-on-surface">今日训练</h3>
<div class="bg-surface-container-low rounded-lg p-3 elevation-ring flex flex-col gap-2">
<div class="flex justify-between items-start">
<div>
<div class="flex items-center gap-2 mb-1.5">
<span class="bg-tertiary/10 text-tertiary px-1.5 py-[2px] rounded text-[10px] font-bold tracking-wide">关键课</span>
</div>

<span class="text-on-surface-variant text-[10px] mb-0.5">配速目标</span>
<span class="text-[#FF6363]">5:15–5:25 /km</span>
</div>
<div class="flex flex-col text-right">
<span class="text-on-surface-variant text-[10px] mb-0.5">目标心率</span>
<span class="text-on-surface">Z3 · 150–162 bpm</span>
</div>
</div>
<p class="text-[13px] font-body-md text-on-surface-variant italic mt-1.5 leading-snug">“安排在今晚：恢复正常，且距周日长跑超过 72 小时。”</p>
</div>
