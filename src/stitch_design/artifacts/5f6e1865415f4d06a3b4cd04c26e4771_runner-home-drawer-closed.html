<!DOCTYPE html>

<style>
        body {
            font-feature-settings: 'calt', 'kern', 'liga', 'ss03';
        }
        .font-data-sm, .font-data-lg, .font-display-lg, [class*="data-"], [class*="display-lg"] {
            font-variant-numeric: tabular-nums;
        }
        .elevation-ring {
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
        }
        .elevation-raised {
            box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.05), 0 1px 2px 0 rgba(0,0,0,0.5);
        }
        .header-shadow {
            box-shadow: inset 0 -1px 0 0 rgba(255,255,255,0.05);
        }
        .nav-shadow {
            box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.05);
        }
    </style>
<style>
    body {
      width: 100%;
      max-width: 390px;
      min-width: 0;
      min-height: 100dvh;
      margin: 0 auto;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="bg-[#07080A] text-on-surface font-body-md flex flex-col antialiased relative">
<!-- TopAppBar -->
<header class="fixed top-0 w-full max-w-[390px] bg-[#07080A] flex justify-between items-center px-2 z-50 header-shadow" style="height: calc(48px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top);">
<button aria-label="Menu" class="w-[48px] h-[48px] flex items-center justify-center text-on-surface hover:opacity-80 active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined text-[24px]" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-md font-headline-md tracking-tighter text-on-surface">STRIDE</h1>
<button aria-label="Sync Watch" class="w-[48px] h-[48px] flex items-center justify-center text-on-surface hover:opacity-80 active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined text-[24px]" data-icon="sync">sync</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-edge py-stack-gap-md flex flex-col gap-stack-gap-md h-full" style="margin-top: calc(48px + env(safe-area-inset-top)); margin-bottom: calc(56px + env(safe-area-inset-bottom));">
<!-- Header Section -->
<div class="flex flex-col gap-1">
<div class="text-data-sm font-data-sm text-on-surface-variant uppercase tracking-wider">
<span class="font-body-md">7月14日 周二</span> · 08:12 已同步
            </div>
<h2 class="text-display-lg font-display-lg text-on-surface tracking-tighter">早上好，朝毅</h2>
<p class="text-body-lg font-body-lg text-on-surface-variant">恢复正常，可以按计划完成节奏跑</p>
</div>
<!-- Evidence Strip -->
<div class="flex items-center justify-between py-stack-gap-sm elevation-ring bg-white/5 rounded-lg px-3">
<div class="flex flex-col items-center flex-1">
<span class="text-[10px] text-on-surface-variant uppercase tracking-wider mb-1">HRV</span>
<span class="text-data-lg font-data-lg text-on-surface">52 <span class="text-xs text-on-surface-variant">ms</span></span>
<span class="text-[10px] text-tertiary mt-0.5">较基线 +4%</span>
</div>
<div class="w-[1px] h-8 bg-white/10"></div>
<div class="flex flex-col items-center flex-1">
<span class="text-[10px] text-on-surface-variant uppercase tracking-wider mb-1">静息心率</span>
<span class="text-data-lg font-data-lg text-on-surface">48 <span class="text-xs text-on-surface-variant">bpm</span></span>
<span class="text-[10px] text-on-surface-variant mt-0.5">正常</span>
</div>
<div class="w-[1px] h-8 bg-white/10"></div>
<div class="flex flex-col items-center flex-1">
<span class="text-[10px] text-on-surface-variant uppercase tracking-wider mb-1">当前状态</span>
<span class="text-data-lg font-data-lg text-on-surface">-8%</span>
<span class="text-[10px] text-on-surface-variant mt-0.5">维持区</span>
</div>
</div>
<!-- Today's Activity -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<h3 class="text-headline-sm font-headline-sm text-on-surface">今日活动</h3>
<button class="h-touch-target-min flex items-center justify-center text-primary font-body-md hover:opacity-80 transition-opacity">全部活动</button>
</div>
<div class="text-body-md font-body-md text-on-surface-variant">今天暂无活动</div>
</div>
<!-- Today's Training Card -->
<div class="flex flex-col gap-2">
<h3 class="text-headline-sm font-headline-sm text-on-surface">今日训练</h3>
<div class="bg-surface-container-low rounded-lg p-3 elevation-ring flex flex-col gap-2">
<div class="flex justify-between items-start">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="bg-tertiary/10 text-tertiary px-1.5 py-0.5 rounded text-[10px] font-bold tracking-wide">关键课</span>
</div>
<h4 class="text-headline-md font-headline-md text-on-surface">节奏跑 · 8 km</h4>
<p class="text-data-sm font-data-sm text-on-surface-variant mt-0.5">18:30 · 约 48 min</p>
</div>
</div>
<div class="flex justify-between items-center bg-black/20 rounded p-2 text-data-sm font-data-sm">
<div class="flex flex-col">
<span class="text-on-surface-variant text-[10px]">配速目标</span>
<span class="text-primary">5:15–5:25 /km</span>
</div>
<div class="flex flex-col text-right">
<span class="text-on-surface-variant text-[10px]">目标心率</span>
<span class="text-on-surface">Z3 · 150–162 bpm</span>
</div>
</div>
<p class="text-body-md font-body-md text-on-surface-variant italic mt-1">“安排在今晚：恢复正常，且距周日长跑超过 72 小时。”</p>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-2 mt-auto pb-[12px]">
<button class="w-full h-[52px] min-h-[52px] flex-shrink-0 bg-[#F9F9F9] text-[#18191A] rounded-full font-headline-sm font-semibold elevation-raised active:bg-gray-300 transition-colors flex items-center justify-center">
                查看训练详情
            </button>
<button class="w-full h-[48px] min-h-[48px] text-on-surface-variant font-body-md hover:text-on-surface transition-colors flex items-center justify-center elevation-ring rounded-full">
                调整今天安排
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full max-w-[390px] z-50 flex justify-around items-center px-margin-edge bg-[#101111] nav-shadow" style="height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);">
<a class="flex flex-col items-center justify-center text-primary hover:bg-surface-container-high w-full h-full active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined mb-0.5 text-[20px]" data-icon="directions_run" style="font-variation-settings: 'FILL' 1;">directions_run</span>
<span class="text-[10px] font-label-caps">跑者</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high w-full h-full active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined mb-0.5 text-[20px]" data-icon="fitness_center">fitness_center</span>
<span class="text-[10px] font-label-caps">训练</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high w-full h-full active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined mb-0.5 text-[20px]" data-icon="bar_chart">bar_chart</span>
<span class="text-[10px] font-label-caps">数据</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high w-full h-full active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined mb-0.5 text-[20px]" data-icon="psychology">psychology</span>
<span class="text-[10px] font-label-caps">教练</span>
</a>
</nav>
