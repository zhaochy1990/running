# Coach API infrastructure defaults. Environment files and then environment
# variables override this file.
api:
  # host: 0.0.0.0
  port: 8888

auth:
  public_key_pem: ""
  public_key_path: ""
  # When set, the RS256 public key is fetched from <url>/api/system/public-key
  # at startup (only one of public_key_pem / public_key_path / auth_service_url).
  auth_service_url: "https://api.stride-running.cn"
  issuer: auth-service
  audience: ""

stride_database:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "root_password"
  database: "stride"

persistence_database:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "root_password"
  database: "coach_agent"

# Plan-job broker used by the deterministic enqueue endpoint.
plan_jobs:
  # amqp_url comes from STRIDE_COACH_PLAN_JOBS_AMQP_URL (secret; never in YAML).
  queues:
    work: plan.jobs
    retry: plan.jobs.retry
    poison: plan.jobs.poison
