<!DOCTYPE html>

<html class="dark" lang="zh-CN" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>STRIDE Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-high": "#292a2c",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "surface-container": "#1f2022",
                        "on-secondary": "#003353",
                        "surface-variant": "#343537",
                        "inverse-on-surface": "#2f3033",
                        "secondary-fixed-dim": "#97cbff",
                        "tertiary-fixed-dim": "#71dba2",
                        "secondary-fixed": "#cee5ff",
                        "surface-bright": "#38393c",
                        "on-primary": "#68000e",
                        "outline-variant": "#59413f",
                        "tertiary": "#71dba2",
                        "surface-container-lowest": "#0d0e10",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#8f0d1c",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#001d33",
                        "on-surface": "#e3e2e5",
                        "primary-fixed": "#ffdad7",
                        "on-tertiary-container": "#003821",
                        "tertiary-container": "#3eaa76",
                        "surface": "#121316",
                        "secondary-container": "#2f97e1",
                        "primary-fixed-dim": "#ffb3af",
                        "secondary": "#97cbff",
                        "inverse-surface": "#e3e2e5",
                        "on-secondary-fixed-variant": "#004a76",
                        "background": "#07080A",
                        "primary": "#ffb3af",
                        "on-tertiary-fixed": "#002112",
                        "on-primary-fixed": "#410006",
                        "surface-container-low": "#1b1c1e",
                        "on-primary-container": "#67000e",
                        "surface-tint": "#ffb3af",
                        "primary-container": "#FF6363",
                        "on-tertiary-fixed-variant": "#005232",
                        "tertiary-fixed": "#8df8bd",
                        "on-surface-variant": "#e1bfbc",
                        "on-tertiary": "#003921",
                        "on-secondary-container": "#002c49",
                        "surface-container-highest": "#343537",
                        "outline": "#a88988",
                        "inverse-primary": "#b12a30",
                        "on-background": "#F9F9F9",
                        "surface-dim": "#101111"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #07080A; }
        .input-ring:focus-within {
            box-shadow: 0 0 0 2px #FF6363;
            border-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased pb-safe overflow-x-hidden w-[390px] mx-auto relative md:w-full md:justify-center md:items-center">
<div class="flex-1 flex flex-col justify-center px-4 py-8 w-full md:max-w-[390px]">
<!-- Header -->
<div class="mb-10 flex flex-col items-center text-center">
<div class="w-20 h-20 rounded-[24px] bg-surface-container flex items-center justify-center mb-6 shadow-sm border border-white/5">
<span class="material-symbols-outlined text-[40px] text-primary-container" style="font-variation-settings: 'FILL' 1;">sprint</span>
</div>
<h1 class="font-headline text-[24px] leading-[32px] font-bold text-on-background tracking-wider mb-2">STRIDE</h1>
<p class="font-body text-[15px] leading-[22px] text-on-surface-variant font-medium tracking-[0.2px]">登录以同步训练数据并绑定微信</p>
</div>
<!-- Card Container -->
<div class="bg-surface rounded-3xl p-6 shadow-lg border border-white/5">
<!-- Form Tabs -->
<div class="flex mb-8">
<button class="flex-1 pb-4 text-[16px] font-medium text-on-surface-variant hover:text-on-background transition-colors relative" type="button">
        邮箱登录
    </button>
<button class="flex-1 pb-4 text-[16px] font-medium text-on-background relative" type="button">
        手机号登录
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-1 rounded-full bg-primary-container"></div>
</button>
</div>
<form class="space-y-6">
<!-- Phone Number -->
<div class="space-y-2">
<label class="block font-label text-[13px] leading-[16px] font-medium text-on-surface-variant tracking-[0.4px] ml-1" for="phone">手机号</label>
<div class="relative rounded-2xl bg-surface-container-highest flex items-center input-ring transition-shadow duration-200 ease-out">
<div class="pl-4 pr-3 text-[15px] font-medium text-on-surface-variant border-r border-white/10">+86</div>
<input class="flex-1 bg-transparent border-none text-[16px] text-on-background placeholder-[#7A7B7C] px-4 py-4 rounded-2xl focus:ring-0" id="phone" placeholder="请输入手机号" type="tel"/>
</div>
</div>
<!-- Verification Code -->
<div class="space-y-2">
<label class="block font-label text-[13px] leading-[16px] font-medium text-on-surface-variant tracking-[0.4px] ml-1" for="code">验证码</label>
<div class="relative rounded-2xl bg-surface-container-highest flex items-center input-ring transition-shadow duration-200 ease-out">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#7A7B7C] text-[20px]">verified_user</span>
<input class="flex-1 bg-transparent border-none text-[16px] text-on-background placeholder-[#7A7B7C] pl-12 pr-28 py-4 rounded-2xl focus:ring-0" id="code" placeholder="请输入验证码" type="text"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 text-[14px] font-medium text-primary-container px-4 py-2 hover:opacity-80 transition-opacity bg-primary-container/10 rounded-xl" type="button">获取验证码</button>
</div>
</div>
<!-- Actions -->
<div class="pt-6">
<button class="w-full h-14 rounded-2xl bg-primary-container text-white font-body text-[17px] font-medium flex items-center justify-center space-x-2 active:scale-[0.98] transition-all duration-200 shadow-lg shadow-primary-container/20 hover:shadow-primary-container/40" type="button">
<span class="">立即登录</span>
</button>
</div>
</form>
</div>
<!-- Terms -->
<div class="mt-10 text-center">
<p class="font-body text-[13px] leading-[18px] text-[#6A6B6C] tracking-[0.2px]">
                登录即代表您同意我们的<br/>
<a class="text-on-surface hover:text-on-background transition-colors underline decoration-white/20 underline-offset-2" href="#">服务条款</a> 和 <a class="text-on-surface hover:text-on-background transition-colors underline decoration-white/20 underline-offset-2" href="#">隐私政策</a>
</p>
</div>
</div>
</body></html>
