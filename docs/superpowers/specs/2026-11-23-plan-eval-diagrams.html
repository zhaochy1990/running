<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>训练计划分布式测评平台 · 设计图</title><style>
:root{color-scheme:light;--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#bf4520;--blue:#2e5aa8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Geist,-apple-system,"PingFang SC",sans-serif}main{max-width:1256px;margin:auto;padding:48px clamp(16px,4vw,64px) 80px}header{border-bottom:2px solid var(--ink);padding-bottom:22px}h1,h2{font-family:"Instrument Serif","Songti SC","STSong",serif;font-weight:650;letter-spacing:-.025em;margin:0}h1{font-size:clamp(30px,3.6vw,54px)}h2{font-size:32px}nav{margin-top:16px;display:flex;gap:24px}a{color:var(--muted);text-decoration:underline;text-underline-offset:4px}section{padding-top:38px}section+section{border-top:1px solid #bfc0c0;margin-top:32px}p{font-size:16px;color:var(--muted);line-height:1.65;margin:8px 0 16px}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:1088px;display:block}svg text{font-family:Geist,-apple-system,"PingFang SC",sans-serif;fill:var(--ink)}.name,.zone{font-weight:650}.sub,.field,.tag{fill:var(--muted)}.tag,.count{font-weight:600}.emph{fill:var(--accent)}.count{font-family:"Geist Mono",Menlo,monospace;fill:var(--ink)}.blue{fill:var(--blue)}.boundary{fill:#efeff0;stroke:#9197a4;stroke-dasharray:6 5}.node{fill:#fff;stroke:#89919e;stroke-width:1.2}.focal{fill:#fbefea;stroke:var(--accent);stroke-width:2}.divider{stroke:#c4c7cd;fill:none}.flow,.return,.network,.relation{stroke:var(--muted);stroke-width:1.6;fill:none}.return{stroke-dasharray:5 4}.network{stroke:var(--blue);stroke-width:1.8;stroke-dasharray:6 4}.relation{stroke-width:1.25}@media print{main{max-width:none;padding:0}.diagram-container{overflow:visible}svg{min-width:0}section+section{break-before:page}nav{display:none}}

#entities svg{min-width:1280px}@media print{#entities svg{min-width:0}}.exceptions{display:grid;grid-template-columns:minmax(7em,max-content) 1fr;gap:10px 22px;font-size:15px;line-height:1.65}.exceptions dt{font-weight:600}.exceptions dd{margin:0;color:var(--muted)}@media(max-width:560px){.exceptions{display:block}.exceptions dd{margin-bottom:12px}nav{gap:12px;flex-wrap:wrap}}</style></head><body><main><header><h1>训练计划分布式测评平台</h1><nav aria-label="图表导航"><a href="#architecture">系统架构</a><a href="#execution">运行器详图</a><a href="#entities">实体与属性</a></nav></header><section id="architecture"><h2>系统架构</h2><p>选择 Coach Agent 版本发起测评。每个用例先由目标 Agent 生成计划，再对已保存的计划评分。</p><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 652" role="img" aria-labelledby="architecture-title architecture-desc"><title id="architecture-title">分布式测评平台架构</title><desc id="architecture-desc">API 启动 worker，worker 获取选定版本并生成计划，持久化后才进行两路评分。</desc><defs><marker id="head-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker><marker id="head-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 z" fill="#2e5aa8"/></marker></defs><rect x="270" y="34" width="792" height="446" rx="10" class="boundary"/><text x="290" y="65" font-size="16" class="zone" text-anchor="start">分布式测评平台</text><path class="flow" d="M228 161 L296 161" marker-end="url(#head-gray)" marker-start="url(#head-gray)"/><path class="flow" d="M520 161 L664 161" marker-end="url(#head-gray)"/><text x="592" y="148" font-size="14" class="sub" text-anchor="middle">启动 worker</text><path class="flow" d="M410 222 L410 308" marker-end="url(#head-gray)" marker-start="url(#head-gray)"/><path class="flow" d="M788 222 L788 308" marker-end="url(#head-gray)"/><path class="flow" d="M518 367 L664 367" marker-end="url(#head-gray)" marker-start="url(#head-gray)"/><path class="network" d="M932 510 L932 424" marker-end="url(#head-blue)" marker-start="url(#head-blue)"/><path class="flow" d="M520 543 L585 543 Q593 543 593 535 L593 210 Q593 202 601 202 L664 202" marker-end="url(#head-gray)"/><path class="return" d="M702 220 L702 241 Q702 249 694 249 L480 249 Q472 249 472 257 L472 308" marker-end="url(#head-gray)"/><text x="539" y="273" font-size="14" class="sub" text-anchor="start">提交生成产物</text><g><rect x="16" y="104" width="212" height="116" rx="6" class="node"/><text x="30" y="124" font-size="11" class="tag" text-anchor="start">浏览器</text><text x="30" y="153" font-size="21" class="name" text-anchor="start">测评工作台</text><text x="30" y="183" font-size="14" class="sub" text-anchor="start">用例查看、新建、导入、修改</text><text x="30" y="205" font-size="14" class="sub" text-anchor="start">选择 Agent 版本与用例</text></g><g><rect x="296" y="104" width="224" height="116" rx="6" class="node"/><text x="310" y="124" font-size="11" class="tag" text-anchor="start">提交与调度</text><text x="310" y="153" font-size="21" class="name" text-anchor="start">测评 API</text><text x="310" y="183" font-size="14" class="sub" text-anchor="start">锁定版本摘要与输入</text><text x="310" y="205" font-size="14" class="sub" text-anchor="start">建任务，请求集群启动 worker</text></g><g><rect x="664" y="104" width="340" height="116" rx="6" class="node focal"/><text x="678" y="124" font-size="11" class="tag" text-anchor="start">执行阶段 · worker</text><text x="678" y="153" font-size="21" class="name" text-anchor="start">Execute</text><text x="678" y="183" font-size="14" class="sub" text-anchor="start">自动拉取目标版本，运行 Coach Agent</text><text x="678" y="205" font-size="14" class="sub" text-anchor="start">依据冻结快照与请求生成训练计划</text></g><g><rect x="296" y="308" width="224" height="116" rx="6" class="node"/><text x="310" y="328" font-size="11" class="tag" text-anchor="start">平台共享存储</text><text x="310" y="357" font-size="21" class="name" text-anchor="start">测评库</text><text x="310" y="387" font-size="14" class="sub" text-anchor="start">输入、版本与生成计划</text><text x="310" y="409" font-size="14" class="sub" text-anchor="start">检查结果、证据与报告</text></g><g><rect x="664" y="308" width="340" height="116" rx="6" class="node"/><text x="678" y="328" font-size="11" class="tag" text-anchor="start">评分阶段 · worker</text><text x="678" y="357" font-size="21" class="name" text-anchor="start">Evaluate</text><text x="678" y="387" font-size="14" class="sub" text-anchor="start">待计划持久化成功，按 plan_id 读取</text><text x="678" y="409" font-size="14" class="sub" text-anchor="start">规则 judge 与 LLM judge 独立评分</text></g><g><rect x="296" y="486" width="224" height="116" rx="6" class="node"/><text x="310" y="506" font-size="11" class="tag" text-anchor="start">版本分发</text><text x="310" y="535" font-size="21" class="name" text-anchor="start">Agent 制品仓库</text><text x="310" y="565" font-size="14" class="sub" text-anchor="start">发布版本 → 不可变摘要</text><text x="310" y="587" font-size="14" class="sub" text-anchor="start">worker 按摘要取制品</text></g><g><rect x="820" y="510" width="232" height="116" rx="6" class="node"/><text x="834" y="530" font-size="11" class="tag" text-anchor="start">外部服务</text><text x="834" y="559" font-size="21" class="name" text-anchor="start">模型 API</text><text x="834" y="589" font-size="14" class="sub" text-anchor="start">评审模型按检查调用</text><text x="834" y="611" font-size="14" class="sub" text-anchor="start">生成模型也可单独配置</text></g><text x="802" y="276" font-size="14" class="sub" text-anchor="start">计划保存成功后进入评分</text></svg></div></section><section id="execution"><h2>运行器详图</h2><p>Execute 生成并保存计划，Evaluate 使用同一个 plan_id。换版本重跑用例将产生新的运行与计划。</p><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 398" role="img" aria-labelledby="execution-title execution-desc"><title id="execution-title">Execute 与 Evaluate 的交接</title><desc id="execution-desc">选版本、启动 worker、拉取 Agent、生成和保存计划，随后规则及 LLM 独立评分。</desc><path class="flow" d="M316 104 L393 104" marker-end="url(#head-gray)"/><path class="flow" d="M695 104 L772 104" marker-end="url(#head-gray)"/><path class="flow" d="M915 167 L915 247" marker-end="url(#head-gray)"/><path class="flow" d="M772 310 L695 310" marker-end="url(#head-gray)"/><path class="flow" d="M393 310 L316 310" marker-end="url(#head-gray)"/><g><rect x="16" y="48" width="300" height="116" rx="6" class="node"/><text x="30" y="68" font-size="11" class="tag" text-anchor="start">工作台 → API</text><text x="30" y="97" font-size="21" class="name" text-anchor="start">选版本和用例</text><text x="30" y="127" font-size="14" class="sub" text-anchor="start">锁定标签对应的镜像 digest</text><text x="30" y="149" font-size="14" class="sub" text-anchor="start">为运行创建任务，请求启动 worker</text></g><g><rect x="394" y="48" width="300" height="116" rx="6" class="node"/><text x="408" y="68" font-size="11" class="tag" text-anchor="start">Execute · 加载</text><text x="408" y="97" font-size="21" class="name" text-anchor="start">拉取目标 Agent</text><text x="408" y="127" font-size="14" class="sub" text-anchor="start">worker 领取任务，按 digest 拉取</text><text x="408" y="149" font-size="14" class="sub" text-anchor="start">核对实际版本，装载只读冻结数据</text></g><g><rect x="772" y="48" width="300" height="116" rx="6" class="node"/><text x="786" y="68" font-size="11" class="tag" text-anchor="start">Execute · 执行</text><text x="786" y="97" font-size="21" class="name" text-anchor="start">生成计划</text><text x="786" y="127" font-size="14" class="sub" text-anchor="start">运行该版本真实的计划生成入口</text><text x="786" y="149" font-size="14" class="sub" text-anchor="start">捕获输出原文、实际版本和错误</text></g><g><rect x="772" y="248" width="300" height="116" rx="6" class="node focal"/><text x="786" y="268" font-size="11" class="tag" text-anchor="start">Execute → Evaluate</text><text x="786" y="297" font-size="21" class="name" text-anchor="start">保存生成产物</text><text x="786" y="327" font-size="14" class="sub" text-anchor="start">校验计划，持久化原文与摘要</text><text x="786" y="349" font-size="14" class="sub" text-anchor="start">成功提交后开放 Evaluate</text></g><g><rect x="394" y="248" width="300" height="116" rx="6" class="node"/><text x="408" y="268" font-size="11" class="tag" text-anchor="start">Evaluate · 双路</text><text x="408" y="297" font-size="21" class="name" text-anchor="start">对同一 plan_id 评分</text><text x="408" y="327" font-size="14" class="sub" text-anchor="start">规则检查约束，LLM 按量表评判</text><text x="408" y="349" font-size="14" class="sub" text-anchor="start">逐项记录分数、理由和证据</text></g><g><rect x="16" y="248" width="300" height="116" rx="6" class="node"/><text x="30" y="268" font-size="11" class="tag" text-anchor="start">测评 API → 工作台</text><text x="30" y="297" font-size="21" class="name" text-anchor="start">汇总结果</text><text x="30" y="327" font-size="14" class="sub" text-anchor="start">分开展示生成状态与评分状态</text><text x="30" y="349" font-size="14" class="sub" text-anchor="start">从报告打开本次计划与证据</text></g></svg></div><p>生成或拉取失败时跳过评分。计划已保存后 worker 中断，接管者直接恢复未完成的评分；某个 judge 出错时保留另一条结果。</p></section><section id="entities"><h2>实体与主要属性</h2><p>同一用例可以测试多个版本。通过运行、任务、生成计划和检查结果，可追溯一次评分的完整来源。</p><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1310" role="img" aria-labelledby="entities-title entities-desc"><title id="entities-title">测评实体及主要属性</title><desc id="entities-desc">运行关联发布版本，任务产生计划，检查结果引用确切产物。</desc><path class="relation" d="M340 118 L482 118"/><text x="350" y="109" font-size="13" class="count" text-anchor="start">1</text><text x="472" y="109" font-size="13" class="count" text-anchor="end">0..*</text><text x="411" y="143" font-size="13" class="sub" text-anchor="middle">提供事实</text><path class="relation" d="M798 118 L940 118"/><text x="808" y="109" font-size="13" class="count" text-anchor="start">1</text><text x="930" y="109" font-size="13" class="count" text-anchor="end">1..*</text><text x="869" y="143" font-size="13" class="sub" text-anchor="middle">配置</text><path class="relation" d="M638 231 L638 374"/><text x="647" y="250" font-size="13" class="count" text-anchor="start">1</text><text x="647" y="364" font-si
