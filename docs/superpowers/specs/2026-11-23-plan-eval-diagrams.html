<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>训练计划分布式测评平台 · 设计图</title><style>

#entities svg{min-width:1280px}#entities .label-mask{fill:var(--paper)}@media print{#entities svg{min-width:0}}.exceptions{display:grid;grid-template-columns:minmax(7em,max-content) 1fr;gap:10px 22px;font-size:15px;line-height:1.65}.exceptions dt{font-weight:600}.exceptions dd{margin:0;color:var(--muted)}@media(max-width:560px){.exceptions{display:block}.exceptions dd{margin-bottom:12px}nav{gap:12px;flex-wrap:wrap}}</style></head><body><main><header><h1>训练计划分布式测评平台</h1><nav aria-label="图表导航"><a href="#architecture">系统架构</a><a href="#execution">运行器详图</a><a href="#entities">实体与属性</a></nav></header><section id="architecture"><h2>系统架构</h2><p>选择一个 Agent 版本，勾选多个场景或全选场景库，一次运行所选场景的全部跑者快照。每份快照独立生成 Artifact，再评分。</p><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 652" role="img" aria-labelledby="architecture-title architecture-desc"><title id="architecture-title">分布式测评平台架构</title><desc id="architecture-desc">任务锁定 Agent 版本、场景清单和各场景的配置与快照。Generate 调用生成模型，Evaluate 使用已保存的 Artifact 和冻结规则。</desc><defs><marker id="head-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 z" fill="#4f5d75"/></marker><marker id="head-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 z" fill="#2e5aa8"/></marker></defs><rect x="270" y="34" width="792" height="446" rx="10" class="boundary"/><text x="290" y="65" font-size="16" class="zone" text-anchor="start">分布式测评平台</text><path class="flow" d="M228 161 L296 161" marker-end="url(#head-gray)" marker-start="url(#head-gray)"/><path class="flow" d="M520 161 L664 161" marker-end="url(#head-gray)"/><text x="592" y="148" font-size="14" class="sub" text-anchor="middle">启动 worker</text><path class="flow" d="M410 222 L410 308" marker-end="url(#head-gray)" marker-start="url(#head-gray)"/><path class="flow" d="M788 222 L788 308" marker-end="url(#head-gray)"/><path class="flow" d="M518 367 L664 367" marker-end="url(#head-gray)" marker-start="url(#head-gray)"/><path class="flow" d="M520 543 L585 543 Q593 543 593 535 L593 210 Q593 202 601 202 L664 202" marker-end="url(#head-gray)"/><path class="return" d="M702 220 L702 241 Q702 249 694 249 L480 249 Q472 249 472 257 L472 308" marker-end="url(#head-gray)"/><text x="539" y="273" font-size="14" class="sub" text-anchor="start">提交 Artifact</text><g><rect x="16" y="104" width="212" height="116" rx="6" class="node"/><text x="30" y="124" font-size="11" class="tag" text-anchor="start">浏览器</text><text x="30" y="153" font-size="21" class="name" text-anchor="start">测评工作台</text><text x="30" y="183" font-size="14" class="sub" text-anchor="start">管理场景、测试数据与测评规则</text><text x="30" y="205" font-size="14" class="sub" text-anchor="start">选版本，多选或全选场景</text></g><g><rect x="296" y="104" width="224" height="116" rx="6" class="node"/><text x="310" y="124" font-size="11" class="tag" text-anchor="start">提交与调度</text><text x="310" y="153" font-size="21" class="name" text-anchor="start">测评 API</text><text x="310" y="183" font-size="14" class="sub" text-anchor="start">冻结规则版本与逐快照输入</text><text x="310" y="205" font-size="14" class="sub" text-anchor="start">建任务，请求集群启动 worker</text></g><g><rect x="664" y="104" width="340" height="116" rx="6" class="node focal"/><text x="678" y="124" font-size="11" class="tag" text-anchor="start">执行阶段 · worker</text><text x="678" y="153" font-size="21" class="name" text-anchor="start">Generate</text><text x="678" y="183" font-size="14" class="sub" text-anchor="start">按所选版本拉取并运行 Coach Agent</text><text x="678" y="205" font-size="14" class="sub" text-anchor="start">调用生成模型 API，产出 Artifact</text></g><g><rect x="296" y="308" width="224" height="116" rx="6" class="node"/><text x="310" y="328" font-size="11" class="tag" text-anchor="start">平台共享存储</text><text x="310" y="357" font-size="21" class="name" text-anchor="start">测评库</text><text x="310" y="387" font-size="14" class="sub" text-anchor="start">规则、测试数据与任务明细</text><text x="310" y="409" font-size="14" class="sub" text-anchor="start">Artifact、执行状态与判定</text></g><g><rect x="664" y="308" width="340" height="116" rx="6" class="node"/><text x="678" y="328" font-size="11" class="tag" text-anchor="start">评分阶段 · worker</text><text x="678" y="357" font-size="21" class="name" text-anchor="start">Evaluate</text><text x="678" y="387" font-size="14" class="sub" text-anchor="start">读取 Artifact，逐条执行冻结的 Check</text><text x="678" y="409" font-size="14" class="sub" text-anchor="start">后续 LLM as Judge 复用 Check 接口</text></g><g><rect x="296" y="486" width="224" height="116" rx="6" class="node"/><text x="310" y="506" font-size="11" class="tag" text-anchor="start">版本分发</text><text x="310" y="535" font-size="21" class="name" text-anchor="start">Agent 制品仓库</text><text x="310" y="565" font-size="14" class="sub" text-anchor="start">提供已发布的 Agent 版本</text><text x="310" y="587" font-size="14" class="sub" text-anchor="start">worker 按版本取制品</text></g><text x="802" y="276" font-size="14" class="sub" text-anchor="start">Artifact 保存成功后评分</text></svg></div></section><section id="execution"><h2>运行器详图</h2><p>各 worker 分别处理快照执行项。Generate 调用生成模型 API；Evaluate 对已保存的 Artifact 运行固定规则。</p><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 398" role="img" aria-labelledby="execution-title execution-desc"><title id="execution-title">Generate 与 Evaluate 的交接</title><desc id="execution-desc">逐快照调用生成模型并保存 Artifact，随后运行冻结的固定规则。</desc><path class="flow" d="M316 104 L393 104" marker-end="url(#head-gray)"/><path class="flow" d="M695 104 L772 104" marker-end="url(#head-gray)"/><path class="flow" d="M915 167 L915 247" marker-end="url(#head-gray)"/><path class="flow" d="M772 310 L695 310" marker-end="url(#head-gray)"/><path class="flow" d="M393 310 L316 310" marker-end="url(#head-gray)"/><g><rect x="16" y="48" width="300" height="116" rx="6" class="node"/><text x="30" y="68" font-size="11" class="tag" text-anchor="start">工作台 → API</text><text x="30" y="97" font-size="21" class="name" text-anchor="start">创建测评任务</text><text x="30" y="127" font-size="14" class="sub" text-anchor="start">选择一个版本和多个场景</text><text x="30" y="149" font-size="14" class="sub" text-anchor="start">逐场景冻结规则与快照输入</text></g><g><rect x="394" y="48" width="300" height="116" rx="6" class="node"/><text x="408" y="68" font-size="11" class="tag" text-anchor="start">Generate · 加载</text><text x="408" y="97" font-size="21" class="name" text-anchor="start">拉取目标 Agent</text><text x="408" y="127" font-size="14" class="sub" text-anchor="start">worker 领取执行项，按所选版本拉取</text><text x="408" y="149" font-size="14" class="sub" text-anchor="start">核对版本，载入本项跑者数据</text></g><g><rect x="772" y="48" width="300" height="116" rx="6" class="node"/><text x="786" y="68" font-size="11" class="tag" text-anchor="start">Generate · 执行</text><text x="786" y="97" font-size="21" class="name" text-anchor="start">调用生成模型 API</text><text x="786" y="127" font-size="14" class="sub" text-anchor="start">执行真实 Agent，生成本项内容</text><text x="786" y="149" font-size="14" class="sub" text-anchor="start">记录执行输出或错误</text></g><g><rect x="772" y="248" width="300" height="116" rx="6" class="node focal"/><text x="786" y="268" font-size="11" class="tag" text-anchor="start">Generate → Evaluate</text><text x="786" y="297" font-size="21" class="name" text-anchor="start">保存 Artifact</text><text x="786" y="327" font-size="14" class="sub" text-anchor="start">按类型校验，保存内容、摘要与来源</text><text x="786" y="349" font-size="14" class="sub" text-anchor="start">成功提交后开放 Evaluate</text></g><g><rect x="394" y="248" width="300" height="116" rx="6" class="node"/><text x="408" y="268" font-size="11" class="tag" text-anchor="start">Evaluate · 固定规则</text><text x="408" y="297" font-size="21" class="name" text-anchor="start">逐条执行 Check</text><text x="408" y="327" font-size="14" class="sub" text-anchor="start">加载任务冻结的规则实现</text><text x="408" y="349" font-size="14" class="sub" text-anchor="start">逐条记录判定和违反项</text></g><g><rect x="16" y="248" width="300" height="116" rx="6" class="node"/><text x="30" y="268" font-size="11" class="tag" text-anchor="start">测评 API → 工作台</text><text x="30" y="297" font-size="21" class="name" text-anchor="start">汇总结果</text><text x="30" y="327" font-size="14" class="sub" text-anchor="start">逐快照展示生成、评分状态</text><text x="30" y="349" font-size="14" class="sub" text-anchor="start">按场景分组，汇总任务结果</text></g></svg></div><p>某位跑者的生成模型调用失败时，只跳过该快照的评分。Artifact 已保存后中断，接管者恢复尚未完成的检查。</p></section><section id="entities">
<h2>实体与主要属性</h2>
<p>场景引用已发布的测评规则版本和测试数据。提交任务时分别固定规则实现、跑者快照和生成请求。</p>
