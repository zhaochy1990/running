<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STRIDE · 小程序赛季训练计划审阅原型</title>
  <style>
  :root {
    --bg: #f5f6f4;
    --paper: #fff;
    --ink: #202b29;
    --muted: #65716c;
    --line: #dfe5df;
    --green: #215d46;
    --soft: #eaf2eb;
    --orange: #a45a2a;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: #e7eae5;
    color: var(--ink);
    font:
      14px -apple-system,
      BlinkMacSystemFont,
      "PingFang SC",
      "Microsoft YaHei",
      sans-serif;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
  }
  button {
    cursor: pointer;
    border: 0;
    background: none;
    color: inherit;
  }
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 3px;
  }
  button:disabled {
    opacity: 0.5;
    cursor: wait;
  }
  ::selection {
    background: #c4dec9;
  }
  aside {
    position: fixed;
    left: calc(50% - 430px);
    top: 95px;
    width: 180px;
  }
  aside h1 {
    font-size: 22px;
    line-height: 1.5;
    margin: 0 0 12px;
  }
  aside p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.9;
  }
  aside button {
    display: block;
    margin: 8px 0;
    padding: 9px 12px;
    border-radius: 6px;
    text-align: left;
    width: 100%;
  }
  aside button:hover {
    background: #dce3db;
  }
  .phone {
    width: 390px;
    height: min(844px, calc(100dvh - 48px));
    min-height: 600px;
    margin: 24px auto;
    background: var(--bg);
    border: 1px solid #cbd2ca;
    border-radius: 32px;
    box-shadow: 0 18px 55px #263a2920;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .status {
    padding: 14px 24px 6px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 650;
    background: white;
  }
  .nav {
    height: 48px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
    border-bottom: 1px solid #edf0ec;
    font-weight: 650;
    font-size: 16px;
  }
  .back {
    position: absolute;
    left: 12px;
    padding: 10px;
  }
  .capsule {
    position: absolute;
    right: 12px;
    border: 1px solid #e6e8e5;
    border-radius: 20px;
    padding: 5px 9px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .capsule svg {
    width: 17px;
    height: 17px;
  }
  .scroll {
    flex: 1;
    overflow: auto;
    scrollbar-width: thin;
    scrollbar-color: #c7d4c9 transparent;
    padding: 20px 16px 24px;
  }
  .time {
    text-align: center;
    color: #79837d;
    font-size: 11px;
    margin-bottom: 20px;
  }
  .user {
    background: #dcebdd;
    border-radius: 14px 3px 14px 14px;
    margin: 0 0 24px 55px;
    padding: 13px 15px;
    line-height: 1.7;
  }
  .coachline {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .avatar {
    background: var(--green);
    color: white;
    border-radius: 7px;
    padding: 5px 6px;
    font-weight: 800;
    font-style: italic;
    letter-spacing: -1px;
  }
  .speech {
    line-height: 1.85;
    margin: 0 0 15px;
    font-size: 14px;
  }
  .form {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
  }
  .formhead {
    padding: 18px 18px 16px;
    background: #f9fbf8;
    border-bottom: 1px solid var(--line);
  }
  h2 {
    font-size: 19px;
    letter-spacing: -0.5px;
    margin: 0 0 7px;
  }
  p {
    margin: 0;
  }
  .sub {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  .section {
    padding: 18px;
    border-bottom: 1px solid #edf0eb;
  }
  .section h3 {
    font-size: 14px;
    margin: 0 0 15px;
  }
  .field {
    margin-top: 15px;
  }
  .label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 8px;
  }
  .label small {
    color: var(--muted);
    font-size: 11px;
  }
  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    padding: 11px 10px;
    color: var(--ink);
    min-width: 0;
  }
  textarea {
    resize: vertical;
    line-height: 1.6;
  }
  .row {
    display: flex;
    gap: 8px;
  }
  .row > * {
    flex: 1;
    min-width: 0;
  }
  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12px;
  }
  .chip.sel {
    background: var(--soft);
    border-color: #5f876d;
    color: var(--green);
    font-weight: 600;
  }
  .hint {
    font-size: 11px;
    line-height: 1.7;
    color: var(--muted);
    margin-top: 8px;
  }
  .days {
    display: flex;
    gap: 5px;
  }
  .day {
    flex: 1;
    padding: 9px 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12px;
  }
  .day.sel {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
  }
  .primary {
    background: var(--green);
    color: white;
    border-radius: 8px;
    padding: 13px 16px;
    font-weight: 600;
    width: 100%;
  }
  .secondary {
    border: 1px solid #b9cabc;
    border-radius: 8px;
    padding: 12px 15px;
    color: var(--green);
    background: white;
  }
  .formfoot {
    padding: 16px 18px;
  }
  .composer {
    background: white;
    border-top: 1px solid var(--line);
    padding: 10px 14px 23px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .composer input {
    background: var(--bg);
    border: 0;
    border-radius: 9px;
    font-size: 13px;
  }
  .send {
    background: var(--green);
    border-radius: 8px;
    padding: 8px;
    color: white;
    width: 40px;
    flex-shrink: 0;
  }
  .send svg {
    width: 20px;
    height: 20px;
  }
  .plan-card {
    background: white;
    border: 1px solid #b6ccbb;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
  }
  .cardbody {
    padding: 19px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--green);
    margin-bottom: 12px;
  }
  .dot {
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 100%;
  }
  .plan-card h2 {
    font-size: 22px;
    line-height: 1.4;
  }
  .stats {
    display: flex;
    gap: 16px;
    margin-top: 21px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .stats > div {
    flex: 1;
  }
  .stats strong {
    display: block;
    font-size: 19px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .stats span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    margin-top: 5px;
  }
  .cardcta {
    padding: 14px 19px;
    background: #edf4ed;
    color: var(--green);
    display: flex;
    justify-content: space-between;
    font-weight: 600;
    font-size: 13px;
  }
  .note {
    padding: 13px 0;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
  }
  .summary {
    padding: 4px 3px 23px;
  }
  .summary h1 {
    font-size: 28px;
    letter-spacing: -1px;
    line-height: 1.35;
    margin: 10px 0;
  }
  .summary .stats {
    margin-top: 17px;
  }
  .block {
    background: white;
    padding: 18px;
    border-radius: 10px;
    border: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .block h3 {
    font-size: 15px;
    margin: 0 0 15px;
  }
  .phase {
    display: flex;
    gap: 13px;
    padding: 0 0 19px;
  }
  .phase:last-child {
    padding-bottom: 0;
  }
  .rail {
    width: 10px;
    position: relative;
    flex-shrink: 0;
  }
  .rail:before {
    content: "";
    position: absolute;
    left: 3px;
    top: 11px;
    bottom: -11px;
    width: 1px;
    background: #c8d9cb;
  }
  .phase:last-child .rail:before {
    display: none;
  }
  .rail:after {
    content: "";
    position: absolute;
    top: 5px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #62876a;
  }
  .phase h4 {
    margin: 0 0 5px;
    font-size: 13px;
  }
  .phase .meta {
    font-size: 11px;
    color: var(--green);
    margin-bottom: 6px;
  }
  .phase p {
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
  }
  .workout {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #edf0eb;
    font-size: 12px;
  }
  .workout:last-child {
    border-bottom: 0;
    padding-bottom: 0;
  }
  .workout span {
    color: var(--muted);
    font-size: 11px;
  }
  .footer {
    background: white;
    border-top: 1px solid var(--line);
    padding: 12px 16px 25px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .footer .secondary {
    flex: 1;
  }
  .footer .primary {
    flex: 1.4;
  }
  .applied {
    text-align: center;
    padding: 55px 12px 25px;
  }
  .check {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #deeddf;
    color: var(--green);
    display: grid;
    place-items: center;
    margin: 0 auto 22px;
  }
  .check svg {
    width: 27px;
    height: 27px;
  }
  .applied h2 {
    font-size: 24px;
  }
  .applied p {
    color: var(--muted);
    line-height: 1.8;
    font-size: 13px;
    margin: 12px 0 28px;
  }
  .loading {
    padding: 22px 18px;
    border-radius: 12px;
    background: white;
    border: 1px solid var(--line);
  }
  .loadbar {
    height: 3px;
    background: #e0e9df;
    margin: 18px 0;
    overflow: hidden;
  }
  .loadbar:after {
    content: "";
    display: block;
    width: 50%;
    height: 100%;
    background: var(--green);
    animation: load 1.5s ease-in-out infinite;
  }
  @keyframes load {
    from {
      transform: translateX(-100%);
    }
    to {
      transform: translateX(200%);
    }
  }
  .change {
    background: #edf4ed;
    padding: 12px;
    border-radius: 7px;
    line-height: 1.8;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .error {
    color: #a13728;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .tabbar {
    display: flex;
    background: white;
    border-top: 1px solid var(--line);
    padding: 10px 0 20px;
  }
  .tabbar button {
    flex: 1;
    font-size: 11px;
    color: var(--muted);
  }
  .tabbar button.active {
    color: var(--green);
    font-weight: 650;
  }
  .tabbar svg {
    display: block;
    margin: 0 auto 5px;
    width: 21px;
    height: 21px;
  }
  .preview-label {
    position: fixed;
    right: 28px;
    bottom: 20px;
    color: var(--muted);
    font-size: 11px;
  }
  .inlinebtn {
    color: var(--green);
    text-decoration: underline;
    text-underline-offset: 3px;
    font-size: 12px;
    padding: 0;
  }
  @media (max-width: 800px) {
    aside {
      display: none;
    }
  }
  @media (max-width: 430px) {
    body {
      background: var(--bg);
    }
    .phone {
      width: 100%;
      height: 100dvh;
      min-height: 0;
      border: 0;
      border-radius: 0;
      margin: 0;
      box-shadow: none;
    }
    .preview-label {
      display: none;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
    }
  }
  .formhead {
    padding: 18px;
  }
  .formhead h2 {
    margin: 0;
  }
  .form-tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  .form-tabs button {
    flex: 1;
    min-height: 48px;
    font-size: 13px;
    color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  .form-tabs button.active {
    color: var(--green);
    border-bottom-color: var(--green);
    font-weight: 650;
  }
  .help-button {
    border: 1px solid #789382;
    border-radius: 50%;
    height: 20px;
    width: 20px;
    display: grid;
    place-items: center;
    color: var(--green);
    font-size: 12px;
    padding: 0;
    position: relative;
  }
  .help-button:after {
    content: "";
    position: absolute;
    inset: -10px;
  }
  .help-text {
    background: var(--soft);
    color: var(--green);
    font-size: 12px;
    line-height: 1.8;
    padding: 11px;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .time-picker {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .time-picker > div {
    flex: 1;
    text-align: center;
  }
  .time-picker select {
    font-size: 21px;
    font-weight: 600;
    text-align: center;
    font-variant-numeric: tabular-nums;
    height: 48px;
    background: #f8faf7;
  }
  .time-picker > div > span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 7px;
  }
  .colon {
    padding-top: 12px;
    font-size: 18px;
    color: var(--muted);
  }
  .card-actions {
    display: flex;
    border-top: 1px solid var(--line);
    padding: 12px 16px;
    align-items: center;
    gap: 12px;
  }
  .edit-target {
    font-size: 12px;
    color: var(--muted);
    padding: 9px 0;
  }
  .open-plan {
    margin-left: auto;
    background: var(--green);
    color: white;
    padding: 11px 14px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
  }
  .adjust-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .adjust-options .chip {
    text-align: left;
    padding: 13px 14px;
    background: white;
  }
  .plan-card {
    cursor: default;
  }
  .formhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px;
  }
  .formhead h2 {
    font-size: 16px;
    white-space: nowrap;
  }
  .form-tabs {
    display: flex;
    background: #e9eee8;
    padding: 3px;
    border: 0;
    border-radius: 7px;
    flex-shrink: 0;
  }
  .form-tabs button {
    position: relative;
    flex: none;
    min-height: 30px;
    border: 0;
    border-radius: 5px;
    padding: 6px 9px;
    font-size: 11px;
    line-height: 18px;
  }
  .form-tabs button:after {
    content: "";
    position: absolute;
    inset: -5px 0;
  }
  .form-tabs button.active {
    background: white;
    color: var(--green);
    box-shadow: 0 1px 3px #263a2912;
  }
  .time-picker {
    height: 42px;
    border: 1px solid var(--line);
    border-radius: 7px;
    align-items: center;
    gap: 0;
    background: white;
    overflow: hidden;
  }
  .time-picker > div {
    height: 100%;
    min-width: 0;
  }
  .time-picker select {
    height: 100%;
    width: 100%;
    font-size: 14px;
    font-weight: 400;
    background: transparent;
    border: 0;
    border-radius: 0;
    padding: 9px 14px;
    text-align: center;
    appearance: auto;
  }
  .time-picker .colon {
    padding: 0;
    font-size: 14px;
    color: var(--muted);
    flex: none;
  }
  .time-picker:focus-within {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }
  .time-picker select:focus-visible {
    outline: 0;
  }
  .plan-heading {
    padding: 5px 2px 25px;
  }
  .plan-state {
    font-size: 11px;
    color: var(--green);
    margin-bottom: 10px;
  }
  .plan-heading h1 {
    font-size: 25px;
    line-height: 1.4;
    letter-spacing: -0.6px;
    margin: 0 0 8px;
  }
  .plan-target {
    font-size: 14px;
    font-weight: 550;
    margin-bottom: 7px;
  }
  .section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4px 0 13px;
  }
  .section-heading h2 {
    font-size: 16px;
    margin: 0;
  }
  .section-heading > span {
    font-size: 10px;
    color: var(--muted);
  }
  summary {
    cursor: pointer;
    list-style: none;
  }
  summary::-webkit-details-marker {
    display: none;
  }
  summary:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: -2px;
    border-radius: 7px;
  }
  .stage-detail {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .stage-detail > summary {
    padding: 17px 16px;
  }
  .stage-title {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .stage-title > div {
    flex: 1;
  }
  .stage-title h3 {
    font-size: 16px;
    margin: 0 0 6px;
  }
  .stage-title p {
    font-size: 10px;
    color: var(--muted);
  }
  .stage-length {
    color: var(--green);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .disclosure-arrow {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    color: var(--muted);
  }
  details[open] > summary > .disclosure-arrow,
  details[open] > summary > .stage-title > .disclosure-arrow {
    transform: rotate(90deg);
  }
  .stage-aim {
    font-size: 12px;
    line-height: 1.7;
    margin-top: 11px;
    color: var(--muted);
  }
  .stage-detail[open] > summary {
    border-bottom: 1px solid var(--line);
  }
  .stage-content {
    padding: 17px 16px 0;
  }
  .stage-content h4 {
    font-size: 12px;
    margin: 0 0 9px;
  }
  .stage-goals ul {
    padding-left: 15px;
    margin: 0;
    font-size: 12px;
    line-height: 1.9;
    color: #485a50;
  }
  .training-structure {
    margin-top: 17px;
    padding: 13px;
    background: #f4f7f2;
    border-radius: 7px;
  }
  .training-structure p {
    font-size: 12px;
    line-height: 1.8;
  }
  .volume {
    font-size: 11px;
    color: var(--green);
    margin-top: 9px;
  }
  .volume span {
    padding: 0 5px;
  }
  .weeks-heading {
    margin-top: 20px !important;
  }
  .week-detail {
    border-top: 1px solid var(--line);
  }
  .week-detail > summary {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 14px 0;
  }
  .week-detail > summary > div {
    flex: 1;
  }
  .week-detail strong {
    font-size: 12px;
    font-weight: 600;
  }
  .week-detail strong span {
    font-weight: 400;
    color: var(--muted);
    font-size: 11px;
    margin-left: 7px;
  }
  .week-detail summary p {
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
  }
  .week-total {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .week-days {
    padding: 0 10px;
    margin-bottom: 12px;
    background: #f7f9f5;
    border-radius: 7px;
  }
  .day-detail > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 0;
    border-bottom: 1px solid #e6ebe3;
    font-size: 11px;

  <script>

  const esc = (v) =>

  const phaseLabels = {
    base: "基础期",
    build: "提升期",
    speed: "专项速度",
    marathon: "马拉松专项",
    taper: "赛前减量",
    recovery: "赛后恢复",
  };
  const roleLabels = { progress: "递进周", absorb: "吸收周", taper: "减量周", race: "比赛周" };
  const colors = ["#397650", "#2e8581", "#ad8427", "#c16b3c", "#587eab", "#7f7895"];
  const plan = ARTIFACT.plan;
  const phaseWeeks = (p) =>
    plan.weeks.filter((w) => w.phase_name === p.name && w.week_start >= p.start_date && w.week_start <= p.end_date);
  const docFor = (w) => ARTIFACT.weekly_docs?.find((d) => d.week_index === w.week_index);
  const skeletonFor = (w) => ARTIFACT.skeleton.weeks.find((s) => s.week === w.week_index);
  const num = (n) => (Number.isFinite(n) ? Number(n.toFixed(1)).toString() : "—");
  const shortDate = (d) => (d ? `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}` : "—");
  const range = (lo, hi) => (lo === hi ? num(lo) : `${num(lo)}–${num(hi)}`);
  const viewNav = document.createElement("div");
  viewNav.className = "plan-view-nav";
  document.querySelector(".nav").after(viewNav);
  function datePlus(d, n) {
    const dt = new Date(d + "T12:00:00Z");
    dt.setUTCDate(dt.getUTCDate() + n);
    return dt.toISOString().slice(0, 10);
  }
  function pace(n) {
    return `${Math.floor(n / 60)}:${String(Math.round(n % 60)).padStart(2, "0")}`;
  }
  function policyFor(p) {
    const w = phaseWeeks(p)[0];
    return ARTIFACT.policy.phases.find((x) => w && w.week_index >= x.start_week && w.week_index <= x.end_week);
  }
  function titleReal() {
    const t = plan.goal.target_time;
    if (!t) return `${plan.goal.race_name}完赛计划`;
    const [h, m, sec] = t.split(":").map(Number);
    return `${plan.goal.race_name}${!m && !sec ? "破" + h : String(h) + String(m).padStart(2, "0") + (sec ? String(sec).padStart(2, "0") : "") + "突破"}计划`;
  }
  function selectRealPhase(i, scroll = false) {
    planView = "overview";
    chosenPhase = i;
    renderRealPlan();
    if (scroll)
      requestAnimationFrame(() => $(".real-phase-tabs").scrollIntoView({ block: "start", behavior: "smooth" }));
  }
  function selectRealWeek(w) {
    activeWeek = w;
    chosenPhase = plan.phases.findIndex((p) => phaseWeeks(p).some((x) => x.week_index === w));
    planView = "calendar";
    renderRealPlan();
    requestAnimationFrame(() => $("#review-week-" + w).scrollIntoView({ block: "start", behavior: "smooth" }));
  }
  function metricChange(metric) {
    chartMetric = metric;
    renderRealPlan();
  }
  function durationText(d) {
    return d?.kind === "distance_m"
      ? num(d.value / 1000) + " km"
      : d?.kind === "time_s"
        ? num(d.value / 60) + " 分钟"
        : "自由时长";
  }
  function targetText(t) {
    if (!t || t.kind === "open") return "自由强度";
    if (t.kind === "pace_s_km") return `${pace(t.low)}–${pace(t.high)} /km`;
    return `${range(t.low, t.high)} ${({ hr_bpm: "bpm", power_w: "W", cadence_spm: "步/分" })[t.kind] || ""}`;
  }
  function structureView(spec) {
    if (!spec?.blocks?.length) return "";
    const kinds = { warmup: "热身", work: "主训练", recovery: "组间恢复", cooldown: "放松", rest: "休息" };
    return `<div class="workout-structure"><h4>训练结构</h4>${spec.blocks.map((block) => `<div class="workout-block">${block.repeat > 1 ? `<div class="repeat-label">重复 ${block.repeat} 组</div>` : ""}<div class="step-strip">${block.steps.map((step) => `<div class="workout-step step-${step.step_kind}"><span>${kinds[step.step_kind]}</span><strong>${durationText(step.duration)}</strong></div>`).join("")}</div><div class="step-instructions">${block.steps.map((step) => `<p><strong>${kinds[step.step_kind]}</strong> ${targetText(step.target)}${step.hr_cap_bpm ? ` · 心率 ≤${step.hr_cap_bpm}` : ""}${step.note ? `<span>${esc(step.note)}</span>` : ""}${step.rest ? `<span>步后休息：${step.rest.kind === "time_s" ? step.rest.value + "秒" : step.rest.kind === "hr_bpm" ? "心率降至" + step.rest.value + "以下" : "手动结束"}</span>` : ""}</p>`).join("")}</div></div>`).join("")}</div>`;
  }
  function stageContent() {
    const p = plan.phases[chosenPhase],
      weeks = phaseWeeks(p),
      policy = policyFor(p);
    const concise = p.focus.replace(/（(?:比赛|速度|短板|目标)证据：[\s\S]*$/, "").split("；")[0];
    const milestones = policy ? ARTIFACT.policy.milestones.filter((m) => policy.name.startsWith(m.phase)) : [];
    return `<section class="real-stage" id="real-stage-panel" role="tabpanel" aria-labelledby="real-phase-${chosenPhase}"><header class="real-stage-head"><h2>${phaseLabels[p.name]}</h2><span>第${weeks[0].week_index}–${weeks.at(-1).week_index}周 · ${shortDate(p.start_date)}—${shortDate(p.end_date)}</span></header><div class="stage-goal"><h3>阶段训练目标</h3><p>${esc(concise)}</p><details class="source-text"><summary>查看完整阶段说明 ${chevron}</summary><p>${esc(p.focus)}</p></details></div>${milestoneView(policy, milestones)}<div class="strength-recovery"><details><summary>力量训练 <span>${p.strength.sessions_per_week} 次/周</span>${chevron}</summary><p>${esc(p.strength.focus)}</p><p>${esc(p.strength.timing.replaceAll("monday", "周一").replaceAll("thursday", "周四"))}</p></details><details><summary>恢复与睡眠 <span>${esc(p.recovery.sleep_target_hours)} 小时</span>${chevron}</summary><p>${esc(p.recovery.focus)}</p><p>${esc(p.recovery.adjustment_trigger)}</p></details></div></section>`;
  }
  function goalAssessment() {
    const a = ARTIFACT.goal_assessment;
    return `<section class="assessment-feature" aria-labelledby="assessment-title"><div class="assessment-compact-title"><h2 id="assessment-title">目标评估</h2><h3>有挑战，具备冲击基础</h3></div><details class="assessment-more"><summary>查看评估依据与备选目标 ${chevron}</summary><div class="assessment-body"><p class="assessment-summary">目标 <strong>2:50:00</strong>，相比历史全马最佳 <strong>2:57:11.4</strong>，需要提升约 <strong>4.06%</strong>。</p><p class="assessment-evidence">历史跑量与长距离经历提供支持；能否冲击目标，还需通过后续专项训练与赛前状态检查。</p><div class="abc-targets">${[
      "A",
      "B",
      "C",
    ]
      .map((key) => {
        const t = a.abc_gates[key].target;
        return `<div><span>${key}目标</span><strong>${t.kind === "finish" ? "完赛" : `${Math.floor(t.time_seconds / 3600)}:${String(Math.floor((t.time_seconds % 3600) / 60)).padStart(2, "0")}:${String(Math.floor(t.time_seconds % 60)).padStart(2, "0")}`}</strong></div>`;
      })
      .join(
        "",
      )}</div><details class="source-text"><summary>查看各目标的检查条件 ${chevron}</summary><p>${esc(a.summary)}</p>${["A", "B", "C"].map((k) => `<h4>${k}目标前提</h4>${a.abc_gates[k].conditions.map((c) => `<p>${esc(c.criterion)}</p>`).join("")}`).join("")}</details></div></details></section>`;
  }
  function renderOverviewBase() {
    state = "detail";
    $("#title").textContent = "赛季训练计划";
    $("#content").innerHTML =
      `<section class="real-plan-heading"><h1>${esc(titleReal())}</h1><p class="plan-subtitle">全程马拉松 · 备赛 ${plan.start_date.replaceAll("-", "/")}—${plan.end_date.replaceAll("-", "/")}</p>${goalAssessment()}</section>${realChart()}<button class="weekly-discovery" onclick="switchPlanView('calendar')"><span><strong>查看每周训练安排</strong><small>逐周查看训练内容与休息安排</small></span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button><div class="real-phase-tabs" role="tablist" aria-label="训练阶段">${plan.phases.map((p, i) => `<button id="real-phase-${i}" style="--tab-color:${colors[i]};--tab-tint:${colors[i]}12" role="tab" aria-controls="real-stage-panel" aria-selected="${chosenPhase === i}" onclick="selectRealPhase(${i},true)"><i class="phase-tab-dot" aria-hidden="true"></i><strong>${phaseLabels[p.name]}</strong><span>${phaseWeeks(p).length}周</span></button>`).join("")}</div>${stageContent()}<details class="real-principles source-text" open><summary>总体训练原则 ${chevron}</summary>${plan.training_principles.map((t) => `<p>${esc(t)}</p>`).join("")}</details>`;

      `<div class="footer"><button class="secondary" onclick="openRealAdjust()">调整计划</button><button class="primary" onclick="applyRealDemo()" ${appliedDemo ? "disabled" : ""}>${appliedDemo ? "已启用" : "启用计划"}</button></div>`;
  }
  function milestoneView(policy, milestones) {
    if (!milestones.length) return "";
    const final = policy.canonical === "final_quality";
    return `<section class="milestone-panel"><div class="milestone-title"><h3>阶段里程碑</h3><span>训练后评估</span></div>${final ? '<p class="milestone-scope">马拉松专项与赛前减量的共同检查点</p>' : ""}${milestones.map((m, i) => `<div class="milestone-row"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="m10 2 8 8-8 8-8-8z"/></svg><div><h4>${esc(m.signal === "weekly_km" ? "周跑量与轻松跑结构" : m.signal === "long_run_km" ? "长距离耐力" : m.signal === "质量课计数" ? "速度训练完成度" : m.signal === "CTL" ? "体能与稳定跑量" : m.signal)}</h4><p>${esc(m.criterion)}</p></div></div>`).join("")}</section>`;
  }
  function switchPlanView(view) {
    if (view === "calendar")
      chosenPhase = plan.phases.findIndex((p) => phaseWeeks(p).some((w) => w.week_index === activeWeek));
    planView = view;
    renderRealPlan();
    $("#content").scrollTop = 0;
  }
  function renderRealPlan() {
    viewNav.hidden = false;
    viewNav.innerHTML = `<div role="tablist" aria-label="计划视图"><button id="overview-tab" role="tab" aria-selected="${planView === "overview"}" onclick="switchPlanView('overview')">计划概览</button><button id="calendar-tab" role="tab" aria-selected="${planView === "calendar"}" onclick="switchPlanView('calendar')">每周安排</button></div>`;
    renderOverviewBase();
    if (planView === "calendar") {
      $("#content").innerHTML = calendarView();
    }
    $("#content").setAttribute("role", "tabpanel");
    $("#content").setAttribute("aria-labelledby", planView === "calendar" ? "calendar-tab" : "overview-tab");
  }
  function openRealAdjust() {
    const dialog = $("#real-adjust");
    dialog.showModal();
    $("#real-feedback").focus();
  }
  function applyRealDemo() {
    appliedDemo = true;
    renderRealPlan();
  }
  function showRealCard() {
    viewNav.hidden = true;
    state = "ready";
    $("#title").textContent = "Coach";
    $("#content").innerHTML =
      `${coach()}<p class="speech">你的训练计划已经准备好了。</p><article class="plan-card"><div class="cardbody"><div class="badge"><span class="dot"></span>训练计划已生成</div><h2>${esc(titleReal())}</h2><p class="sub" style="margin-top:10px">${plan.goal.race_date} · 全程马拉松</p><div class="stats"><div><strong>${plan.total_weeks}周</strong></div><div><strong>${plan.phases.length}个</strong><span>训练阶段</span></div><div><strong>${num(Math.max(...plan.weeks.map((w) => w.target_weekly_km_high)))} km</strong><span>峰值周量</span></div></div></div><div class="card-actions"><button class="open-plan" onclick="renderRealPlan();$('#content').scrollTop=0">查看完整计划 →</button></div></article>`;
    $("#bottom").innerHTML = "";
    $("#content").scrollTop = 0;
  }
  function back() {
    showRealCard();
  }
  function reviewSessionRow(s) {
    const dt = new Date(s.date + "T12:00:00Z"),
      day = "日一二三四五六"[dt.getUTCDay()];
    if (s.kind === "rest")
      return `<div class="review-day review-rest"><span class="review-day-label">周${day}</span><span class="review-session-title">休息</span><span class="review-distance">—</span></div>`;
    return `<details class="review-session"><summary class="review-day"><span class="review-day-label">周${day}</span><span class="review-session-title"><i class="${s.spec?.type === "T" ? "quality-dot" : "run-dot"}"></i>${esc(s.summary)}</span><span class="review-distance">${s.total_distance_m != null ? num(s.total_distance_m / 1000) + " km" : s.total_duration_s != null ? num(s.total_duration_s / 60) + " min" : "—"}</span>${chevron}</summary><div class="review-session-expanded">${s.spec?.purpose ? `<p>${esc(s.spec.purpose)}</p>` : ""}${structureView(s.spec)}${s.spec?.note ? `<p>${esc(s.spec.note)}</p>` : ""}</div></details>`;
  }
  function reviewWeek(w) {
    const doc = docFor(w),
      sk = skeletonFor(w);
    return `<section class="review-week" id="review-week-${w.week_index}"><header><div><h3>第${w.week_index}周 <span>${roleLabels[sk?.role] || ""}</span></h3><p>${shortDate(w.week_start)}—${shortDate(datePlus(w.week_start, 6))}</p></div><div class="review-week-km"><strong>${range(w.target_weekly_km_low, w.target_weekly_km_high)}</strong><span>km 周目标</span></div></header>${doc ? `<div class="review-days">${doc.sessions.map(reviewSessionRow).join("")}</div>` : `<div class="review-future"><div><span>长距离</span><strong>${sk?.lr != null ? num(sk.lr) + " km" : "未提供"}</strong></div><div><span>质量课配额</span><strong>${sk?.q != null ? sk.q + " 次" : "未提供"}</strong></div><p>${w.week_index === 5 ? "第3周结束后，Coach 会结合你在第一阶段截至当时的训练表现和反馈，制定第5周起的具体课表。" : "具体课表将结合你的训练表现和反馈滚动制定。"}</p></div>`}</section>`;
  }
  function jumpReviewWeek(value) {
    const w = Number(value);
    activeWeek = w;
    const el = $("#review-week-" + w);
    if (el) el.scrollIntoView({ block: "start", behavior: "smooth" });
  }
  function calendarView() {
    return `<section class="week-review-page"><header class="review-page-heading"><h1>每周训练安排</h1><p>${plan.total_weeks}周 · ${shortDate(plan.start_date)}—${shortDate(plan.end_date)}</p></header><div class="review-toolbar"><span>按周浏览，上下滑动</span><select aria-label="快速跳到训练周" onchange="jumpReviewWeek(this.value)">${plan.weeks.map((w) => `<option value="${w.week_index}" ${w.week_index === activeWeek ? "selected" : ""}>跳至第${w.week_index}周 · ${shortDate(w.week_start)}</option>`).join("")}</select></div>${plan.phases.map((p, si) => `<section class="review-phase-group"><div class="review-phase-heading"><div><i style="background:${colors[si]}"></i><h2>${phaseLabels[p.name]}</h2><span>${phaseWeeks(p).length}周</span></div><button onclick="chosenPhase=${si};switchPlanView('overview');requestAnimationFrame(()=>$('.real-phase-tabs').scrollIntoView({block:'start'}))">目标与里程碑 →</button></div>${phaseWeeks(p).map(reviewWeek).join("")}</section>`).join("")}</section>`;
  }
  function chartWeekSelect(w) {
    activeWeek = Math.max(1, Math.min(plan.total_weeks, w));
    renderRealPlan();
  }
  function chartSelectPhase(i) {
    const weeks = phaseWeeks(plan.phases[i]);
    activeWeek = weeks[0].week_index;
    renderRealPlan();
  }
  function realChart() {
    const rows = plan.weeks.map((w) => ({
      w,
      phase: plan.phases.findIndex((p) => phaseWeeks(p).includes(w)),
      value: chartMetric === "km" ? w.target_weekly_km_high : skeletonFor(w)?.lr,
    }));
    const peak = Math.max(...rows.map((r) => r.value || 0)),
      peakRow = rows.find((r) => r.value === peak),
      axis = Math.ceil(peak / 20) * 20;
    const shortNames = {
      base: "基础期",
      build: "提升期",
      speed: "速度期",
      marathon: "专项期",
      taper: "减量期",
      recovery: "恢复期",
    };
    return `<section class="rhythm-chart"><header class="rhythm-header"><div><h2>${plan.total_weeks}周训练节奏</h2></div><div class="metric-switch" role="group" aria-label="图表指标"><button class="${chartMetric === "km" ? "selected" : ""}" onclick="metricChange('km')" aria-pressed="${chartMetric === "km"}">周跑量</button><button class="${chartMetric === "lr" ? "selected" : ""}" onclick="metricChange('lr')" aria-pressed="${chartMetric === "lr"}">长距离</button></div></header><div class="rhythm-metric"><span>计划目标 · km</span><span>${chartMetric === "km" ? "峰值周量" : "最长距离"} <strong>${num(peak)} km</strong></span></div><div class="rhythm-plot"><div class="rhythm-yaxis"><span>${axis}</span><span>${axis / 2}</span><span>0</span></div><div class="rhythm-data"><div class="rhythm-grid" aria-hidden="true"></div><div class="rhythm-bars" role="group" aria-label="训练周，点选柱子比较各周目标">${rows.map(({ w, phase, value }) => `<button class="rhythm-bar ${w.week_index === activeWeek ? "is-selected" : ""}" aria-pressed="${w.week_index === activeWeek}" onclick="chartWeekSelect(${w.week_index})" aria-label="第${w.week_index}周，${value == null ? "未提供" : num(value) + "公里"}，${phaseLabels[w.phase_name]}"><span class="rhythm-bar-slot"><span class="rhythm-bar-fill" style="height:${value == null ? 0 : (value / axis) * 100}%;background:${colors[phase]}">${w.week_index === activeWeek && w.week_index !== peakRow.w.week_index ? `<span class="bar-inspect">第${w.week_index}周 · ${value == null ? "未提供" : num(value) + " km"}</span>` : ""}${w.week_index === peakRow.w.week_index ? `<span class="rhythm-peak">${num(value)}</span>` : ""}</span>${value == null ? "<em>—</em>" : ""}</span><span class="rhythm-week-number">${w.week_index}</span></button>`).join("")}</div></div></div><div class="rhythm-axis-title">训练周</div><div class="rhythm-phase-row"><div></div><div class="rhythm-phases" aria-label="阶段分布">${plan.phases.map((p, i) => `<button style="flex:${phaseWeeks(p).length};--phase-color:${colors[i]}" onclick="chartSelectPhase(${i})" aria-label="${phaseLabels[p.name]}，第${phaseWeeks(p)[0].week_index}至${phaseWeeks(p).at(-1).week_index}周"><i></i><span>${shortNames[p.name]}</span></button>`).join("")}</div></div></section>`;
  }
  renderRealPlan();
  </script>
</html>
