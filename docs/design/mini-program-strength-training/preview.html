<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>力量训练 · Stride 小程序原型</title>
  <link rel="stylesheet" href="preview.css">
  <script src="mini-program-home.js" defer></script>
  <script src="manual-log.js" defer></script>
  <script src="coach-preview.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body>
  <main class="studio">
    <aside class="intro">
      <div class="wordmark">STRIDE<span></span></div>
      <h1>力量训练</h1>
      <p>微信小程序交互原型</p>

    </aside>

    <section class="demo" aria-label="小程序预览">
      <div class="device">
        <div class="status-bar" aria-hidden="true">
          <span>09:41</span>
          <span class="status-icons">
            <svg viewBox="0 0 53 14" fill="none" width="53" height="14">
              <path d="M1 12V9M4 12V7M7 12V4M10 12V2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M17 5C21 1.4 25 1.4 29 5M19 8c2.6-2.2 5.4-2.2 8 0M22 11c.8-.7 1.2-.7 2 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="34" y="3" width="16" height="9" rx="2" stroke="currentColor"/>
              <rect x="36" y="5" width="12" height="5" rx="1" fill="currentColor"/>
              <path d="M52 6v3" stroke="currentColor" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
        <header class="app-bar">
          <button type="button" class="icon-button app-back" aria-label="返回" data-action="back"></button>
          <div class="app-heading"><span id="app-title" tabindex="-1"></span><span id="app-subtitle" hidden></span></div>
          <div class="wechat" aria-hidden="true"><span></span><i></i><b></b></div>
        </header>
        <div id="screen" class="screen"></div>
        <footer id="actions" class="app-actions"></footer>
        <div class="device-bottom">
          <nav id="mp-tabs" class="mp-tabs" aria-label="小程序底部导航" hidden></nav>
          <div class="home-indicator" aria-hidden="true"></div>
        </div>
        <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
      </div>
    </section>

    <aside class="journey">
      <h2>体验路径</h2>
      <ol class="guided-journey" hidden>
        <li data-stage="plan" aria-current="step"><span></span><div><strong>查看课表</strong><small>动作、目标与组间休息</small></div></li>
        <li data-stage="active"><span></span><div><strong>逐组记录</strong><small>修改实际完成量，勾选完成</small></div></li>
        <li data-stage="rest"><span></span><div><strong>组间休息</strong><small>查看下一组，可跳过倒计时</small></div></li>
        <li data-stage="summary"><span></span><div><strong>训练小结</strong><small>回顾本次完成情况</small></div></li>
      </ol>
      <ol class="manual-journey">
        <li data-stage="schedule"><span></span><div><strong>训练</strong><small>打开自由力量训练</small></div></li>
        <li data-stage="manualEdit"><span></span><div><strong>边练边记</strong><small>逐组填写，保存后可继续录入</small></div></li>
        <li data-stage="manualSaved"><span></span><div><strong>训练记录</strong><small>完成后可查看明细</small></div></li>
        <li data-stage="records"><span></span><div><strong>记录</strong><small>从活动列表回看或编辑</small></div></li>
        <li data-stage="coach"><span></span><div><strong>教练</strong><small>提问或接着聊本次训练</small></div></li>
      </ol>
      <p class="sample-note">演示数据 · 刷新后重置</p>
    </aside>
  </main>
</body>
</html>
