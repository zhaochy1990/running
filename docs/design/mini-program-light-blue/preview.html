<!doctype html>
<html lang="zh-CN" data-theme="sky">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STRIDE 小程序蓝色主题设计稿</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f7f9fb;
      --surface: #ffffff;
      --sunken: #eff2f6;
      --line: #ebeef3;
      --ink: #2c3340;
      --muted: #6b7280;
      --accent: #40aeff;
      --tint: #eaf7ff;
      --deep: #00528f;
      --on-accent: #052e50;
      --tab-active: var(--deep);
      --running: #00a85a;
      --training-bar: #4c8dff;
      --training-bar-muted: rgba(76, 141, 255, .6);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    [data-theme="blue"] {
      --accent: #006bfa;
      --tint: #eaf3ff;
      --deep: #004fac;
      --on-accent: #ffffff;
    }

    [data-theme="current"] {
      --accent: #ff6363;
      --tint: #ffecec;
      --deep: #d04545;
      --on-accent: #ffffff;
      --tab-active: var(--accent);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #f5f8fb; }
    button { font: inherit; }
    button:focus-visible { outline: 2px solid #00528f; outline-offset: 3px; }
    ::selection { color: #00528f; background: #eaf7ff; }

    .board {
      max-width: 1552px;
      margin-inline: auto;
      padding: 38px clamp(16px, 3.6vw, 56px) 36px;
    }

    .board-header { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
    h1 { margin: 0; font-size: clamp(28px, 3vw, 44px); letter-spacing: -.035em; line-height: 1.2; }
    .intro { margin: 10px 0 0; color: #526174; font-size: 14px; line-height: 1.65; }
    .theme-control {
      display: inline-flex;
      align-self: center;
      flex-shrink: 0;
      gap: 3px;
      padding: 4px;
      background: #dde5ed;
      border-radius: 12px;
    }

    .theme-control button {
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #445367;
      cursor: pointer;
      padding: 10px 15px;
      font-size: 13px;
      line-height: 1.3;
    }

    .theme-control button[aria-pressed="true"] {
      background: var(--surface);
      color: var(--deep);
      font-weight: 650;
      box-shadow: 0 1px 3px #142b4214;
    }

    .screens { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 19px; margin-top: 26px; }
    figure { min-width: 0; margin: 0; }
    figcaption { display: flex; gap: 8px; align-items: baseline; margin: 0 0 9px 3px; }
    figcaption b { font-size: 14px; }
    figcaption span { font-size: 11px; color: #526174; }

    .phone {
      height: 632px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 26px;
      border: 1px solid #cbd5e0;
      background: var(--canvas);
      box-shadow: 0 7px 19px #233c5210;
      font-variant-numeric: tabular-nums;
    }

    .system-bar {
      height: 34px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 19px 0;
      color: #1b2230;
      font-size: 11px;
      font-weight: 700;
    }

    .system-indicators { width: 44px; height: 12px; }
    .page-header { position: relative; min-height: 55px; flex: none; text-align: center; padding-top: 4px; }
    .page-header h2 { margin: 0; color: var(--deep); font-size: 17px; line-height: 24px; font-weight: 750; }
    .page-header p { margin: 0; color: var(--muted); font-size: 11px; line-height: 17px; }
    .capsule {
      position: absolute;
      inset: 4px 9px auto auto;
      width: 65px;
      height: 25px;
      padding: 3px 5px;
      border: 1px solid #dfe3ea;
      border-radius: 99px;
      background: #ffffff88;
      color: #20242c;
    }

    .header-icon { position: absolute; top: 8px; left: 13px; color: var(--muted); }
    .page-header[data-tab="coach"] .header-icon { color: var(--deep); }
    .icon { width: 17px; height: 17px; display: inline-block; flex: none; vertical-align: middle; fill: currentColor; }

    .page-content { flex: 1; min-height: 0; padding: 7px 12px 0; overflow: auto; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; padding: 8px; }
    .day { display: grid; justify-items: center; gap: 5px; border-radius: 9px; padding: 7px 0; }
    .day small { font-size: 11px; color: var(--muted); }
    .day b { font-size: 14px; }
    .day.today { background: var(--accent); color: var(--on-accent); }
    [data-theme="sky"] .day.today { box-shadow: inset 0 0 0 1px var(--deep); }
    .day.today small { color: inherit; font-weight: 700; }
    .section-label { margin: 19px 0 8px 2px; font-size: 12px; font-weight: 650; color: #4a5260; }
    .workout { padding: 13px; }
    .workout-head, .chart-caption { display: flex; align-items: center; justify-content: space-between; gap: 7px; }
    .workout-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .workout-title > b { font-size: 14px; }
    .exercise {
      display: grid;
      flex: none;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 7px;
      color: var(--running);
      background: var(--sunken);
    }
    .chip { display: inline-block; padding: 3px 6px; border-radius: 5px; background: var(--tint); color: var(--deep); font-size: 11px; white-space: nowrap; }
    .workout-tools { display: flex; gap: 6px; color: var(--muted); }
    .workout-tools .icon { width: 14px; height: 14px; }
    .workout-title .chip { background: var(--sunken); color: #4a5260; }
    .chart-caption { margin-top: 16px; font-size: 11px; font-weight: 650; color: #4a5260; }
    .chart-caption span { color: var(--deep); font-weight: 500; }
    .chart {
      height: 56px;
      margin-top: 8px;
      display: flex;
      align-items: end;
      gap: 3px;
      border-bottom: 1px solid #dbe3ed;
    }
    .chart i { flex: 1; background: var(--training-bar); border-radius: 2px 2px 0 0; }
    .chart i:first-child, .chart i:last-child { background: var(--training-bar-muted); }
    .workout-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 13px 0 12px; text-align: center; }
    .workout-stats b { display: block; font-size: 14px; }
    .workout-stats small { color: var(--muted); font-size: 11px; }
    .workout-note { padding: 9px 10px; border-radius: 8px; background: var(--sunken); font-size: 12px; line-height: 1.65; }
    .workout-note p { margin: 3px 0 0; color: #4a5260; }
    .coach-cta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 9px 8px;
      margin-top: 12px;
      background: var(--accent);
      border-radius: 18px;
      color: var(--on-accent);
      font-size: 11px;
      font-weight: 650;
    }
    .coach-cta .icon { width: 14px; height: 14px; }

    .month-heading { display: flex; justify-content: space-between; align-items: center; padding: 12px 12px 10px; }
    .month-heading b { display: block; font-size: 14px; }
    .month-heading small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .month-heading svg, .menu-row > .icon:last-child { color: var(--muted); width: 13px; height: 13px; }
    .month-heading .opened { transform: rotate(90deg); }
    .month + .month { border-top: 1px solid var(--line); }
    .activity {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      margin-inline: 10px;
      padding: 11px 0;
      border-top: 1px solid var(--line);
    }
    .route {
      width: 34px;
      height: 34px;
      padding: 4px;
      background: var(--sunken);
      border-radius: 6px;
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .activity b { display: block; font-size: 12px; }
    .activity p { color: var(--muted); margin: 3px 0 0; font-size: 11px; line-height: 1.35; }
    .load { text-align: right; }
    .load b { color: var(--deep); font-size: 14px; }
    .load small { color: var(--muted); font-size: 11px; }

    .messages { display: flex; flex-direction: column; gap: 16px; padding-top: 15px; }
    .message { padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px 13px 13px 13px; font-size: 12px; line-height: 1.75; }
    .message.user { align-self: end; max-width: 90%; background: var(--accent); color: var(--on-accent); border-color: transparent; border-radius: 13px 4px 13px 13px; font-weight: 600; }
    .message.assistant { align-self: start; max-width: 94%; }
    .message p { margin: 0; }
    .message p + p { margin-top: 7px; }
    .message-footer { display: flex; align-items: center; gap: 5px; color: var(--muted); margin-top: 7px; font-size: 11px; }
    .message-footer .icon { width: 12px; height: 12px; }
    .composer { display: flex; gap: 7px; padding: 8px 11px; }
    .composer-field { flex: 1; min-width: 0; border-radius: 18px; padding: 0 10px; line-height: 33px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 11px; }
    .send { border-radius: 18px; display: grid; place-items: center; padding-inline: 13px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; }

    .profile-card { display: flex; align-items: center; gap: 10px; padding: 13px; }
    .avatar { display: grid; width: 51px; height: 51px; place-items: center; flex: none; border-radius: 50%; background: var(--sunken); color: var(--muted); }
    .avatar .icon { width: 27px; height: 27px; }
    .profile-card b { display: block; margin-bottom: 4px; font-size: 15px; }
    .profile-card > .icon { margin-left: auto; color: var(--muted); width: 13px; height: 13px; }
    .menu { margin-top: 10px; padding-inline: 11px; }
    .menu-row { display: flex; align-items: center; gap: 8px; padding: 9px 1px; min-height: 36px; font-size: 12px; }
    .menu-row + .menu-row { border-top: 1px solid var(--line); }
    .menu-row > .icon { color: var(--muted); width: 15px; height: 15px; }
    .menu-row > .icon:last-child { margin-left: auto; }
    .menu-row small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .menu-side { margin-left: auto; color: var(--deep); font-size: 11px; }
    .menu-side.done { color: var(--muted); }
    .menu-row .menu-side + .icon { margin-left: 0; }

    .bottom { flex: none; background: var(--surface); border-top: 1px solid var(--line); }
    .app-tabs { display: grid; grid-template-columns: repeat(4, 1fr); padding: 9px 2px 5px; }
    .app-tab { display: grid; justify-items: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 550; }
    .app-tab .icon { width: 22px; height: 22px; }
    .app-tab[aria-current="page"] { color: var(--tab-active); font-weight: 750; }
    .home-indicator { height: 4px; width: 34%; border-radius: 5px; margin: 5px auto 6px; background: #20242c; }

    .palette {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px 19px;
      margin: 18px 0 0;
      padding: 15px 0 0;
      border-top: 1px solid #cfd9e4;
    }
    .swatch { display: grid; grid-template-columns: 33px minmax(0, 1fr); column-gap: 9px; align-items: center; }
    .swatch::before {
      content: "";
      grid-row: span 2;
      width: 33px;
      height: 33px;
      border-radius: 8px;
      border: 1px solid #233c5222;
      background: var(--sample);
    }
    .swatch dt { font-size: 12px; font-weight: 650; }
    .swatch dd { margin: 0; font-size: 11px; letter-spacing: .035em; color: #526174; }

    @media (max-width: 1240px) {
      .board { max-width: 870px; }
      .screens, .palette { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .screens { gap: 22px 19px; }
    }

    @media (max-width: 620px) {
      .board { max-width: 440px; padding-top: 24px; }
      .board-header { align-items: start; flex-direction: column; gap: 12px; }
      .theme-control { align-self: start; }
      .screens { grid-template-columns: minmax(0, 1fr); margin-top: 20px; }
    }
  </style>
</head>

  <script>
    const systemBar = document.querySelector('#system-bar');
    const bottom = document.querySelector('#bottom');
    for (const phone of document.querySelectorAll('.phone')) {
      const header = phone.querySelector('.page-header');
      phone.prepend(systemBar.content.cloneNode(true));
      header.insertAdjacentHTML('beforeend', '<svg class="capsule" aria-hidden="true"><use href="#wechat"/></svg>');
      const nav = bottom.content.cloneNode(true);
      nav.querySelector(`[data-tab-item="${header.dataset.tab}"]`).setAttribute('aria-current', 'page');
      phone.append(nav);
    }

    const root = document.documentElement;
    const themeButtons = Array.from(document.querySelectorAll('[data-preview-theme]'));
    const swatches = document.querySelectorAll('[data-token]');

    function showTheme(theme) {
      root.dataset.theme = theme;
      for (const button of themeButtons) {
        button.setAttribute('aria-pressed', String(button.dataset.previewTheme === theme));
      }
      const colors = getComputedStyle(root);
      for (const swatch of swatches) {
        swatch.querySelector('dd').textContent = colors.getPropertyValue(`--${swatch.dataset.token}`).trim().toUpperCase();
      }
    }

    for (const button of themeButtons) {
      button.addEventListener('click', () => showTheme(button.dataset.previewTheme));
    }
  </script>
