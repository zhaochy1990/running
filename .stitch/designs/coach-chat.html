<style>
        body { font-family: 'Inter', sans-serif; }
        .font-jetbrains { font-family: 'JetBrains Mono', monospace; }
        /* Scrollbar hiding for clean aesthetic */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-canvas text-ink-primary min-h-screen flex flex-col max-w-[390px] mx-auto relative overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full max-w-[390px] bg-background z-50 flex justify-between items-center px-margin-mobile h-button-height border-b border-divider" style="height: calc(48px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px);">
<div class="flex items-center gap-3 w-10">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center overflow-hidden">
<img alt="教练头像" class="w-full h-full object-cover" data-alt="A stylized, minimalist avatar for an AI running coach. High-contrast monochromatic color scheme with intense subtle red glowing accents on a pitch-black background, conveying deep technical intelligence and elite athleticism. Professional, serious dark UI context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAcNfWUc8fZMue3lsGOG9Z6-d-FuFvB44GNCidHO8FgMcI3Y24ophEFsnvP92H5j2Xa2BBJTvvyaPHhK6HviSroIIGf0iEm7sRkZw8GnaDiG7Ur3PShvyKArwatukw1OXbYUq0HCY5b457nsjacJkuhtks-aLP_PWCeHc6GyU_pRxsiL4iqEhvvkRKZewv0uV38uj3zq0t3LTSc5FgZ6acwES7mReugFvadsNK3RZc7_VINlRVgaFG5f5KJsFUJZDHYhs9B8RhmPFLG"/>
</div>
</div>
<div class="flex flex-col items-center justify-center flex-1">
<h1 class="font-headline-screen text-headline-screen text-ink-primary">Coach</h1>
<span class="font-label-metadata text-label-metadata text-success-mint flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-success-mint animate-pulse"></span>
                在线 · 已读取今日状态
            </span>
</div>
<div class="w-10 flex justify-end">
<button aria-label="历史记录" class="w-11 h-11 flex items-center justify-center text-primary-container hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">history</span>
</button>
</div>
</header>
<!-- Chat Transcript Area -->
<main class="flex-1 overflow-y-auto pt-[80px] pb-[160px] px-margin-mobile flex flex-col gap-6" style="padding-top: calc(48px + env(safe-area-inset-top, 0px));">
<!-- Date Divider -->
<div class="flex justify-center my-2">
<span class="px-3 py-1 bg-surface-container rounded-full font-label-metadata text-label-metadata text-ink-muted">今天</span>
</div>
<!-- User Message -->
<div class="flex flex-col items-end gap-1">
<div class="bg-raised border border-divider rounded-t-xl rounded-l-xl rounded-br-sm px-4 py-3 max-w-[85%] text-ink-primary font-body-main text-body-main rounded-2xl" style="border-radius: 16px;">
                这两天腿有点沉，周四的节奏跑还要照常吗？
            </div>
</div>
<!-- Coach Message 1 -->
<div class="flex flex-col items-start gap-1">
<div class="flex items-end gap-2">
<div class="bg-surface border border-divider rounded-t-xl rounded-r-xl rounded-bl-sm px-4 py-3 max-w-[85%] text-ink-primary font-body-main text-body-main rounded-2xl" style="border-radius: 16px;">
                    明白你的感受。从你的身体指标看，连续的高强度训练确实积累了一些疲劳。
                </div>
</div>
</div>
<!-- Evidence Capsule -->
<div class="flex flex-wrap gap-2 ml-4 mb-2">
<div class="flex items-center gap-1.5 bg-coral-wash px-2.5 py-1.5 rounded-full border border-outline-variant"><span class="material-symbols-outlined text-primary-container text-[14px]">monitor_heart</span><span class="font-label-metadata text-label-metadata text-ink-secondary">HRV 较基线</span><span class="font-data-inline text-data-inline text-primary-container">-8%</span></div>
<div class="flex items-center gap-1.5 bg-surface-container px-2.5 py-1.5 rounded-full border border-divider">
<span class="material-symbols-outlined text-ink-muted text-[14px]">bedtime</span>
<span class="font-label-metadata text-label-metadata text-ink-secondary">昨晚睡眠</span>
<span class="font-data-inline text-data-inline text-ink-primary">6小时42分</span>
</div>
<div class="flex items-center gap-1.5 bg-coral-wash px-2.5 py-1.5 rounded-full border border-outline-variant"><span class="material-symbols-outlined text-primary-container text-[14px]">trending_up</span><span class="font-label-metadata text-label-metadata text-ink-secondary">近7天负荷</span><span class="font-data-inline text-data-inline text-primary-container">+12%</span></div>
</div>
<!-- Coach Message 2 -->
<div class="flex flex-col items-start gap-1">
<div class="bg-surface border border-divider rounded-xl px-4 py-3 max-w-[85%] text-ink-primary font-body-main text-body-main ml-4 rounded-2xl" style="border-radius: 16px;">
                我建议将周四的节奏跑降级，以确保更好的恢复。目前的身体信号不建议进行过大的强度刺激。
            </div>
</div>
<!-- Proposal Card -->
<div class="bg-surface border border-divider rounded-xl p-4 ml-4 max-w-[90%] relative overflow-hidden rounded-2xl" style="border-radius: 16px;"><div class="absolute top-0 left-0 w-1 h-full bg-primary-container"></div><h3 class="font-title-card text-title-card text-ink-primary mb-3 flex items-center gap-2"><span class="material-symbols-outlined text-primary-container text-[18px]">edit_calendar</span>建议调整周四训练</h3><div class="bg-raised rounded-lg p-3 mb-3 border border-divider flex items-center justify-between"><div class="flex flex-col"><span class="font-label-metadata text-label-metadata text-ink-muted line-through">节奏跑 · 3 × 10分钟</span></div><span class="material-symbols-outlined text-ink-muted text-[16px]">arrow_forward</span><div class="flex flex-col text-right"><span class="font-body-main text-body-main text-primary-container font-medium">轻松跑 · 45分钟</span></div></div><p class="font-label-metadata text-label-metadata text-ink-secondary mb-4 flex items-start gap-1"><span class="material-symbols-outlined text-ink-muted text-[14px] mt-0.5">info</span>保留周总量，降低高强度刺激</p><div class="flex gap-2"><button class="flex-1 h-11 rounded-lg bg-raised border border-divider font-body-main text-[14px] text-ink-primary flex items-center justify-center hover:bg-surface-container-high transition-colors" style="border-radius: 14px;">查看详情</button><button class="flex-1 h-11 rounded-lg bg-primary-container text-on-primary-container font-body-main text-[14px] font-medium flex items-center justify-center hover:opacity-80 transition-colors" style="border-radius: 14px;">应用到计划</button></div></div>
<!-- Coach Continuation -->
<div class="flex flex-col items-start gap-1">
<div class="bg-surface border border-divider rounded-xl px-4 py-3 max-w-[85%] text-ink-primary font-body-main text-body-main ml-4 mb-4 rounded-2xl" style="border-radius: 16px;">
                如果晨间状态恢复，我会在周六重新安排质量课。
            </div>
</div>
</main>
<!-- Bottom Pinned Chat Composer -->
<div class="fixed bottom-[64px] left-0 w-full max-w-[390px] bg-background border-t border-divider p-3 pb-safe z-40 mx-auto right-0" style="bottom: calc(64px + env(safe-area-inset-bottom, 0px)); border-radius: 16px 16px 0 0;">
<div class="flex items-end gap-2">
<button aria-label="添加附件" class="w-11 h-11 flex-shrink-0 flex items-center justify-center rounded-full bg-raised border border-divider text-ink-primary hover:bg-surface-container transition-colors mb-0.5">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add</span>
</button>
<div class="flex-1 relative bg-raised border border-divider rounded-2xl overflow-hidden focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<textarea class="w-full bg-transparent border-none text-body-main font-body-main text-ink-primary placeholder-ink-muted focus:ring-0 resize-none px-4 py-3 min-h-[48px] max-h-[120px] scrollbar-hide block" placeholder="问问 Coach..." rows="1" style="field-sizing: content;"></textarea>
<div class="absolute right-1.5 bottom-1.5 flex items-center justify-center">
<button aria-label="发送消息" class="w-11 h-11 flex items-center justify-center rounded-full bg-primary-container text-on-primary-container hover:opacity-80 transition-colors">
<span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</div>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full max-w-[390px] mx-auto right-0 z-50 flex justify-around items-center px-unit pb-safe h-[64px] bg-surface border-t border-divider" style="padding-bottom: env(safe-area-inset-bottom, 0px); height: calc(64px + env(safe-area-inset-bottom, 0px));"><button aria-label="首页" class="flex flex-col items-center justify-center text-ink-muted hover:text-primary-container transition-transform duration-200 w-16 h-16"><span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings: 'FILL' 0;">home</span><span class="font-label-nav text-label-nav">首页</span></button><button aria-label="计划" class="flex flex-col items-center justify-center text-ink-muted hover:text-primary-container transition-transform duration-200 w-16 h-16"><span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings: 'FILL' 0;">calendar_today</span><span class="font-label-nav text-label-nav">计划</span></button><button aria-label="记录" class="flex flex-col items-center justify-center text-ink-muted hover:text-primary-container transition-transform duration-200 w-16 h-16"><span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings: 'FILL' 0;">fiber_manual_record</span><span class="font-label-nav text-label-nav">记录</span></button><button aria-label="分析" class="flex flex-col items-center justify-center text-ink-muted hover:text-primary-container transition-transform duration-200 w-16 h-16"><span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings: 'FILL' 0;">insights</span><span class="font-label-nav text-label-nav">分析</span></button><button aria-current="page" aria-label="Coach" class="flex flex-col items-center justify-center text-primary-container scale-95 transition-transform duration-200 w-16 h-16"><span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings: 'FILL' 1;">chat_bubble</span><span class="font-label-nav text-label-nav font-bold">Coach</span></button></nav>
</body></html>
