name: coach-agent-api

# Coach Agent API CI/CD: `lint-and-test` runs on every PR + master push;
# `build-push` publishes the stride-coach-api image to GHCR + Aliyun ACR on
# master when the API source actually changed (path-gated so workflow-only
# edits don't republish). After the image lands, Renovate opens a version-bump
# PR against zhaochy1990/stride-devops — rollout happens by merging that PR.

on:
  push:
    branches: [master]
    paths:
      - "src/coach_agent_api/**"
      - "src/coach_agent/**"
      - "src/coach_contract/**"
      - "src/stride-common/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/coach-agent-api.yml"
  pull_request:
    paths:
      - "src/coach_agent_api/**"
      - "src/coach_agent/**"
      - "src/coach_contract/**"
      - "src/stride-common/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/coach-agent-api.yml"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      coach_api: ${{ steps.filter.outputs.coach_api }}
      calver: ${{ steps.calver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            coach_api:
              - 'src/coach_agent_api/**'
              - 'src/coach_agent/**'
              - 'src/coach_contract/**'
              - 'src/stride-common/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
      - name: Compute CalVer
        id: calver
        run: echo "version=$(date -u +%Y.%-m).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (biome check)
        run: pnpm --filter coach_agent_api check
      - name: Test
        run: pnpm --filter coach_agent_api test

  build-push:
    if: >-
      github.event_name == 'push' &&
      needs.changes.outputs.coach_api == 'true' &&
      needs.lint-and-test.result == 'success'
    needs: [changes, lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.31.2
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - name: Build and push stride-coach-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/coach_agent_api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stride-coach-api:latest
            ghcr.io/${{ github.repository_owner }}/stride-coach-api:${{ needs.changes.outputs.calver }}
            ${{ vars.ALIYUN_ACR_REGISTRY }}/stride/stride-coach-api:latest
            ${{ vars.ALIYUN_ACR_REGISTRY }}/stride/stride-coach-api:${{ needs.changes.outputs.calver }}
          cache-from: type=gha,scope=stride-coach-api
          cache-to: type=gha,scope=stride-coach-api,mode=max

  renovate:
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.changes.outputs.coach_api == 'true' &&
      needs.build-push.result == 'success'
    needs: [changes, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Node 22 for Renovate
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open version-bump PR in stride-devops (Renovate)
        continue-on-error: true
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"ghcr.io","username":"zhaochy1990","password":"${{ secrets.GHCR_READ_TOKEN }}"}]
          LOG_LEVEL: info
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "RENOVATE_TOKEN not set — skipping Renovate run."
            exit 0
          fi
          sleep 30
          for attempt in 1 2 3; do
            if npx --yes renovate@41 zhaochy1990/stride-devops; then
              exit 0
            fi
            echo "Renovate attempt ${attempt} failed."
            [ "${attempt}" -lt 3 ] && sleep 10
          done
          echo "Renovate did not succeed after 3 attempts."
          exit 1
