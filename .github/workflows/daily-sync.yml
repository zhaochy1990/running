name: Daily auto-sync

# Required GitHub Actions repository variable and secret:
#   STRIDE_GO_API_URL         — base URL of the deployed Go API, e.g.
#                               https://api.stride-running.cn
#   STRIDE_GO_INTERNAL_TOKEN  — random 32+ char string. The Go API must receive
#                               the same value as STRIDE_WORKER_API_INTERNAL_TOKEN.
# If either value is unset the workflow fails so the omission is visible.

on:
  schedule:
    # 16:00 UTC = 24:00 (00:00 next day) Asia/Shanghai. UTC+8 has no DST.
    - cron: '0 16 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build user UUID list from data/.slug_aliases.json
        id: users
        run: |
          if [ ! -f data/.slug_aliases.json ]; then
            echo "No data/.slug_aliases.json found — nothing to sync"
            : > users.txt
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            python3 -c "
          import json
          import sys
          aliases = json.load(open('data/.slug_aliases.json'))
          uuids = sorted(set(str(v) for v in aliases.values()))
          sys.stdout.write('\n'.join(uuids))
          if uuids:
              sys.stdout.write('\n')
          " > users.txt
            count=$(wc -l < users.txt | tr -d ' ')
            echo "count=$count" >> "$GITHUB_OUTPUT"
            echo "Found $count user(s):"
            cat users.txt
          fi

      - name: Trigger daily sync per user
        if: steps.users.outputs.count != '0'
        env:
          STRIDE_GO_API_URL: ${{ vars.STRIDE_GO_API_URL }}
          INTERNAL_TOKEN: ${{ secrets.STRIDE_GO_INTERNAL_TOKEN }}
        run: |
          set -u
          if [ -z "$STRIDE_GO_API_URL" ] || [ -z "$INTERNAL_TOKEN" ]; then
            echo "::error::STRIDE_GO_API_URL variable or STRIDE_GO_INTERNAL_TOKEN secret missing"
            exit 1
          fi

          echo "## Daily auto-sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| user | http | response |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|----------|" >> "$GITHUB_STEP_SUMMARY"

          fail=0
          ok=0
          MAX_RETRIES=8
          MAX_POLL_ATTEMPTS=60
          POLL_INTERVAL=15
          sync_day=$(TZ=Asia/Shanghai date +%F)
          while read -r user; do
            [ -z "$user" ] && continue
            echo "==> POST /api/$user/sync user=$user"
            http="000"
            for attempt in $(seq 1 "$MAX_RETRIES"); do
              : > /tmp/resp.json
              # The Go API only enqueues the async data_sync pipeline, so a
              # request is short. Idempotency makes retries and a duplicate
              # scheduled run safe for the same user and Shanghai calendar day.
              http=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
                --max-time 30 \
                -X POST \
                -H "X-Internal-Token: $INTERNAL_TOKEN" \
                -H "Content-Type: application/json" \
                -H "Idempotency-Key: daily-sync-$sync_day-$user" \
                --data '{"mode":"incremental"}' \
                "${STRIDE_GO_API_URL%/}/api/$user/sync") || http="000"
              if [ "$http" -lt 500 ] && [ "$http" != "000" ]; then
                break
              fi
              if [ "$attempt" -eq "$MAX_RETRIES" ]; then
                break
              fi
              delay=$((2 ** attempt))
              [ "$delay" -gt 30 ] && delay=30
              echo "  retrying $user after HTTP $http in ${delay}s ($attempt/$MAX_RETRIES)"
              sleep "$delay"
            done

            body=$(python3 -c "from pathlib import Path; print(Path('/tmp/resp.json').read_text(errors='replace')[:500].replace(chr(10), ' '))")
            run_id=$(python3 -c "import json; print(json.load(open('/tmp/resp.json')).get('run_id', ''))" 2>/dev/null || true)
            if { [ "$http" = "202" ] || [ "$http" = "200" ]; } && [ -n "$run_id" ]; then
              # A 202 means only that the Go API enqueued the pipeline. Poll
              # until it completes so a later watch-sync or compute failure
              # makes this scheduled workflow fail visibly.
              terminal=""
              for poll in $(seq 1 "$MAX_POLL_ATTEMPTS"); do
                : > /tmp/resp.json
                poll_http=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
                  --max-time 30 \
                  -H "X-Internal-Token: $INTERNAL_TOKEN" \
                  "${STRIDE_GO_API_URL%/}/api/pipelines/$run_id") || poll_http="000"
                status=$(python3 -c "import json; print(json.load(open('/tmp/resp.json')).get('status', ''))" 2>/dev/null || true)
                if [ "$poll_http" = "200" ] && { [ "$status" = "done" ] || [ "$status" = "failed" ]; }; then
                  terminal="$status"
                  break
                fi
                if [ "$poll" -lt "$MAX_POLL_ATTEMPTS" ]; then
                  sleep "$POLL_INTERVAL"
                fi
              done
              body=$(python3 -c "from pathlib import Path; print(Path('/tmp/resp.json').read_text(errors='replace')[:500].replace(chr(10), ' '))")
              if [ "$terminal" = "done" ]; then
                ok=$((ok+1))
                echo "  ✓ $user (run $run_id completed)"
                echo "| $user | $http | $body |" >> "$GITHUB_STEP_SUMMARY"
              else
                fail=$((fail+1))
                echo "::warning::Sync pipeline did not complete for $user (run $run_id, status ${terminal:-unfinished}): $body"
                echo "| $user | $http | $body |" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              fail=$((fail+1))
              echo "::warning::Sync failed for $user (HTTP $http): $body"
              echo "| $user | $http | $body |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < users.txt

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Summary: $ok ok, $fail failed**" >> "$GITHUB_STEP_SUMMARY"
          echo "Summary: $ok ok, $fail failed"
          if [ "$fail" -gt 0 ]; then
            exit 1
          fi
