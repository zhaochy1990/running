name: Daily auto-sync

# Required GitHub Actions repository variable and secret:
#   STRIDE_GO_API_URL         — base URL of the deployed Go API, e.g.
#                               https://api.stride-running.cn
#   STRIDE_GO_INTERNAL_TOKEN  — random 32+ char string. The Go API must receive
#                               the same value as STRIDE_WORKER_API_INTERNAL_TOKEN.
# If either value is unset the workflow fails so the omission is visible.

on:
  schedule:
    # 16:00 UTC = 24:00 (00:00 next day) Asia/Shanghai. UTC+8 has no DST.
    - cron: '0 16 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The user list is the set of users holding a provider credential, read
      # live from the API (devops#661 endpoint) — NOT a file in this repo. An
      # empty list (nobody bound a watch) is a visible warning, not a failure.
      - name: Build user UUID list from /api/internal/sync-users
        id: users
        env:
          STRIDE_GO_API_URL: ${{ vars.STRIDE_GO_API_URL }}
          INTERNAL_TOKEN: ${{ secrets.STRIDE_GO_INTERNAL_TOKEN }}
        run: |
          set -u
          if [ -z "$STRIDE_GO_API_URL" ] || [ -z "$INTERNAL_TOKEN" ]; then
            echo "::error::STRIDE_GO_API_URL variable or STRIDE_GO_INTERNAL_TOKEN secret missing"
            exit 1
          fi
          # One retry on a transient failure: this GET is the workflow's first
          # request against an API that scales to zero, and a cold start takes
          # ~15s (same pattern as race-calendar-sync / homecity-recompute).
          fetch_users() {
            curl -sS -o /tmp/users.json -w "%{http_code}" --max-time 30 \
              -H "X-Internal-Token: $INTERNAL_TOKEN" \
              "${STRIDE_GO_API_URL%/}/api/internal/sync-users"
          }
          http=$(fetch_users) || http="000"
          if [ "$http" != "200" ]; then
            echo "  retrying after HTTP $http (cold start?)"
            sleep 15
            http=$(fetch_users) || http="000"
          fi
          if [ "$http" != "200" ]; then
            echo "::error::GET /api/internal/sync-users failed (HTTP $http): $(head -c 300 /tmp/users.json 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          python3 -c "
          import json
          users = json.load(open('/tmp/users.json'))['users']
          if users:
              print('\n'.join(users))
          " > users.txt || { echo "::error::invalid JSON from sync-users: $(head -c 300 /tmp/users.json | tr '\n' ' ')"; exit 1; }
          count=$(wc -l < users.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "::warning::sync-users endpoint returned an empty list — no user has a bound watch, nothing to sync"
          else
            echo "Found $count user(s):"
            cat users.txt
          fi

      - name: Trigger daily sync per user
        if: steps.users.outputs.count != '0'
        env:
          STRIDE_GO_API_URL: ${{ vars.STRIDE_GO_API_URL }}
          INTERNAL_TOKEN: ${{ secrets.STRIDE_GO_INTERNAL_TOKEN }}
        run: |
          set -u
          if [ -z "$STRIDE_GO_API_URL" ] || [ -z "$INTERNAL_TOKEN" ]; then
            echo "::error::STRIDE_GO_API_URL variable or STRIDE_GO_INTERNAL_TOKEN secret missing"
            exit 1
          fi

          echo "## Daily auto-sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| user | http | response |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|----------|" >> "$GITHUB_STEP_SUMMARY"

          fail=0
          ok=0
          MAX_RETRIES=8
          MAX_POLL_ATTEMPTS=60
          POLL_INTERVAL=15
          sync_day=$(TZ=Asia/Shanghai date +%F)
          while read -r user; do
            [ -z "$user" ] && continue
            echo "==> POST /api/$user/sync user=$user"
            http="000"
            for attempt in $(seq 1 "$MAX_RETRIES"); do
              : > /tmp/resp.json
              # The Go API only enqueues the async data_sync pipeline, so a
              # request is short. Idempotency makes retries and a duplicate
              # scheduled run safe for the same user and Shanghai calendar day.
              http=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
                --max-time 30 \
                -X POST \
                -H "X-Internal-Token: $INTERNAL_TOKEN" \
                -H "Content-Type: application/json" \
                -H "Idempotency-Key: daily-sync-$sync_day-$user" \
                --data '{"mode":"incremental"}' \
                "${STRIDE_GO_API_URL%/}/api/$user/sync") || http="000"
              if [ "$http" -lt 500 ] && [ "$http" != "000" ]; then
                break
              fi
              if [ "$attempt" -eq "$MAX_RETRIES" ]; then
                break
              fi
              delay=$((2 ** attempt))
              [ "$delay" -gt 30 ] && delay=30
              echo "  retrying $user after HTTP $http in ${delay}s ($attempt/$MAX_RETRIES)"
              sleep "$delay"
            done

            body=$(python3 -c "from pathlib import Path; print(Path('/tmp/resp.json').read_text(errors='replace')[:500].replace(chr(10), ' '))")
            run_id=$(python3 -c "import json; print(json.load(open('/tmp/resp.json')).get('run_id', ''))" 2>/dev/null || true)
            if { [ "$http" = "202" ] || [ "$http" = "200" ]; } && [ -n "$run_id" ]; then
              # A 202 means only that the Go API enqueued the pipeline. Poll
              # until it completes so a later watch-sync or compute failure
              # makes this scheduled workflow fail visibly.
              terminal=""
              for poll in $(seq 1 "$MAX_POLL_ATTEMPTS"); do
                : > /tmp/resp.json
                poll_http=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
                  --max-time 30 \
                  -H "X-Internal-Token: $INTERNAL_TOKEN" \
                  "${STRIDE_GO_API_URL%/}/api/pipelines/$run_id") || poll_http="000"
                status=$(python3 -c "import json; print(json.load(open('/tmp/resp.json')).get('status', ''))" 2>/dev/null || true)
                if [ "$poll_http" = "200" ] && { [ "$status" = "done" ] || [ "$status" = "failed" ]; }; then
                  terminal="$status"
                  break
                fi
                if [ "$poll" -lt "$MAX_POLL_ATTEMPTS" ]; then
                  sleep "$POLL_INTERVAL"
                fi
              done
              body=$(python3 -c "from pathlib import Path; print(Path('/tmp/resp.json').read_text(errors='replace')[:500].replace(chr(10), ' '))")
              if [ "$terminal" = "done" ]; then
                ok=$((ok+1))
                echo "  ✓ $user (run $run_id completed)"
                echo "| $user | $http | $body |" >> "$GITHUB_STEP_SUMMARY"
              else
                fail=$((fail+1))
                echo "::warning::Sync pipeline did not complete for $user (run $run_id, status ${terminal:-unfinished}): $body"
                echo "| $user | $http | $body |" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              fail=$((fail+1))
              echo "::warning::Sync failed for $user (HTTP $http): $body"
              echo "| $user | $http | $body |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < users.txt

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Summary: $ok ok, $fail failed**" >> "$GITHUB_STEP_SUMMARY"
          echo "Summary: $ok ok, $fail failed"
          if [ "$fail" -gt 0 ]; then
            exit 1
          fi

      # ── #858 夜检扫描：数据同步完成后触发 coach_api 的 rolling-scan ──
      # 按用户循环跑完才扫（判定要读当天的最新活动）。所需的 GitHub 配置
      # （变量 STRIDE_COACH_API_URL + secret STRIDE_COACH_INTERNAL_TOKEN）尚未
      # 在 repo settings 配置：缺省只打 warning 跳过、不 fail 本 job，配置即生效。
      # 注意：secret 必须与 coach_api 部署侧的 STRIDE_COACH_API_INTERNAL_TOKEN
      # 同值（该端点鉴权的是 coach_api 自己的 inbound token，非 Go 的
      # STRIDE_GO_INTERNAL_TOKEN）。
      - name: Trigger coach rolling-scan (nightly)
        env:
          STRIDE_COACH_API_URL: ${{ vars.STRIDE_COACH_API_URL }}
          COACH_INTERNAL_TOKEN: ${{ secrets.STRIDE_COACH_INTERNAL_TOKEN }}
        run: |
          set -u
          if [ -z "$STRIDE_COACH_API_URL" ] || [ -z "$COACH_INTERNAL_TOKEN" ]; then
            echo "::warning::STRIDE_COACH_API_URL variable or STRIDE_COACH_INTERNAL_TOKEN secret missing — skipping nightly rolling-scan (configure them in repo settings; the secret must equal the coach_api deployment's STRIDE_COACH_API_INTERNAL_TOKEN)"
            exit 0
          fi
          # One retry on a transient failure (cold start / scale-to-zero), same
          # pattern as the sync-users GET above.
          scan() {
            curl -sS -o /tmp/scan.json -w "%{http_code}" --max-time 60 \
              -X POST \
              -H "X-Internal-Token: $COACH_INTERNAL_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "${STRIDE_COACH_API_URL%/}/api/internal/coach/rolling-scan"
          }
          http=$(scan) || http="000"
          if [ "$http" != "200" ]; then
            echo "  retrying rolling-scan after HTTP $http (cold start?)"
            sleep 15
            http=$(scan) || http="000"
          fi
          if [ "$http" != "200" ]; then
            echo "::warning::rolling-scan failed (HTTP $http): $(head -c 300 /tmp/scan.json 2>/dev/null | tr '\n' ' ')"
            exit 0
          fi
          echo "## Nightly rolling-scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          head -c 2000 /tmp/scan.json >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json
          s = json.load(open('/tmp/scan.json'))
          print('rolling-scan: scanned=%(scanned)d rolling_enqueued=%(rolling_enqueued)d adjust_enqueued=%(adjust_enqueued)d skipped=%(skipped)d' % {
            'scanned': s.get('scanned', 0),
            'rolling_enqueued': s.get('rolling_enqueued', 0),
            'adjust_enqueued': s.get('adjust_enqueued', 0),
            'skipped': len(s.get('skipped', [])),
          })
          for u in s.get('users', []):
              roll = u.get('rolling') or {}
              window = roll.get('window')
              dev = u.get('deviation')
              print('  %s: rolling=%s deviation=%s enqueued=%d' % (
                u.get('user_id'),
                ('W%d-W%d %s' % (window['start_week'], window['end_week'], window['mode'])) if window else ('skip (%s)' % roll.get('note', '')[:60]),
                ('%s@%s' % (dev.get('class'), dev.get('week_start'))) if dev else ('skip (%s)' % (u.get('deviation_note') or '')[:60]),
                len(u.get('enqueued', [])),
              ))
          "

      # Side-channel to the WeCom group; the action never fails this job.
      - name: Notify WeCom
        if: always()
        uses: zhaochy1990/configurations/notify-wecom@v1
        with:
          webhook_url: ${{ secrets.WECOM_WEBHOOK_URL }}
