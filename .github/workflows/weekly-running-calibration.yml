name: Weekly running calibration recompute

# Required GitHub Actions repository variable and secret:
#   STRIDE_GO_API_URL          — base URL of the deployed Go API, e.g.
#                               https://api.stride-running.cn
#   STRIDE_GO_INTERNAL_TOKEN  — random 32+ char string. The Go API must receive
#                               the same value as STRIDE_WORKER_API_INTERNAL_TOKEN.
# If a required secret or variable is unset the workflow fails so the omission is
# visible.

on:
  schedule:
    # Every Sunday at 04:00 UTC = 12:00 Asia/Shanghai
    - cron: '0 4 * * 0'
  workflow_dispatch: {}

jobs:
  recompute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build user UUID list from data/.slug_aliases.json
        id: users
        run: |
          if [ ! -f data/.slug_aliases.json ]; then
            echo "No data/.slug_aliases.json found — nothing to recompute"
            : > users.txt
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            python3 -c "
          import json
          aliases = json.load(open('data/.slug_aliases.json'))
          uuids = sorted(set(str(v) for v in aliases.values()))
          print('\n'.join(uuids))
          " > users.txt
            count=$(wc -l < users.txt | tr -d ' ')
            echo "count=$count" >> "$GITHUB_OUTPUT"
            echo "Found $count user(s):"
            cat users.txt
          fi

      - name: Recompute running calibration per user
        if: steps.users.outputs.count != '0'
        env:
          GO_API_URL: ${{ vars.STRIDE_GO_API_URL }}
          GO_INTERNAL_TOKEN: ${{ secrets.STRIDE_GO_INTERNAL_TOKEN }}
        run: |
          set -u
          if [ -z "$GO_API_URL" ] || [ -z "$GO_INTERNAL_TOKEN" ]; then
            echo "::error::STRIDE_GO_API_URL repository variable or STRIDE_GO_INTERNAL_TOKEN secret missing"
            exit 1
          fi
          ENDPOINT="/jobs"
          TIMEOUT=240

          echo "## Running calibration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Endpoint: \`$ENDPOINT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| user | http | response |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|----------|" >> "$GITHUB_STEP_SUMMARY"

          # POST once and echo the HTTP status. Each user/run pair gets a stable
          # idempotency key, so retrying after a lost response cannot queue a
          # second calibration. On a curl-level failure the guard turns it into
          # a sentinel status, so one user's failure never aborts the batch.
          attempt_post() {
            local url="$1"
            local user="$2"
            local code
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              --max-time "$TIMEOUT" \
              -X POST \
              -H "X-Internal-Token: $GO_INTERNAL_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: weekly-calibration-${GITHUB_RUN_ID}-${user}" \
              --data "{\"type\":\"calibration\",\"user_id\":\"$user\",\"input\":{}}" \
              "$url") || code="000"
            echo "$code"
          }

          fail=0
          ok=0
          while read -r user; do
            [ -z "$user" ] && continue
            url="${GO_API_URL%/}$ENDPOINT"
            echo "==> POST $url"
            http=$(attempt_post "$url" "$user")
            # One retry on any transient failure (cold start / timeout / 5xx).
            # Cold-start of the scaled-to-zero container takes ~15s, so wait
            # long enough for it to be up before the second attempt.
            if [ "$http" != "200" ] && [ "$http" != "202" ]; then
              echo "  ↻ retrying $user (first attempt HTTP $http)"
              sleep 15
              http=$(attempt_post "$url" "$user")
            fi
            body=$(head -c 500 /tmp/resp.json | tr '\n' ' ')
            if [ "$http" = "200" ] || [ "$http" = "202" ]; then
              ok=$((ok+1))
              echo "  ✓ $user (HTTP $http)"
              echo "    response: $body"
              echo "| $user | $http | $body |" >> "$GITHUB_STEP_SUMMARY"
            else
              fail=$((fail+1))
              echo "::warning::Calibration failed for $user (HTTP $http): $body"
              echo "| $user | $http | $body |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < users.txt

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Summary: $ok ok, $fail failed**" >> "$GITHUB_STEP_SUMMARY"
          echo "Summary: $ok ok, $fail failed"
          if [ "$fail" -gt 0 ]; then
            exit 1
          fi
