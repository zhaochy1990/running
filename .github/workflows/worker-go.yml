name: worker-go

# Go async-job CI: test on every change under src/go, and on master build+push
# both images to GHCR — the worker (Dockerfile) and the HTTP API server
# (Dockerfile.api, ADR 0012). The CVM pulls from GHCR (ADR 0002 / 0004).
on:
  push:
    branches: [master]
    paths: ["src/go/**", ".github/workflows/worker-go.yml"]
  pull_request:
    paths: ["src/go/**", ".github/workflows/worker-go.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go/go.mod
          cache-dependency-path: src/go/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build-push:
    # Only publish from master, never from PRs.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: src/go
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stride-worker:latest
            ghcr.io/${{ github.repository_owner }}/stride-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: src/go
          file: src/go/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stride-api:latest
            ghcr.io/${{ github.repository_owner }}/stride-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
