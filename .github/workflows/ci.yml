name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest + lint-imports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # Match Dockerfile (python:3.13-slim); pyproject requires >=3.12.
          python-version: '3.13'
          cache: 'pip'

      - name: Install backend (dev extras)
        run: pip install -e ".[web,dev]"

      - name: Verify import contracts
        run: lint-imports

      - name: Run backend tests
        run: pytest -q -n auto

  frontend:
    name: Frontend (vitest + prod build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          cd frontend
          npm install

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test

      # The production Dockerfile invokes `npm run build` (= `tsc -b && vite
      # build`), which applies project-reference strictness (e.g.
      # `noUnusedLocals`) that `vitest` and `tsc --noEmit` skip. Running the
      # same build here closes the gap that let PR #33 ship an unused-import
      # TS6133 error to deploy and broke prod for three back-to-back PRs.
      - name: Build frontend (matches prod Dockerfile)
        run: |
          cd frontend
          npm run build

  web-bff:
    name: Web BFF (typecheck + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/server/package-lock.json

      - name: Install
        run: |
          cd frontend/server
          npm ci

      # tsc --noEmit checks every src file including __tests__ (routing table +
      # proxy) so a type error in the strangler seam fails the PR.
      - name: Typecheck
        run: |
          cd frontend/server
          npm run typecheck

      # Dockerfile.web runs `npm run build` (tsc -p tsconfig.build.json). Run it
      # here so a compile error in the BFF fails the PR, not the deploy.
      - name: Build
        run: |
          cd frontend/server
          npm run build

      - name: Test
        run: |
          cd frontend/server
          npm run test

