# stride-web static container (no BFF): serve the built SPA + strength assets.
# /api/* is NOT served here — Caddy routes it to the backends before this
# container is reached.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container health probe (ACA ingress).
    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed bundles — immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Strength illustration library (baked into this image).
    location /strength_illustrations/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes (/week/..., /activity/..., etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
